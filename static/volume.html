<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Volume Profile · My-Trade</title>
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<script src="/static/vendor/lightweight-charts.js"></script>
<script src="/static/volprofile.js"></script>
<!-- The Volume Profile page (12 November, the owner: "build a new page with header name as volume profile ... the chart format
     which dhan uses for pc and mobile"). A page of its own: it reads the index's candles and the futures' volume, draws them,
     and decides nothing. Paper calls and Calls with Signals are not read here and do not read this page. The chart is drawn
     with the free chart library the other pages use, laid out the way a broker's trading chart is: a tool row on top, the
     prices on the right, the figures of the candle under the pointer top left, the volume along the bottom. -->
<style>
  :root {
    color-scheme: light;
    --page: #ffffff; --surface: #ffffff; --border: #e0e3eb; --grid: #f0f3fa;
    --ink: #131722; --ink-2: #434651; --muted: #787b86;
    --up: #089981; --down: #f23645; --accent: #2962ff; --hover: #f0f3fa;
    --vp-up: #5b9cf6; --vp-down: #f5b83d; --poc: #e0245e; --va: #787b86; --rsi: #7e57c2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #131722; --surface: #131722; --border: #2a2e39; --grid: #1e222d;
      --ink: #d1d4dc; --ink-2: #b2b5be; --muted: #787b86;
      --up: #089981; --down: #f23645; --accent: #5b9cf6; --hover: #2a2e39;
      --vp-up: #3d7fd9; --vp-down: #c9912a; --poc: #ff5c8a; --va: #9598a1; --rsi: #b39ddb;
    }
  }
  * { box-sizing: border-box; }
  /* The page itself never moves (13 November, the owner: "i want chart background fixed, then i can move the things": the
     whole page must not scroll or shake when the chart is moved). It is pinned to the screen, it cannot be scrolled, bounced,
     pulled down to refresh or pinched larger, and a drag does not mark its words; only what is inside the chart moves. */
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  body { position: fixed; inset: 0; width: 100%; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-text-size-adjust: 100%; }
  #tools, #info, #draw { touch-action: pan-x; overscroll-behavior: contain; }
  #wrap, #chart { overscroll-behavior: none; }
  body { background: var(--page); color: var(--ink); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Trebuchet MS", Roboto, Ubuntu, sans-serif; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); border-bottom: 1px solid var(--border); flex: none; }
  header a { color: var(--ink-2); text-decoration: none; font-size: 13px; padding: 4px 8px; border-radius: 6px; }
  header a:hover { background: var(--hover); }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; flex: 1; }
  #status { font-size: 12px; color: var(--muted); white-space: nowrap; }
  #status.error { color: var(--down); }
  #tools { display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-bottom: 1px solid var(--border); overflow-x: auto; flex: none; scrollbar-width: none; }
  #tools::-webkit-scrollbar { display: none; }
  #tools select, #tools button { font: inherit; font-size: 14px; color: var(--ink); background: transparent; border: 0; border-radius: 6px; padding: 8px 10px; cursor: pointer; white-space: nowrap; min-height: 36px; }
  #tools select { font-weight: 600; padding-right: 4px; }
  #tools button:hover, #tools select:hover { background: var(--hover); }
  #tools button[aria-pressed="true"] { color: var(--accent); font-weight: 600; }
  #tools label.box { gap: 4px; padding: 0 0 0 10px; color: var(--muted); border: 1px solid var(--border); margin: 0 2px; }
  #tools label.box select { color: var(--accent); padding-left: 4px; }
  #tools .sep { width: 1px; align-self: stretch; margin: 6px 4px; background: var(--border); flex: none; }
  #tools label { display: flex; align-items: center; gap: 6px; font-size: 14px; padding: 8px 10px; white-space: nowrap; cursor: pointer; border-radius: 6px; min-height: 36px; }
  #tools label:hover { background: var(--hover); }
  #main { display: flex; flex: 1; min-height: 0; }
  /* the drawing tools (12 November, the owner: "add drawing tools and RSI"): a column on the left of the chart; on a phone a row above it */
  #draw { display: flex; flex-direction: column; gap: 2px; padding: 6px 4px; border-right: 1px solid var(--border); flex: none; }
  #draw button { width: 36px; height: 36px; display: grid; place-items: center; background: transparent; border: 0; border-radius: 6px; color: var(--ink-2); cursor: pointer; padding: 0; }
  #draw button:hover { background: var(--hover); }
  #draw button[aria-pressed="true"] { color: var(--accent); background: var(--hover); }
  #draw button:disabled { opacity: 0.35; cursor: default; background: transparent; }
  #draw svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  #draw .sep { height: 1px; margin: 4px 6px; background: var(--border); }
  #wrap { position: relative; flex: 1; min-width: 0; min-height: 0; }
  #wrap.drawing #chart { cursor: crosshair; }
  #wrap.moving #chart { cursor: grabbing; }
  #chart { touch-action: none; }
  #chart { position: absolute; inset: 0; }
  #legend { position: absolute; left: 8px; top: 6px; right: 70px; z-index: 3; pointer-events: none; font-size: 12px; line-height: 1.55; color: var(--ink-2); }
  #legend .row { display: flex; flex-wrap: wrap; gap: 0 8px; align-items: baseline; }
  #legend .sym { font-size: 14px; font-weight: 600; color: var(--ink); }
  #legend .k { color: var(--muted); }
  #legend .v { color: var(--ink); font-variant-numeric: tabular-nums; }
  #legend .v.up { color: var(--up); } #legend .v.down { color: var(--down); }
  #legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  #legend i.line { height: 2px; vertical-align: 3px; border-radius: 0; }
  /* the figures of the indicators (13 November, the owner, with the words on the chart marked: "when i scroll the chart up and
     down it goes into the chart ... remove it"): one line above the chart, never over the candles; on a narrow screen it slides sideways */
  #info { display: flex; gap: 0 14px; align-items: baseline; padding: 4px 12px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow-x: auto; flex: none; min-height: 27px; scrollbar-width: none; }
  #info::-webkit-scrollbar { display: none; }
  #info .k { color: var(--muted); } #info .v { color: var(--ink); font-variant-numeric: tabular-nums; }
  #info i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  #info i.line { height: 2px; vertical-align: 3px; border-radius: 0; }
  #info .cut { width: 1px; align-self: stretch; background: var(--border); flex: none; }
  /* the chart's own buttons (13 November, the owner: "there is no manual zoom in and zoom out button on the chart, add those, also add
     left right up down buttons"): a row at the foot of the candles, in the middle */
  #nav { position: absolute; left: 50%; transform: translateX(-50%); top: 0; z-index: 4; display: flex; gap: 2px; padding: 3px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08); opacity: 0.92; visibility: hidden; }
  #nav button { width: 32px; height: 32px; display: grid; place-items: center; background: transparent; border: 0; border-radius: 6px; color: var(--ink-2); cursor: pointer; padding: 0; touch-action: manipulation; }
  #nav button:hover { background: var(--hover); color: var(--ink); }
  #nav button:active { color: var(--accent); }
  #nav svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #nav .sep { width: 1px; margin: 5px 2px; background: var(--border); }
  #note { margin: 0; padding: 6px 12px; padding-bottom: max(6px, env(safe-area-inset-bottom)); font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); flex: none; }
  #note.warn { color: var(--ink-2); }
  @media (max-width: 600px) {
    #main { flex-direction: column; }
    #draw { flex-direction: row; padding: 2px 8px; border-right: 0; border-bottom: 1px solid var(--border); overflow-x: auto; }
    #draw .sep { width: 1px; height: auto; margin: 6px 4px; }
    header h1 { font-size: 15px; }
    #legend { font-size: 11px; right: 58px; }
    #legend .sym { font-size: 13px; }
    #status { display: none; }
  }
</style>
</head>
<body>
  <header>
    <a id="back" href="/">‹ My-Trade</a>
    <h1>Volume Profile</h1>
    <span id="status">Loading…</span>
  </header>
  <div id="tools" role="toolbar" aria-label="Chart settings">
    <select id="index" aria-label="Index"><option>NIFTY 50</option><option>NIFTY BANK</option><option>SENSEX</option></select>
    <span class="sep"></span>
    <!-- the time frame boxes (13 November, the owner, with the 1m 5m 15m 1D 5D buttons marked: "add this as a time frame box with
         drop down options and also add as 2D, 3D as well"): the candle size in one box, the days shown in the other -->
    <label class="box">Time frame <select id="interval" aria-label="Time frame"><option value="1m">1m</option><option value="5m">5m</option><option value="15m">15m</option></select></label>
    <label class="box">Days <select id="days" aria-label="Days shown"><option value="1">1D</option><option value="2">2D</option><option value="3">3D</option><option value="5">5D</option></select></label>
    <span class="sep"></span>
    <label><input type="checkbox" id="show-volume" checked> Volume</label>
    <label><input type="checkbox" id="show-rsi" checked> RSI</label>
  </div>
  <div id="info" aria-live="off"></div>
  <div id="main">
    <div id="draw" role="toolbar" aria-label="Drawing tools">
      <button type="button" data-tool="" aria-pressed="true" title="Pointer: move the chart, tap a drawing to pick it" aria-label="Pointer"><svg viewBox="0 0 20 20"><path d="M5 3l10 7-4.5 1 2.5 5-2 1-2.5-5L5 15z"/></svg></button>
      <button type="button" data-tool="line" aria-pressed="false" title="Trend line: tap two points" aria-label="Trend line"><svg viewBox="0 0 20 20"><path d="M4 16L16 4"/><circle cx="4" cy="16" r="1.6"/><circle cx="16" cy="4" r="1.6"/></svg></button>
      <button type="button" data-tool="hline" aria-pressed="false" title="Horizontal line: tap a price" aria-label="Horizontal line"><svg viewBox="0 0 20 20"><path d="M2 10h16"/><circle cx="10" cy="10" r="1.6"/></svg></button>
      <button type="button" data-tool="vline" aria-pressed="false" title="Vertical line: tap a time" aria-label="Vertical line"><svg viewBox="0 0 20 20"><path d="M10 2v16"/><circle cx="10" cy="10" r="1.6"/></svg></button>
      <button type="button" data-tool="box" aria-pressed="false" title="Box: tap two corners" aria-label="Box"><svg viewBox="0 0 20 20"><rect x="3.5" y="5.5" width="13" height="9" rx="1"/></svg></button>
      <button type="button" data-tool="fib" aria-pressed="false" title="Fibonacci levels: tap the start and the end of a move" aria-label="Fibonacci levels"><svg viewBox="0 0 20 20"><path d="M3 4h14M3 8h14M3 11h14M3 16h14"/></svg></button>
      <button type="button" data-tool="text" aria-pressed="false" title="Note: tap a place and type" aria-label="Note"><svg viewBox="0 0 20 20"><path d="M5 5h10M10 5v11"/></svg></button>
      <span class="sep"></span>
      <button type="button" id="draw-delete" disabled title="Delete the picked drawing" aria-label="Delete the picked drawing"><svg viewBox="0 0 20 20"><path d="M4 6h12M8 6V4h4v2M6 6l1 10h6l1-10"/></svg></button>
      <button type="button" id="draw-clear" disabled title="Remove all drawings of this index" aria-label="Remove all drawings"><svg viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
    </div>
    <div id="wrap">
      <div id="legend" aria-live="off"></div>
      <div id="nav" role="toolbar" aria-label="Move and zoom the chart">
        <button type="button" data-nav="out" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 18 18"><path d="M4 9h10"/></svg></button>
        <button type="button" data-nav="in" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 18 18"><path d="M4 9h10M9 4v10"/></svg></button>
        <span class="sep"></span>
        <button type="button" data-nav="left" title="Move left (earlier)" aria-label="Move left"><svg viewBox="0 0 18 18"><path d="M11 4L6 9l5 5"/></svg></button>
        <button type="button" data-nav="right" title="Move right (later)" aria-label="Move right"><svg viewBox="0 0 18 18"><path d="M7 4l5 5-5 5"/></svg></button>
        <button type="button" data-nav="up" title="Move up (higher prices)" aria-label="Move up"><svg viewBox="0 0 18 18"><path d="M4 11l5-5 5 5"/></svg></button>
        <button type="button" data-nav="down" title="Move down (lower prices)" aria-label="Move down"><svg viewBox="0 0 18 18"><path d="M4 7l5 5 5-5"/></svg></button>
        <span class="sep"></span>
        <button type="button" data-nav="reset" title="Back to the whole view" aria-label="Back to the whole view"><svg viewBox="0 0 18 18"><path d="M4 9a5 5 0 1 0 1.6-3.7M4 3.5v2.5h2.5"/></svg></button>
      </div>
      <div id="chart"></div>
    </div>
  </div>
  <p id="note"></p>

<script>
(function () {
  "use strict";
  const IST = 19800;  // the chart library draws times as UTC: every time is moved by the IST offset on its way in
  const BARS_A_DAY = { "1m": 375, "5m": 75, "15m": 25 };
  const params = new URLSearchParams(location.search);
  const state = { name: "NIFTY 50", interval: "5m", days: 1, bars: [], volumes: new Map(), fine: [], fineVolumes: new Map(), contract: null, problem: null, sessions: [], profiles: [], hover: null };
  try { const saved = JSON.parse(localStorage.getItem("volumeProfile") || "null"); if (saved) { if (BARS_A_DAY[saved.interval]) state.interval = saved.interval; if ([1, 2, 3, 5].includes(saved.days)) state.days = saved.days; if (saved.name) state.name = saved.name; if (saved.volume === false) document.getElementById("show-volume").checked = false; if (saved.rsi === false) document.getElementById("show-rsi").checked = false; } } catch (e) {}
  if (params.get("index")) state.name = params.get("index").toUpperCase();
  const $ = (id) => document.getElementById(id);
  if (![...$("index").options].some(o => o.value === state.name)) state.name = "NIFTY 50";
  $("index").value = state.name;

  // The login's "tab" note and this page's id, as the other pages keep them
  let TAB = "";
  try { TAB = sessionStorage.getItem("tab") || ""; } catch (e) {}
  const handed = new URLSearchParams(location.hash.slice(1)).get("t");
  if (handed) { TAB = handed; try { sessionStorage.setItem("tab", TAB); } catch (e) {} history.replaceState(null, "", location.pathname + location.search); }
  $("back").href = "/#t=" + encodeURIComponent(TAB);
  let PAGE = "";
  const withTab = () => ({ headers: { "X-Tab": TAB, "X-Page": PAGE } });
  let loadedCommit = null;
  function newDeploy(commit) {
    if (!commit) return false;
    if (loadedCommit === null) { loadedCommit = commit; return false; }
    if (commit === loadedCommit) return false;
    let last = 0; try { last = parseInt(sessionStorage.getItem("reloaded-at") || "0", 10); } catch (e) {}
    if (Date.now() - last < 60000) return false;
    try { sessionStorage.setItem("reloaded-at", String(Date.now())); } catch (e) {}
    location.reload();
    return true;
  }

  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const alpha = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255}, ${n >> 8 & 255}, ${n & 255}, ${a})`; };
  const num = (x, d = 2) => x == null ? "—" : Number(x).toLocaleString("en-IN", { minimumFractionDigits: d, maximumFractionDigits: d });
  const short = (v) => v == null ? "—" : v >= 1e7 ? (v / 1e6).toFixed(1) + "M" : v >= 1e6 ? (v / 1e6).toFixed(2) + "M" : v >= 1e3 ? (v / 1e3).toFixed(v >= 1e5 ? 0 : 1) + "K" : String(Math.round(v));
  const hhmm = (t) => new Date((t + IST) * 1000).toISOString().slice(11, 16);
  const dayOf = (t) => new Date((t + IST) * 1000).toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: "UTC" });

  // ---------------------------------------------------------------- the chart
  const LC = LightweightCharts;
  const chart = LC.createChart($("chart"), {
    autoSize: true,
    layout: { attributionLogo: false, fontSize: 12, fontFamily: getComputedStyle(document.body).fontFamily },
    rightPriceScale: { scaleMargins: { top: 0.12, bottom: 0.22 } },
    timeScale: { timeVisible: true, secondsVisible: false, rightOffset: 6, barSpacing: 9, minBarSpacing: 1 },
    crosshair: { mode: LC.CrosshairMode.Normal },
    localization: { priceFormatter: (p) => num(p), timeFormatter: (t) => { const d = new Date(t * 1000); return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "2-digit", timeZone: "UTC" }) + "  " + d.toISOString().slice(11, 16); } },
  });
  const candles = chart.addSeries(LC.CandlestickSeries, { priceLineVisible: true, lastValueVisible: true });
  const volume = chart.addSeries(LC.HistogramSeries, { priceScaleId: "", priceFormat: { type: "volume" }, lastValueVisible: false, priceLineVisible: false });
  volume.priceScale().applyOptions({ scaleMargins: { top: 0.84, bottom: 0 } });
  // a narrow screen: the words top left take more lines, so the candles start lower
  const roomOnTop = () => chart.priceScale("right").applyOptions({ scaleMargins: state.priceView ? { top: 0, bottom: 0 } : { top: innerWidth <= 600 ? 0.13 : 0.08, bottom: 0.22 } });
  roomOnTop(); addEventListener("resize", roomOnTop);

  function paint() {
    const up = css("--up"), down = css("--down");
    chart.applyOptions({
      layout: { background: { color: css("--surface") }, textColor: css("--ink-2") },
      grid: { vertLines: { color: css("--grid") }, horzLines: { color: css("--grid") } },
      rightPriceScale: { borderColor: css("--border") }, timeScale: { borderColor: css("--border") },
      crosshair: { vertLine: { color: css("--muted"), labelBackgroundColor: css("--ink-2") }, horzLine: { color: css("--muted"), labelBackgroundColor: css("--ink-2") } },
    });
    candles.applyOptions({ upColor: up, downColor: down, borderUpColor: up, borderDownColor: down, wickUpColor: up, wickDownColor: down });
    setVolume();
    if (rsi) rsi.applyOptions({ color: css("--rsi") });
    profile.requestUpdate && profile.requestUpdate(); redraw();
  }

  // ---------------------------------------------------------------- the profile, drawn behind the candles
  // With one day shown, the day's profile stands at the right edge and grows to the left, in the room kept free beside the
  // candles; with five days, each day's profile starts at its first candle and grows to the right. The longer a row, the
  // more was traded (or, without volume, the more time was spent) at that price. Blue: in rising candles; amber: in falling ones. The rows
  // of the value area are drawn strong, the others faint. A line marks the busiest price of each day.
  const profile = {
    attached(p) { this.requestUpdate = p.requestUpdate; },
    detached() { this.requestUpdate = null; },
    updateAllViews() {},
    paneViews() { return [this.view]; },
    view: { zOrder: () => "bottom", renderer: () => ({ draw: (target) => target.useBitmapCoordinateSpace(drawProfiles) }) },
  };
  candles.attachPrimitive(profile);

  function drawProfiles(scope) {
    if (!state.profiles.length) return;  // the profile is always drawn: the page is for it (the owner, 12 November: "volume profile should always be there")
    const ctx = scope.context, hr = scope.horizontalPixelRatio, vr = scope.verticalPixelRatio, paneW = scope.mediaSize.width;
    const ts = chart.timeScale(), spacing = ts.options().barSpacing, full = BARS_A_DAY[state.interval] * spacing;
    const cUp = css("--vp-up"), cDown = css("--vp-down"), cPoc = css("--poc"), cVa = css("--va");
    state.profiles.forEach((s, k) => {
      const p = s.profile; if (!p || !(p.total > 0)) return;
      const x0c = ts.timeToCoordinate(s.bars[0].time + IST); if (x0c == null) return;
      const x0 = x0c - spacing / 2, lastDay = k === state.profiles.length - 1, right = state.days === 1;
      // One day: the profile stands at the end of the day's own room on the time line (where the whole view ends), not at the
      // screen's edge, and it is as wide as a fixed share of that room: so it moves left and right with the candles and
      // grows and shrinks with them (the owner, 13 November: "whenever i move up n down, left or right, or make it small or
      // bigger every price action moves in the same direction and volume profile also in the same direction")
      const day = BARS_A_DAY[state.interval], edge = x0c + day * 1.36 * spacing;
      if (right ? (x0 > paneW || edge < 0) : (x0 > paneW || x0 + full < 0)) return;
      const width = right ? (day * 1.36 + 1.5) * spacing * 0.24 : full * 0.42;
      const rect = (from, len, yTop, h) => { const a = right ? edge - from - len : x0 + from; ctx.fillRect(Math.round(a * hr), Math.round(yTop * vr), Math.max(0, Math.round(len * hr)), Math.max(1, Math.round(h * vr))); };
      const most = Math.max(...p.rows.map(r => r.total));
      p.rows.forEach((r, i) => {
        if (!(r.total > 0)) return;
        const yTop = candles.priceToCoordinate(r.price + p.step), yBot = candles.priceToCoordinate(r.price);
        if (yTop == null || yBot == null) return;
        const h = Math.max(1, (yBot - yTop) - (yBot - yTop > 3 ? 1 : 0)), len = r.total / most * width, inside = i >= p.vaFrom && i <= p.vaTo;
        const upLen = len * (r.up / r.total);
        ctx.globalAlpha = inside ? (right ? 0.7 : 0.45) : (right ? 0.3 : 0.18);
        ctx.fillStyle = cUp; rect(0, upLen, yTop, h);
        ctx.fillStyle = cDown; rect(upLen, len - upLen, yTop, h);
      });
      ctx.globalAlpha = 1;
      const line = (price, color, dash, w) => {
        const y = candles.priceToCoordinate(price); if (y == null) return;
        ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = Math.max(1, Math.round(w * vr)); ctx.setLineDash(dash.map(d => d * hr));
        ctx.beginPath(); const yy = Math.round(y * vr) + 0.5; ctx.moveTo(Math.round(Math.max(0, x0) * hr), yy); ctx.lineTo(Math.round((right ? edge : x0 + full) * hr), yy); ctx.stroke(); ctx.restore();
      };
      line(p.poc, cPoc, [], 1.5);
      line(p.vah, cVa, [4, 4], 1); line(p.val, cVa, [4, 4], 1);
    });
  }

  // ---------------------------------------------------------------- RSI (12 November, the owner: "add drawing tools and RSI")
  // The usual RSI: 14 candles, Wilder's smoothing, on the closes of the candle size shown; its own strip under the chart, with
  // the 70 and 30 lines. It is counted over every candle the page holds (five days), so the day shown starts with a settled value.
  const RSI_LENGTH = 14;
  let rsi = null;
  function rsiSeries(bars, n = RSI_LENGTH) {
    const out = new Map(); let up = 0, down = 0;

    if (b.time < last.time) return;
    if (b.time === last.time) Object.assign(last, { high: Math.max(last.high, b.high), low: Math.min(last.low, b.low), close: b.close }); else state.bars.push({ ...b });
    const m = tick.bars["1m"];  // the profile's 1-minute candles follow the price too
    if (m && state.fine.length && state.fine !== state.bars) { const f = state.fine[state.fine.length - 1]; if (m.time === f.time) Object.assign(f, { high: Math.max(f.high, m.high), low: Math.min(f.low, m.low), close: m.close }); else if (m.time > f.time) state.fine.push({ ...m }); }
    const now = state.bars[state.bars.length - 1];
    candles.update({ time: now.time + IST, open: now.open, high: now.high, low: now.low, close: now.close });
    if (Date.now() - recount > 1000) { recount = Date.now(); rebuild(); if (rsi) { state.rsi = rsiSeries(state.bars); const v = state.rsi.get(now.time); if (v != null) rsi.update({ time: now.time + IST, value: v }); } }
  }

  // ---------------------------------------------------------------- the words on the chart
  function drawLegend() {
    const days = shown(); if (!days.length) { $("legend").textContent = ""; $("info").textContent = ""; return; }
    const bars = days.flat(), at = state.hover && bars.find(b => b.time === state.hover.time) || bars[bars.length - 1];
    const i = state.bars.indexOf(at), before = i > 0 ? state.bars[i - 1].close : at.open, ch = at.close - before, tone = at.close >= at.open ? "up" : "down";
    const day = state.profiles.find(s => s.bars.includes(at)) || state.profiles[state.profiles.length - 1], p = day && day.profile;
    const v = state.volumes.get(at.time);
    const f = (label, x) => `<span><span class="k">${label}</span> <span class="v ${tone}">${num(x)}</span></span>`;
    let html = `<div class="row"><span class="sym">${state.name}</span><span class="k">${state.interval} · ${dayOf(at.time)} ${hhmm(at.time)}</span>${f("O", at.open)}${f("H", at.high)}${f("L", at.low)}${f("C", at.close)}<span class="v ${ch >= 0 ? "up" : "down"}">${ch >= 0 ? "+" : "−"}${num(Math.abs(ch))} (${(ch / before * 100 >= 0 ? "+" : "−") + Math.abs(ch / before * 100).toFixed(2)}%)</span></div>`;
    let info = "";  // the indicators' figures: in the line above the chart, not on it
    if (state.rsi && state.rsi.has(at.time)) info += `<span><i class="line" style="background:var(--rsi)"></i><span class="k">RSI ${RSI_LENGTH}</span> <span class="v">${state.rsi.get(at.time).toFixed(2)}</span></span><span class="cut"></span>`;
    if (!state.timeOnly) info += `<span><span class="k">Volume${state.contract ? " (" + state.contract.name + ")" : ""}</span> <span class="v">${short(v)}</span></span><span class="cut"></span>`;
    if (p && p.total > 0) {
      const what = state.timeOnly ? "time" : "volume";
      info += `<span><i class="line" style="background:var(--poc)"></i><span class="k">Busiest price</span> <span class="v">${num(p.poc)}</span></span><span><span class="k">70% of the ${what} between</span> <span class="v">${num(p.val)} – ${num(p.vah)}</span></span>${state.timeOnly ? "" : `<span><span class="k">Day's volume</span> <span class="v">${short(p.total)}</span></span>`}<span class="cut"></span>`;
      if (state.hover && state.hover.price != null) {
        const r = p.rows[Math.floor((state.hover.price - p.rows[0].price) / p.step)];
        if (r && r.total > 0) info += `<span class="cut"></span><span><span class="k">At ${num(r.price)} – ${num(r.price + p.step)}</span> <span class="v">${state.timeOnly ? (r.total / p.total * 100).toFixed(1) + "% of the day's time" : short(r.total) + " (" + (r.total / p.total * 100).toFixed(1) + "% of the day)"}</span></span><span><i style="background:var(--vp-up)"></i><span class="k">rising candles</span> <span class="v">${Math.round(r.up / r.total * 100)}%</span></span><span><i style="background:var(--vp-down)"></i><span class="k">falling</span> <span class="v">${Math.round(r.down / r.total * 100)}%</span></span><span class="cut"></span>`;
      }
    }
    $("info").innerHTML = info.replace(/<span class="cut"><\/span>$/, "");
    $("legend").innerHTML = html;
  }
  function drawNote() {
    const note = $("note");
    if (!state.bars.length) { note.className = "warn"; note.textContent = "No candles yet."; return; }
    if (state.timeOnly) { note.className = "warn"; note.textContent = "No volume from Dhan right now" + (state.problem ? " (" + state.problem + ")" : "") + ". The rows show how much TIME the price spent at each level, not how much was traded."; return; }
    note.className = "";
    note.textContent = `An index has no volume of its own: the rows use the volume of ${state.contract ? state.contract.name + " (expiry " + state.contract.expiry + ")" : "the index's futures"}, from Dhan. Blue: traded in rising candles. Amber: in falling ones. Not a call.`;
  }

  chart.subscribeCrosshairMove((param) => {
    const had = state.hover;
    if (!param || param.time == null || !param.point) state.hover = null;
    else state.hover = { time: param.time - IST, price: candles.coordinateToPrice(param.point.y) };
    if (had || state.hover) drawLegend();
    if (draw.first) { const at = pointAt(param); if (at) { draw.hover = { time: at.time, price: at.price }; redraw(); } }
  });

  // ---------------------------------------------------------------- the tool row
  const save = () => { try { localStorage.setItem("volumeProfile", JSON.stringify({ name: state.name, interval: state.interval, days: state.days, volume: $("show-volume").checked, rsi: $("show-rsi").checked })); } catch (e) {} };
  function press() { $("interval").value = state.interval; $("days").value = String(state.days); }
  $("interval").addEventListener("change", () => { state.interval = $("interval").value; state.bars = []; state.fine = []; save(); load(); });
  $("days").addEventListener("change", () => { state.days = Number($("days").value); save(); shownKey = state.name + state.interval + state.days; setAll(true); });
  $("index").addEventListener("change", () => { state.name = $("index").value; state.bars = []; state.fine = []; loadDrawings(); save(); load(); reconnect(); });
  // every indicator but the profile has its switch, and the page remembers how each was left
  $("show-volume").addEventListener("change", () => { setVolume(); save(); });
  $("show-rsi").addEventListener("change", () => { setRsi(); drawLegend(); save(); });
  loadDrawings();
  press();

  // ---------------------------------------------------------------- staying connected, as the other pages do
  async function beat() {
    try {
      const r = await fetch("/alive", { method: "POST", ...withTab() });
      if (r.status === 401) { location.href = "/login"; return; }
      if (r.ok) { const data = await r.json(); if (newDeploy(data.commit)) return; if (data.page) PAGE = data.page; }
    } catch (e) {}
  }
  let liveWs = null, parked = false;
  const wsUrl = () => (location.protocol === "https:" ? "wss" : "ws") + "://" + location.host + "/ws?tab=" + encodeURIComponent(TAB) + "&page=" + encodeURIComponent(PAGE) + "&live=" + encodeURIComponent(state.name);
  function keepAlive() {
    if (parked) return;
    const ws = liveWs = new WebSocket(wsUrl());
    ws.onmessage = (event) => { const data = JSON.parse(event.data); if (newDeploy(data.commit)) return; if (data.page) PAGE = data.page; if (data.tick) applyTick(data.tick); };
    ws.onclose = () => { if (parked || ws !== liveWs) return; beat(); setTimeout(keepAlive, 3000); };
    ws.onerror = () => ws.close();
  }
  function reconnect() { const old = liveWs; liveWs = null; if (old && old.readyState <= WebSocket.OPEN) old.close(); keepAlive(); }
  beat().then(() => { load(); keepAlive(); });
  setInterval(beat, 15000);
  setInterval(() => { if (!document.hidden) load(); }, 20000);  // the closed candles and the futures' volume, every 20 s
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
  window.addEventListener("pagehide", () => { parked = true; if (liveWs && liveWs.readyState <= WebSocket.OPEN) liveWs.close(); });
  window.addEventListener("pageshow", (event) => { if (!event.persisted) return; parked = false; beat().then(() => { load(); keepAlive(); }); });
  // The page stays where it is: whatever tries to scroll it is put back at once; the wheel with Ctrl held, a pinch on a
  // touch pad and a two-finger pinch on a phone zoom the chart only (the chart does that itself), never the page
  const pinPage = () => { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); for (const el of [document.documentElement, document.body, $("main"), $("wrap")]) { if (el.scrollTop) el.scrollTop = 0; if (el.scrollLeft) el.scrollLeft = 0; } };
  window.addEventListener("scroll", pinPage, true);
  window.addEventListener("wheel", (e) => { if (e.ctrlKey || !e.target.closest("#chart, #tools, #info, #draw")) e.preventDefault(); }, { passive: false });
  for (const kind of ["gesturestart", "gesturechange", "gestureend"]) document.addEventListener(kind, (e) => e.preventDefault());
  document.addEventListener("touchmove", (e) => { if (e.touches.length > 1 && !e.target.closest("#chart")) e.preventDefault(); }, { passive: false });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paint);
  paint();
})();
</script>
</body>
</html>
