<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Volume Profile · My-Trade</title>
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<script src="/static/vendor/lightweight-charts.js"></script>
<script src="/static/volprofile.js"></script>
<script src="/static/vpshape.js"></script>
<script src="/static/impulse.js"></script>
<!-- The Volume Profile page (12 November, the owner: "build a new page with header name as volume profile ... the chart format
     which dhan uses for pc and mobile"). A page of its own: it reads the index's candles and the futures' volume, draws them,
     and decides nothing. Paper calls and Calls with Signals are not read here and do not read this page. The chart is drawn
     with the free chart library the other pages use, laid out the way a broker's trading chart is: a tool row on top, the
     prices on the right, the figures of the candle under the pointer top left, the volume along the bottom. -->
<style>
  :root {
    color-scheme: light;
    --page: #ffffff; --surface: #ffffff; --border: #e0e3eb; --grid: #f0f3fa;
    --ink: #131722; --ink-2: #434651; --muted: #787b86;
    --up: #089981; --down: #f23645; --accent: #2962ff; --hover: #f0f3fa;
    --vp-up: #5b9cf6; --vp-down: #f5b83d; --poc: #e0245e; --va: #787b86; --rsi: #7e57c2; --vwap: #0891b2; --imp-lime: #22c55e; --imp-green: #15803d; --imp-orange: #f59e0b; --imp-red: #ef4444; --imp-hist: #2962ff; --imp-signal: #800000;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #131722; --surface: #131722; --border: #2a2e39; --grid: #1e222d;
      --ink: #d1d4dc; --ink-2: #b2b5be; --muted: #787b86;
      --up: #089981; --down: #f23645; --accent: #5b9cf6; --hover: #2a2e39;
      --vp-up: #3d7fd9; --vp-down: #c9912a; --poc: #ff5c8a; --va: #9598a1; --rsi: #b39ddb; --vwap: #22d3ee; --imp-lime: #4ade80; --imp-green: #16a34a; --imp-orange: #fbbf24; --imp-red: #f87171; --imp-hist: #5b9cf6; --imp-signal: #e57373;
    }
  }
  * { box-sizing: border-box; }
  /* The page itself never moves (13 November, the owner: "i want chart background fixed, then i can move the things": the
     whole page must not scroll or shake when the chart is moved). It is pinned to the screen, it cannot be scrolled, bounced,
     pulled down to refresh or pinched larger, and a drag does not mark its words; only what is inside the chart moves. */
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  body { position: fixed; inset: 0; width: 100%; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-text-size-adjust: 100%; }
  #tools, #info, #draw { touch-action: pan-x; overscroll-behavior: contain; }
  #wrap, #chart { overscroll-behavior: none; }
  body { background: var(--page); color: var(--ink); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Trebuchet MS", Roboto, Ubuntu, sans-serif; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); border-bottom: 1px solid var(--border); flex: none; }
  header a { color: var(--ink-2); text-decoration: none; font-size: 13px; padding: 4px 8px; border-radius: 6px; }
  header a:hover { background: var(--hover); }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; flex: 1; }
  #status { font-size: 12px; color: var(--muted); white-space: nowrap; }
  #status.error { color: var(--down); }
  #tools { display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-bottom: 1px solid var(--border); overflow-x: auto; flex: none; scrollbar-width: none; }
  #tools::-webkit-scrollbar { display: none; }
  #tools select, #tools button { font: inherit; font-size: 14px; color: var(--ink); background: transparent; border: 0; border-radius: 6px; padding: 8px 10px; cursor: pointer; white-space: nowrap; min-height: 36px; }
  #tools select { font-weight: 600; padding-right: 4px; }
  #tools button:hover, #tools select:hover { background: var(--hover); }
  #tools button[aria-pressed="true"] { color: var(--accent); font-weight: 600; }
  #tools label.box { gap: 4px; padding: 0 0 0 10px; color: var(--muted); border: 1px solid var(--border); margin: 0 2px; }
  #tools label.box select { color: var(--accent); padding-left: 4px; }
  #tools .sep { width: 1px; align-self: stretch; margin: 6px 4px; background: var(--border); flex: none; }
  #tools label { display: flex; align-items: center; gap: 6px; font-size: 14px; padding: 8px 10px; white-space: nowrap; cursor: pointer; border-radius: 6px; min-height: 36px; }
  #tools label:hover { background: var(--hover); }
  #main { display: flex; flex: 1; min-height: 0; }
  /* the drawing tools (12 November, the owner: "add drawing tools and RSI"): a column on the left of the chart; on a phone a row above it */
  #draw { display: flex; flex-direction: column; gap: 2px; padding: 6px 4px; border-right: 1px solid var(--border); flex: none; }
  #draw button { width: 36px; height: 36px; display: grid; place-items: center; background: transparent; border: 0; border-radius: 6px; color: var(--ink-2); cursor: pointer; padding: 0; }
  #draw button:hover { background: var(--hover); }
  #draw button[aria-pressed="true"] { color: var(--accent); background: var(--hover); }
  #draw button:disabled { opacity: 0.35; cursor: default; background: transparent; }
  #draw svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  #draw .sep { height: 1px; margin: 4px 6px; background: var(--border); }
  #wrap { position: relative; flex: 1; min-width: 0; min-height: 0; }
  #wrap.drawing #chart { cursor: crosshair; }
  #wrap.moving #chart { cursor: grabbing; }
  #chart { touch-action: none; }
  #chart { position: absolute; inset: 0; }
  #legend { position: absolute; left: 8px; top: 6px; right: 70px; z-index: 3; pointer-events: none; font-size: 12px; line-height: 1.55; color: var(--ink-2); }
  #legend .row { display: flex; flex-wrap: wrap; gap: 0 8px; align-items: baseline; }
  #legend .sym { font-size: 14px; font-weight: 600; color: var(--ink); }
  #legend .k { color: var(--muted); }
  #legend .v { color: var(--ink); font-variant-numeric: tabular-nums; }
  #legend .v.up { color: var(--up); } #legend .v.down { color: var(--down); }
  #legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  #legend i.line { height: 2px; vertical-align: 3px; border-radius: 0; }
  /* the figures of the indicators (13 November, the owner, with the words on the chart marked: "when i scroll the chart up and
     down it goes into the chart ... remove it"): one line above the chart, never over the candles; on a narrow screen it slides sideways */
  #info { display: flex; gap: 0 14px; align-items: baseline; padding: 4px 12px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow-x: auto; flex: none; min-height: 27px; scrollbar-width: none; }
  #info::-webkit-scrollbar { display: none; }
  #info .k { color: var(--muted); } #info .v { color: var(--ink); font-variant-numeric: tabular-nums; }
  #info i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  #info i.line { height: 2px; vertical-align: 3px; border-radius: 0; }
  #info .cut { width: 1px; align-self: stretch; background: var(--border); flex: none; }
  /* the chart's own buttons (13 November, the owner: "there is no manual zoom in and zoom out button on the chart, add those, also add
     left right up down buttons"): a row at the foot of the candles, in the middle */
  #inforow { display: flex; align-items: stretch; border-bottom: 1px solid var(--border); flex: none; }
  #inforow #info { flex: 1; min-width: 0; border-bottom: 0; align-items: center; }
  #nav { display: flex; align-items: center; gap: 1px; padding: 0 6px; border-left: 1px solid var(--border); flex: none; }
  #nav button { width: 28px; height: 26px; display: grid; place-items: center; background: transparent; border: 0; border-radius: 6px; color: var(--ink-2); cursor: pointer; padding: 0; touch-action: manipulation; }
  #nav button:hover { background: var(--hover); color: var(--ink); }
  #nav button:active { color: var(--accent); }
  #nav svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #nav .sep { width: 1px; margin: 5px 2px; background: var(--border); }
  /* The signal (13 November, the owner's document "Volume Profile Signal Logic", its note 10: one screen with yesterday's VAL,
     POC and VAH, the naked POC list, how today opened, the signal or WAIT with its reason, the stop, the target and the lots) */
  #calls-wrap { position: relative; flex: none; }
  #calls-wrap[hidden] { display: none; }
  #calls-tabs { display: flex; gap: 8px; padding: 6px 12px; border-top: 1px solid var(--border); }
  #calls-tabs .cap { font: inherit; font-size: 12px; font-weight: 600; padding: 4px 14px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--ink); cursor: pointer; }
  #calls-tabs .cap:hover { background: var(--hover); }
  #calls-tabs .cap.on { background: var(--ink); color: var(--page); border-color: var(--ink); }
  #calls-tabs { align-items: center; padding-top: 5px; padding-bottom: 5px; }
  #calls-tabs .cap { white-space: nowrap; }
  #calls-tabs .grow { flex: 1; }
  #calls-tabs .ic { width: 30px; height: 30px; flex: none; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--ink-2); cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; }
  #calls-tabs .ic:hover { background: var(--hover); } #calls-tabs .ic[aria-pressed="true"] { background: var(--hover); color: var(--ink); border-color: var(--ink-2); }
  #calls-tabs .ic svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.15s; }
  #calls-wrap.shut #calls-hide svg, #calls-wrap.large #calls-size svg { transform: rotate(180deg); }
  /* the block's height: small by default so the chart keeps most of the screen; larger on the owner's press; hidden: the capsule row alone */
  #calls-wrap #calls, #calls-wrap #imptable { max-height: 22vh; }
  #calls-wrap.large #calls, #calls-wrap.large #imptable { max-height: 46vh; }
  #calls-wrap.shut #calls, #calls-wrap.shut #imptable, #calls-wrap.shut #calls-scroll { display: none; }
  #calls:not(.rules) .rule { display: none; }
  #imptable th { padding-top: 5px; padding-bottom: 5px; } #imptable td { padding-top: 3px; padding-bottom: 3px; }
  #imptable { flex: none; max-height: 34vh; overflow: auto; overscroll-behavior: contain; touch-action: pan-x pan-y; border-top: 1px solid var(--border); }
  #imptable[hidden], #calls[hidden] { display: none; }
  #imptable table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; }
  #imptable th { position: sticky; top: 0; z-index: 2; background: var(--surface); text-align: left; padding: 7px 12px; white-space: nowrap; font-weight: 600; color: var(--ink-2); border-bottom: 1px solid var(--border); cursor: grab; -webkit-user-select: none; user-select: none; touch-action: none; }
  #imptable th.drag { opacity: 0.45; cursor: grabbing; }
  #imptable th.before { box-shadow: inset 3px 0 0 var(--accent); } #imptable th.after { box-shadow: inset -3px 0 0 var(--accent); }
  #imptable td { padding: 5px 12px; white-space: nowrap; border-bottom: 1px solid var(--border); color: var(--ink); }
  #imptable td.k { color: var(--ink-2); } #imptable td.up { color: var(--up); font-weight: 600; } #imptable td.down { color: var(--down); font-weight: 600; }
  #imptable td .side { font-weight: 700; padding: 0 8px; border-radius: 5px; color: #fff; background: var(--muted); } #imptable td .side.ce { background: var(--up); } #imptable td .side.pe { background: var(--down); }
  #imptable-empty { margin: 0; padding: 10px 12px; color: var(--muted); font-size: 12px; }
  @media (max-width: 600px) { #calls-tabs { padding: 5px 10px; } }
  #calls-scroll { position: absolute; right: 12px; bottom: 6px; display: flex; flex-direction: column; gap: 6px; }
  #calls-scroll[hidden] { display: none; }
  #calls-scroll button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18); cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; }
  #calls-scroll button:disabled { opacity: 0.35; cursor: default; box-shadow: none; }
  #calls-scroll svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  @media (max-width: 600px) { #calls-scroll { right: 10px; } #calls-scroll button { width: 38px; height: 38px; } }
  #calls { flex: none; max-height: 34vh; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; border-top: 1px solid var(--border); }
  #calls > div:last-child, #calls > div:not([hidden]):last-of-type { border-bottom: 0; }
  #sig { padding: 6px 12px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--ink-2); flex: none; -webkit-user-select: text; user-select: text; }
  #sig[hidden] { display: none; }
  #shape { padding: 6px 12px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--ink-2); flex: none; -webkit-user-select: text; user-select: text; }
  #impulse { padding: 6px 12px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--ink-2); flex: none; -webkit-user-select: text; user-select: text; }
  #shape .line { display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: baseline; } #shape .line + .line { margin-top: 3px; }
  #impulse .line { display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: baseline; } #impulse .line + .line { margin-top: 3px; }
  #shape .badge { font-size: 13px; font-weight: 700; padding: 1px 10px; border-radius: 6px; color: #fff; background: var(--muted); letter-spacing: 0.02em; }
  #impulse .badge { font-size: 13px; font-weight: 700; padding: 1px 10px; border-radius: 6px; color: #fff; background: var(--muted); letter-spacing: 0.02em; }
  #shape .badge.ce { background: var(--up); } #shape .badge.pe { background: var(--down); }
  #impulse .badge.ce { background: var(--up); } #impulse .badge.pe { background: var(--down); }
  #shape .k { color: var(--muted); } #shape .v { color: var(--ink); font-variant-numeric: tabular-nums; } #shape .v.up { color: var(--up); } #shape .v.down { color: var(--down); }
  #impulse .k { color: var(--muted); } #impulse .v { color: var(--ink); font-variant-numeric: tabular-nums; } #impulse .v.up { color: var(--up); } #impulse .v.down { color: var(--down); }
  #shape b { color: var(--ink); font-weight: 600; }
  #impulse b { color: var(--ink); font-weight: 600; }
  @media (max-width: 600px) { #shape { padding: 5px 10px; } }
  @media (max-width: 600px) { #impulse { padding: 5px 10px; } #calls-wrap #calls, #calls-wrap #imptable { max-height: 24vh; } #calls-wrap.large #calls, #calls-wrap.large #imptable { max-height: 44vh; } #calls-tabs { gap: 6px; } #calls-tabs .cap { padding: 4px 10px; } }
  #sig .line { display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: baseline; }
  #sig .line + .line { margin-top: 3px; }
  #sig .badge { font-size: 13px; font-weight: 700; padding: 1px 10px; border-radius: 6px; color: #fff; background: var(--muted); letter-spacing: 0.02em; }
  #sig .badge.ce { background: var(--up); } #sig .badge.pe { background: var(--down); }
  #sig .k { color: var(--muted); } #sig .v { color: var(--ink); font-variant-numeric: tabular-nums; }
  #sig .v.up { color: var(--up); } #sig .v.down { color: var(--down); }
  #sig b { color: var(--ink); font-weight: 600; }
  #sig input { font: inherit; width: 72px; padding: 1px 6px; border: 1px solid var(--border); border-radius: 5px; background: transparent; color: var(--ink); }
  #sig button.link { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; }
  #sig table { border-collapse: collapse; margin-top: 6px; font-variant-numeric: tabular-nums; }
  #sig th, #sig td { text-align: left; padding: 2px 12px 2px 0; white-space: nowrap; font-weight: 400; }
  #sig th { color: var(--muted); }
  #sig .small { color: var(--muted); font-size: 11px; }
  #sig-more { max-height: 34vh; overflow: auto; touch-action: pan-x pan-y; }
  #note { margin: 0; padding: 6px 12px; padding-bottom: max(6px, env(safe-area-inset-bottom)); font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); flex: none; }
  #note.warn { color: var(--ink-2); }
  #note { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; padding-top: 4px; padding-bottom: max(4px, env(safe-area-inset-bottom)); }
  #note.open { white-space: normal; }
  /* The explanation panel (17 November, the owner's document, section 2: "a fixed-width column (about 340 px) to the right of
     the chart", the status line large and coloured, the checks with a +1 / 0 / -1 marker, the if/then table, the levels with the
     price's row marked, the flags in amber, the alerts in a list that scrolls, the warning always in view) */
  #panel { flex: none; width: 340px; border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; font-size: 12.5px; background: var(--surface); }
  #panel[hidden] { display: none; }
  #panel .body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 10px 12px 6px; -webkit-user-select: text; user-select: text; touch-action: pan-y; }
  #panel .status { font-size: 15px; font-weight: 600; line-height: 1.35; margin: 0 0 6px; }
  #panel .status.bull { color: var(--up); } #panel .status.bear { color: var(--down); } #panel .status.flat { color: var(--ink-2); }
  #panel .meta { color: var(--muted); margin-bottom: 8px; }
  #panel h3 { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin: 12px 0 4px; }
  #panel .row { display: flex; gap: 8px; padding: 2px 0; align-items: baseline; }
  #panel .mark { flex: none; width: 24px; text-align: center; font-weight: 600; border-radius: 4px; font-variant-numeric: tabular-nums; }
  #panel .mark.p { color: var(--up); background: color-mix(in srgb, var(--up) 14%, transparent); }
  #panel .mark.n { color: var(--down); background: color-mix(in srgb, var(--down) 14%, transparent); }
  #panel .mark.z { color: var(--muted); background: var(--hover); }
  #panel .row .k { color: var(--muted); } #panel .row .t { flex: 1; min-width: 0; }
  #panel .lv { display: grid; grid-template-columns: 1fr auto 46px; gap: 8px; padding: 1.5px 6px; border-radius: 4px; font-variant-numeric: tabular-nums; }
  #panel .lv .d { color: var(--muted); min-width: 44px; text-align: right; }
  #panel .lv.now { background: var(--hover); font-weight: 600; }
  #panel .cond { padding: 3px 0; } #panel .cond .if { color: var(--ink); } #panel .cond .then { color: var(--ink-2); }
  #panel .flag { color: #b45309; padding: 2px 0; }
  #panel .alerts { max-height: 132px; overflow-y: auto; overscroll-behavior: contain; border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }
  #panel .alerts .a { padding: 2px 0; } #panel .alerts .a .tm { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
  #panel .none { color: var(--muted); }
  #panel .verify { padding: 4px 8px; border-radius: 6px; margin: 0 0 6px; font-weight: 600; }
  #panel .verify.yes { color: var(--up); background: color-mix(in srgb, var(--up) 12%, transparent); }
  #panel .verify.no { color: var(--down); background: color-mix(in srgb, var(--down) 14%, transparent); }
  #panel .verify.wait { color: var(--muted); background: var(--hover); font-weight: 400; }
  #panel .warn { flex: none; padding: 6px 12px; border-top: 1px solid var(--border); color: var(--muted); font-size: 11.5px; }
  body.embed > header, body.embed #index, body.embed #tools .sep, body.embed #note { display: none; }  /* AAA_V1: the chart alone, inside the index page */
  @media (prefers-color-scheme: dark) { #panel .flag { color: #fbbf24; } }
  @media (max-width: 900px) and (min-width: 601px) { #panel { width: 280px; } }
  @media (max-width: 600px) {
    #main { flex-direction: column; }
    #panel { width: auto; border-left: 0; border-top: 1px solid var(--border); max-height: 42vh; }
    #draw { flex-direction: row; padding: 2px 8px; border-right: 0; border-bottom: 1px solid var(--border); overflow-x: auto; }
    #draw .sep { width: 1px; height: auto; margin: 6px 4px; }
    header h1 { font-size: 15px; }
    #legend { font-size: 11px; right: 58px; }
    #sig { padding: 5px 10px; }
    #legend .sym { font-size: 13px; }
    #status { display: none; }
  }
</style>
</head>
<body>
  <header>
    <a id="back" href="/">‹ My-Trade</a>
    <h1>Volume Profile</h1>
    <span id="status">Loading…</span>
  </header>
  <div id="tools" role="toolbar" aria-label="Chart settings">
    <select id="index" aria-label="Index"><option>NIFTY 50</option><option>NIFTY BANK</option><option>SENSEX</option></select>
    <span class="sep"></span>
    <!-- the time frame boxes (13 November, the owner, with the 1m 5m 15m 1D 5D buttons marked: "add this as a time frame box with
         drop down options and also add as 2D, 3D as well"): the candle size in one box, the days shown in the other -->
    <label class="box">Time frame <select id="interval" aria-label="Time frame"><option value="1m">1m</option><option value="5m">5m</option><option value="15m">15m</option></select></label>
    <label class="box">Days <select id="days" aria-label="Days shown"><option value="1">1D</option><option value="2">2D</option><option value="3">3D</option><option value="5">5D</option></select></label>
    <span class="sep"></span>
    <label><input type="checkbox" id="show-volume" checked> Volume</label>
    <label><input type="checkbox" id="show-rsi" checked> RSI</label>
    <label><input type="checkbox" id="show-signal" checked> Signal</label>

<script>
(function () {
  "use strict";
  const IST = 19800;  // the chart library draws times as UTC: every time is moved by the IST offset on its way in
  const BARS_A_DAY = { "1m": 375, "5m": 75, "15m": 25 };
  const params = new URLSearchParams(location.search);
  // AAA_V1 (19 November, the owner: "make a replica of it [the Trade Plan page], dont keep any rules on the new chart, and make a
  // chart format same as volume profile page chart. Name it AAA_V1"): the index page shows this page inside its AAA_V1 capsule
  // with ?embed=aaa. Then it is the chart alone: no title row, no index box (the index page's index), and none of the rule
  // boxes (Signal, Shape signal, Impulse MACD, Panel), which stay off. Its settings are kept apart, so this page's own stay as they are.
  const EMBED = params.get("embed") === "aaa", STORE = EMBED ? "volumeProfileAAA" : "volumeProfile";
  const state = { name: "NIFTY 50", interval: "5m", days: 1, bars: [], volumes: new Map(), fine: [], fineVolumes: new Map(), contract: null, problem: null, sessions: [], profiles: [], hover: null };
  try { const saved = JSON.parse(localStorage.getItem(STORE) || "null"); if (saved) { if (BARS_A_DAY[saved.interval]) state.interval = saved.interval; if ([1, 2, 3, 5].includes(saved.days)) state.days = saved.days; if (saved.name) state.name = saved.name; if (saved.volume === false) document.getElementById("show-volume").checked = false; if (saved.rsi === false) document.getElementById("show-rsi").checked = false; if (saved.vwap === true) document.getElementById("show-vwap").checked = true; if (saved.panel === true) document.getElementById("show-panel").checked = true; if (saved.shape === true) document.getElementById("show-shape").checked = true; if (saved.impulse === true) document.getElementById("show-impulse").checked = true; if (saved.signal === false) document.getElementById("show-signal").checked = false; } } catch (e) {}
  if (params.get("index")) state.name = params.get("index").toUpperCase();
  if (EMBED) {
    document.body.classList.add("embed");
    // 19 November, the owner, with AAA_V1 live: "remove every logic from this chart, just keep it as clean as possible, i want only
    // candles and above that i want previous day close high low": every tick box goes and stays off (the rules' four, and Volume,
    // RSI, VWAP, OI walls); no volume rows, no VAH, POC, VAL (drawProfiles, drawTodayNames); the candles, and three lines:
    // the previous day's high, low and close (drawPrevDay), with their figures in the line above the chart
    for (const id of ["show-signal", "show-shape", "show-impulse", "show-panel", "show-volume", "show-rsi", "show-vwap", "show-oi"]) { const box = document.getElementById(id); box.checked = false; box.closest("label").style.display = "none"; }
    // then: "i want to keep the volumes on this page ... i just want the volumes on this page for all 3 indexes, rest you can remove":
    // the volume bars under the candles are always on here (no tick box), with the candle's volume in the line above the chart
    document.getElementById("show-volume").checked = true;
  }
  const $ = (id) => document.getElementById(id);
  // No calls on the page (16 November, the owner: "remove all the call tables, i dont want that, and also remove all the signals
  // from the chart, except the shape names"): the calls block under the chart is hidden, and no call's arrow, stop or target is
  // drawn. The calls are still worked out (the code is kept, so they can come back by setting this to true); the levels, the
  // shape names and the indicators stay
  const SHOW_CALLS = false;
  if (![...$("index").options].some(o => o.value === state.name)) state.name = "NIFTY 50";
  $("index").value = state.name;

  // The login's "tab" note and this page's id, as the other pages keep them
  let TAB = "";
  try { TAB = sessionStorage.getItem("tab") || ""; } catch (e) {}
  const handed = new URLSearchParams(location.hash.slice(1)).get("t");
  if (handed) { TAB = handed; try { sessionStorage.setItem("tab", TAB); } catch (e) {} history.replaceState(null, "", location.pathname + location.search); }
  $("back").href = "/#t=" + encodeURIComponent(TAB);
  let PAGE = "";
  const withTab = () => ({ headers: { "X-Tab": TAB, "X-Page": PAGE } });
  let loadedCommit = null;
  function newDeploy(commit) {
    if (!commit) return false;
    if (loadedCommit === null) { loadedCommit = commit; return false; }
    if (commit === loadedCommit) return false;
    let last = 0; try { last = parseInt(sessionStorage.getItem("reloaded-at") || "0", 10); } catch (e) {}
    if (Date.now() - last < 60000) return false;
    try { sessionStorage.setItem("reloaded-at", String(Date.now())); } catch (e) {}
    location.reload();
    return true;
  }

  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const alpha = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255}, ${n >> 8 & 255}, ${n & 255}, ${a})`; };
  const num = (x, d = 2) => x == null ? "—" : Number(x).toLocaleString("en-IN", { minimumFractionDigits: d, maximumFractionDigits: d });
  const short = (v) => v == null ? "—" : v >= 1e7 ? (v / 1e6).toFixed(1) + "M" : v >= 1e6 ? (v / 1e6).toFixed(2) + "M" : v >= 1e3 ? (v / 1e3).toFixed(v >= 1e5 ? 0 : 1) + "K" : String(Math.round(v));
  const hhmm = (t) => new Date((t + IST) * 1000).toISOString().slice(11, 16);
  const dayOf = (t) => new Date((t + IST) * 1000).toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: "UTC" });

  // ---------------------------------------------------------------- the chart
  const LC = LightweightCharts;
  const chart = LC.createChart($("chart"), {
    autoSize: true,
    layout: { attributionLogo: false, fontSize: 12, fontFamily: getComputedStyle(document.body).fontFamily, panes: { enableResize: false } },
    rightPriceScale: { scaleMargins: { top: 0.12, bottom: 0.22 } },
    timeScale: { timeVisible: true, secondsVisible: false, rightOffset: 6, barSpacing: 9, minBarSpacing: 1 },
    crosshair: { mode: LC.CrosshairMode.Normal },
    localization: { priceFormatter: (p) => num(p), timeFormatter: (t) => { const d = new Date(t * 1000); return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "2-digit", timeZone: "UTC" }) + "  " + d.toISOString().slice(11, 16); } },
  });
  const candles = chart.addSeries(LC.CandlestickSeries, { priceLineVisible: true, lastValueVisible: true });
  const volume = chart.addSeries(LC.HistogramSeries, { priceScaleId: "", priceFormat: { type: "volume" }, lastValueVisible: false, priceLineVisible: false });
  volume.priceScale().applyOptions({ scaleMargins: { top: 0.84, bottom: 0 } });
  // a narrow screen: the words top left take more lines, so the candles start lower
  const roomOnTop = () => chart.priceScale("right").applyOptions({ scaleMargins: state.priceView ? { top: 0, bottom: 0 } : { top: innerWidth <= 600 ? 0.13 : 0.08, bottom: $("show-volume").checked && !state.timeOnly ? 0.22 : 0.06 } });  // the room under the candles is the volume bars': without them the candles use it
  roomOnTop(); addEventListener("resize", roomOnTop);

  function paint() {
    const up = css("--up"), down = css("--down");
    chart.applyOptions({
      layout: { background: { color: css("--surface") }, textColor: css("--ink-2") },
      grid: { vertLines: { color: css("--grid") }, horzLines: { color: css("--grid") } },
      rightPriceScale: { borderColor: css("--border") }, timeScale: { borderColor: css("--border") },
      crosshair: { vertLine: { color: css("--muted"), labelBackgroundColor: css("--ink-2") }, horzLine: { color: css("--muted"), labelBackgroundColor: css("--ink-2") } },
    });
    candles.applyOptions({ upColor: up, downColor: down, borderUpColor: up, borderDownColor: down, wickUpColor: up, wickDownColor: down });
    setVolume();
    if (rsi) rsi.applyOptions({ color: css("--rsi") });
    profile.requestUpdate && profile.requestUpdate(); redraw();
  }

  // ---------------------------------------------------------------- the profile, drawn behind the candles
  // The running (last) day's profile stands at the right edge, in the room kept free beside its candles, and grows to the left;
  // each day before it starts at its first candle and grows to the right (16 November, the owner, twice: first all days at their
  // start, then "on current or running day, this volume profile should be on right side only"). The longer a row, the
  // more was traded (or, without volume, the more time was spent) at that price. Blue: in rising candles; amber: in falling ones. The rows
  // of the value area are drawn strong, the others faint. A line marks the busiest price of each day.
  const profile = {
    attached(p) { this.requestUpdate = p.requestUpdate; },
    detached() { this.requestUpdate = null; },
    updateAllViews() {},
    paneViews() { return [this.view]; },
    view: { zOrder: () => "bottom", renderer: () => ({ draw: (target) => target.useBitmapCoordinateSpace(drawProfiles) }) },
  };
  candles.attachPrimitive(profile);

  // The running day's shape name is the panel's shown shape (18 November, the owner: "The simplest fix is to drive the chart's
  // shape label from the panel's output"; "First 15 minutes stay 'Too early to read'. The 10-minute smoothing should also still
  // apply, so the label doesn't flip every minute"): the panel reads the shape with the chart's own rule and shows a new one
  // only after it has held for five minutes (the owner, 18 November: "Instead of 10 minutes make it 5 minutes"), and the chart's label of today is drawn from that, so the two cannot differ. No
  // label while the panel says "too early". The days before, and today when the panel has not answered: the chart's own
  // reading, as before.
  function shownShape(s, lastDay) {
    const g = state.panel, sh = g && g.shape && g.shape.shown;
    if (!lastDay || !sh || g.name !== state.name || g.date !== new Date((s.bars[0].time + IST) * 1000).toISOString().slice(0, 10)) return s.shape;
    return sh === "too_early" ? null : ({ P: "P", b: "B", D: "D", double: "Double" })[sh] || s.shape;
  }
  // today's thin zones as light bands across the chart, while the Panel is on (the document, section 2: "Draw today's thin zones as
  // light shaded bands on the chart")
  function drawZones(scope) {
    const g = state.panel; if (!$("show-panel").checked || !g || !g.zones || !g.zones.length) return;
    const ctx = scope.context, hr = scope.horizontalPixelRatio, vr = scope.verticalPixelRatio, w = scope.mediaSize.width;
    ctx.save(); ctx.fillStyle = css("--muted"); ctx.globalAlpha = 0.10;
    for (const z of g.zones) { const a = candles.priceToCoordinate(z.high), b = candles.priceToCoordinate(z.low); if (a == null || b == null) continue; ctx.fillRect(0, Math.round(a * vr), Math.round(w * hr), Math.max(1, Math.round((b - a) * vr))); }
    ctx.restore();
  }
  function drawProfiles(scope) {
    if (EMBED) return;  // AAA_V1: candles only
    drawZones(scope);
    if (!state.profiles.length) return;  // the profile is always drawn: the page is for it (the owner, 12 November: "volume profile should always be there")
    const ctx = scope.context, hr = scope.horizontalPixelRatio, vr = scope.verticalPixelRatio, paneW = scope.mediaSize.width;
    const ts = chart.timeScale(), spacing = ts.options().barSpacing, full = BARS_A_DAY[state.interval] * spacing;
    const cUp = css("--vp-up"), cDown = css("--vp-down"), cPoc = css("--poc"), cVa = css("--va");
    state.profiles.forEach((s, k) => {
      const p = s.profile; if (!p || !(p.total > 0)) return;
      const x0c = ts.timeToCoordinate(s.bars[0].time + IST); if (x0c == null) return;
      const x0 = x0c - spacing / 2, lastDay = k === state.profiles.length - 1, right = lastDay;  // the running (last) day at the right edge, the days before at their own first candle (16 November, the owner: "on current or running day, this volume profile should be on right side only")
      // One day: the profile stands at the end of the day's own room on the time line (where the whole view ends), not at the
      // screen's edge, and it is as wide as a fixed share of that room: so it moves left and right with the candles and
      // grows and shrinks with them (the owner, 13 November: "whenever i move up n down, left or right, or make it small or
      // bigger every price action moves in the same direction and volume profile also in the same direction")
      const day = BARS_A_DAY[state.interval], edge = x0c + day * 1.36 * spacing;
      if (right ? (x0 > paneW || edge < 0) : (x0 > paneW || x0 + full < 0)) return;
      const width = right ? (day * 1.36 + 1.5) * spacing * 0.24 : full * 0.42;
      const rect = (from, len, yTop, h) => { const a = right ? edge - from - len : x0 + from; ctx.fillRect(Math.round(a * hr), Math.round(yTop * vr), Math.max(0, Math.round(len * hr)), Math.max(1, Math.round(h * vr))); };
      const most = Math.max(...p.rows.map(r => r.total));
      p.rows.forEach((r, i) => {
        if (!(r.total > 0)) return;
        const yTop = candles.priceToCoordinate(r.price + p.step), yBot = candles.priceToCoordinate(r.price);
        if (yTop == null || yBot == null) return;
        const h = Math.max(1, (yBot - yTop) - (yBot - yTop > 3 ? 1 : 0)), len = r.total / most * width, inside = i >= p.vaFrom && i <= p.vaTo;
        const upLen = len * (r.up / r.total);
        ctx.globalAlpha = inside ? (right ? 0.7 : 0.45) : (right ? 0.3 : 0.18);
        ctx.fillStyle = cUp; rect(0, upLen, yTop, h);
        ctx.fillStyle = cDown; rect(upLen, len - upLen, yTop, h);
      });
      ctx.globalAlpha = 1;
      const line = (price, color, dash, w) => {
        const y = candles.priceToCoordinate(price); if (y == null) return;
        ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = Math.max(1, Math.round(w * vr)); ctx.setLineDash(dash.map(d => d * hr));
        ctx.beginPath(); const yy = Math.round(y * vr) + 0.5; ctx.moveTo(Math.round(Math.max(0, x0) * hr), yy); ctx.lineTo(Math.round((right ? edge : x0 + full) * hr), yy); ctx.stroke(); ctx.restore();
      };
      line(p.poc, cPoc, [], 1.5);
      line(p.vah, cVa, [4, 4], 1); line(p.val, cVa, [4, 4], 1);
      const named = s.shape && shownShape(s, lastDay);
      if (named && (right || x0 >= 0)) {  // the shape's name above the day's profile, only while "Shape signal" is ticked (15 November)
        const top = p.rows[p.rows.length - 1], y = candles.priceToCoordinate(top.price + p.step);
        if (y != null) { ctx.save(); ctx.font = `600 ${Math.round(11 * vr)}px -apple-system, "Segoe UI", Roboto, sans-serif`; ctx.fillStyle = css("--ink-2"); ctx.textBaseline = "bottom"; ctx.textAlign = right ? "right" : "left";
          ctx.fillText(VpShape.NAMES[named].split(" (")[0], Math.round((right ? edge : Math.max(0, x0) + 2) * hr), Math.round((y - 4) * vr)); ctx.restore(); }
      }
    });
  }

  // ---------------------------------------------------------------- RSI (12 November, the owner: "add drawing tools and RSI")
  // The usual RSI: 14 candles, Wilder's smoothing, on the closes of the candle size shown; its own strip under the chart, with
  // the 70 and 30 lines. It is counted over every candle the page holds (five days), so the day shown starts with a settled value.
  // Each pane's share of the chart's height, set again whenever a pane comes or goes or the chart's room changes (15 November, the
  // owner, with the candles squeezed into a strip above a tall Impulse pane: "main candle chart with volume profile is also not
  // fitting well"): the candles always keep the most; a pane's edge cannot be dragged, so the shares cannot be lost by a slip
  function fitPanes() {
    const panes = chart.panes(), both = !!(rsi && imp), share = both ? [0.64, 0.14, 0.22] : imp ? [0.76, 0.24] : rsi ? [0.8, 0.2] : [1];
    share.forEach((x, i) => { if (panes[i]) panes[i].setStretchFactor(x); });
  }
  const RSI_LENGTH = 14;
  let rsi = null;
  function rsiSeries(bars, n = RSI_LENGTH) {
    const out = new Map(); let up = 0, down = 0;
    for (let i = 1; i < bars.length; i++) {
      const ch = bars[i].close - bars[i - 1].close, u = Math.max(ch, 0), d = Math.max(-ch, 0);
      if (i <= n) { up += u / n; down += d / n; } else { up = (up * (n - 1) + u) / n; down = (down * (n - 1) + d) / n; }
      if (i >= n) out.set(bars[i].time, down === 0 ? (up === 0 ? 50 : 100) : 100 - 100 / (1 + up / down));
    }

    if (!vwapLines.length) return;
    const days = shown(), pts = vwapOf(days[days.length - 1]);
    for (const p of pts) state.vwap.set(p.time - IST, p.value);
    vwapLines[vwapLines.length - 1].setData(pts);
  }
  function setVolume() {
    const up = alpha(css("--up"), 0.45), down = alpha(css("--down"), 0.45);
    const bars = $("show-volume").checked && !state.timeOnly ? shown().flat() : [];
    volume.setData(bars.filter(b => state.volumes.get(b.time) > 0).map(b => ({ time: b.time + IST, value: state.volumes.get(b.time), color: b.close >= b.open ? up : down })));
  }
  function setAll(fit) {
    const bars = shown().flat();
    candles.setData(bars.map(b => ({ time: b.time + IST, open: b.open, high: b.high, low: b.low, close: b.close })));
    rebuild(); setVolume(); setRsi(); setImpulse(); setVwap(); redraw(); drawPanel();
    // A new index, time frame or number of days: the chart shows that choice whole, its own times and its own prices. The
    // price scale is told to follow the candles again every time: after the up and down buttons, and also after the owner
    // dragged the price scale or the chart by hand (13 November: SENSEX's prices stayed on the scale when NIFTY 50 was chosen,
    // and the chart stood empty until it was dragged back)
    if (fit) { priceView(null); fitDays(); }
  }

  // one day: the whole session from 9:15 to 15:30 in view, with room on the right for the profile; five days: all of them
  // The chart's buttons: zoom out and in (the time, about the middle of the view), left and right (a fifth of the view),
  // up and down (a sixth of the prices in view: the price scale then stays where it was put), and back to the whole view.
  function navigate(what) {
    const ts = chart.timeScale(), r = ts.getVisibleLogicalRange(), ps = candles.priceScale();
    if (what === "reset") { priceView(null); fitDays(); return; }
    if (!r) return;
    const width = r.to - r.from, mid = (r.from + r.to) / 2;
    if (what === "in" || what === "out") { const w = Math.max(8, Math.min(4000, width * (what === "in" ? 0.7 : 1 / 0.7))); ts.setVisibleLogicalRange({ from: mid - w / 2, to: mid + w / 2 }); }
    else if (what === "left" || what === "right") { const d = width * 0.2 * (what === "left" ? -1 : 1); ts.setVisibleLogicalRange({ from: r.from + d, to: r.to + d }); }
    else { const v = state.priceView || ps.getVisibleRange(); if (!v) return; const d = (v.to - v.from) / 6 * (what === "up" ? 1 : -1); priceView({ from: v.from + d, to: v.to + d }); }
  }
  // The prices in view, when the up and down buttons have moved them: the chart is told that range as the one to show, with
  // no room added around it (the range read from the scale already holds that room); null: the chart follows the candles again
  function priceView(range) {
    state.priceView = range;
    candles.applyOptions({ autoscaleInfoProvider: range ? () => ({ priceRange: { minValue: range.from, maxValue: range.to } }) : (original) => oiRange(original()) });  // with the OI walls ticked, both walls stay in view (17 November)
    candles.priceScale().applyOptions({ autoScale: true });
    roomOnTop();
  }
  $("nav").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) navigate(b.dataset.nav); });
  function fitDays() {
    const days = shown(), n = days.flat().length; if (!n) return;
    const first = days.slice(0, Math.max(0, days.length - state.days)).flat().length;  // where the first day of the opening view starts
    const day = BARS_A_DAY[state.interval], lastStart = n - days[days.length - 1].length;  // room on the right for the running day's profile
    if (state.days === 1) chart.timeScale().setVisibleLogicalRange({ from: first - 1.5, to: first + day * 1.36 });
    else chart.timeScale().setVisibleLogicalRange({ from: first - 1.5, to: Math.max(n + 3, lastStart + day * 1.36) });
  }
  let loadSeq = 0, shownKey = "";
  async function load() {
    const seq = ++loadSeq, name = state.name, interval = state.interval, status = $("status");
    try {
      const get = (url) => fetch(url, withTab());
      const at = (kind, size) => get(`/indices/${encodeURIComponent(name)}/${kind}${kind === "detail" ? "?range=5d&" : "?"}interval=${size}`);
      const fineWanted = interval !== "1m";  // the profile's own 1-minute candles and volume, when the chart shows larger candles
      const [d, v, fd, fv] = await Promise.all([at("detail", interval), at("volume", interval), fineWanted ? at("detail", "1m") : null, fineWanted ? at("volume", "1m") : null]);
      if (d.status === 401 || v.status === 401) { location.href = "/login"; return; }
      if (seq !== loadSeq) return;  // an older request finishing late
      if (!d.ok) { let why = "HTTP " + d.status; try { why = (await d.json()).detail || why; } catch (e) {} throw new Error(why); }
      const detail = await d.json(), vol = v.ok ? await v.json() : { bars: [], problem: "HTTP " + v.status };
      state.summary = detail.summary; state.bars = detail.candles || [];
      state.volumes = new Map((vol.bars || []).map(([t, x]) => [t, x])); state.contract = vol.contract; state.problem = vol.problem; state.rolled = vol.rolled || null;
      if (!fineWanted) { state.fine = state.bars; state.fineVolumes = state.volumes; }
      else {
        const fine = fd && fd.ok ? await fd.json() : null, fineVol = fv && fv.ok ? await fv.json() : null;
        state.fine = fine && fine.candles || []; state.fineVolumes = new Map((fineVol && fineVol.bars || []).map(([t, x]) => [t, x]));
      }
      const k = name + interval + state.days;
      setAll(k !== shownKey); shownKey = k;
      status.className = ""; status.textContent = (detail.summary && detail.summary.open ? "Live · " : "Market closed · ") + "updated " + new Date().toLocaleTimeString("en-GB");
    } catch (e) {
      if (seq !== loadSeq) return;
      status.className = "error"; status.textContent = "Couldn't load (" + e.message + "). Retrying…";
      $("note").className = "warn"; if (!state.bars.length) $("note").textContent = String(e.message);
    }
  }

  // a live price: the candle forming now follows it at once; the profile is counted again at most once a second
  let recount = 0;
  function applyTick(tick) {
    if (tick.name !== state.name || !tick.bars) return;
    const b = tick.bars[state.interval]; if (!b || !state.bars.length) return;
    const last = state.bars[state.bars.length - 1];
    if (b.time < last.time) return;
    if (b.time === last.time) Object.assign(last, { high: Math.max(last.high, b.high), low: Math.min(last.low, b.low), close: b.close }); else state.bars.push({ ...b });
    const m = tick.bars["1m"];  // the profile's 1-minute candles follow the price too
    if (m && state.fine.length && state.fine !== state.bars) { const f = state.fine[state.fine.length - 1]; if (m.time === f.time) Object.assign(f, { high: Math.max(f.high, m.high), low: Math.min(f.low, m.low), close: m.close }); else if (m.time > f.time) state.fine.push({ ...m }); }
    const now = state.bars[state.bars.length - 1];
    candles.update({ time: now.time + IST, open: now.open, high: now.high, low: now.low, close: now.close });
    if (Date.now() - recount > 1000) { recount = Date.now(); rebuild(); setImpulse(); updateVwap(); if (rsi) { state.rsi = rsiSeries(state.bars); const v = state.rsi.get(now.time); if (v != null) rsi.update({ time: now.time + IST, value: v }); } }
  }

  // ---------------------------------------------------------------- the words on the chart
  function drawLegend() {
    const days = shown(); if (!days.length) { $("legend").textContent = ""; $("info").textContent = ""; return; }
    const bars = days.flat(), at = state.hover && bars.find(b => b.time === state.hover.time) || bars[bars.length - 1];
    const i = state.bars.indexOf(at), before = i > 0 ? state.bars[i - 1].close : at.open, ch = at.close - before, tone = at.close >= at.open ? "up" : "down";
    const day = state.profiles.find(s => s.bars.includes(at)) || state.profiles[state.profiles.length - 1], p = day && day.profile;
    const v = state.volumes.get(at.time);
    const f = (label, x) => `<span><span class="k">${label}</span> <span class="v ${tone}">${num(x)}</span></span>`;
    let html = `<div class="row"><span class="sym">${state.name}</span><span class="k">${state.interval} · ${dayOf(at.time)} ${hhmm(at.time)}</span>${f("O", at.open)}${f("H", at.high)}${f("L", at.low)}${f("C", at.close)}<span class="v ${ch >= 0 ? "up" : "down"}">${ch >= 0 ? "+" : "−"}${num(Math.abs(ch))} (${(ch / before * 100 >= 0 ? "+" : "−") + Math.abs(ch / before * 100).toFixed(2)}%)</span></div>`;
    let info = "";  // the indicators' figures: in the line above the chart, not on it
    const clean = !EMBED ? null : !state.prevDay ? "" : `<span><span class="k">Prev day High</span> <span class="v">${num(state.prevDay.high)}</span></span><span class="cut"></span><span><span class="k">Prev day Low</span> <span class="v">${num(state.prevDay.low)}</span></span><span class="cut"></span><span><span class="k">Prev day Close</span> <span class="v">${num(state.prevDay.close)}</span></span><span class="cut"></span>`;
    if (state.rsi && state.rsi.has(at.time)) info += `<span><i class="line" style="background:var(--rsi)"></i><span class="k">RSI ${RSI_LENGTH}</span> <span class="v">${state.rsi.get(at.time).toFixed(2)}</span></span><span class="cut"></span>`;
    if (state.vwap && state.vwap.has(at.time)) info += `<span><i class="line" style="background:var(--vwap)"></i><span class="k">VWAP</span> <span class="v">${num(state.vwap.get(at.time))}</span></span><span class="cut"></span>`;
    if (!state.oi && $("show-oi").checked) info += `<span><span class="k">OI walls</span> <span class="v">${state.oiWhy ? "no data: " + state.oiWhy : "reading the option chain…"}</span></span><span class="cut"></span>`;
    if (state.oi) info += `<span><i class="line" style="background:var(--down)"></i><span class="k">Call OI wall</span> <span class="v">${state.oi.call ? num(state.oi.call.strike, 0) + " (" + short(state.oi.call.oi) + ")" : "—"}</span></span><span><i class="line" style="background:var(--up)"></i><span class="k">Put OI wall</span> <span class="v">${state.oi.put ? num(state.oi.put.strike, 0) + " (" + short(state.oi.put.oi) + ")" : "—"}</span></span><span class="cut"></span>`;
    if (!state.timeOnly) info += `<span><span class="k">Volume${state.contract ? " (" + state.contract.name + ")" : ""}</span> <span class="v">${short(v)}</span></span><span class="cut"></span>`;
    if (p && p.total > 0) {
      const what = state.timeOnly ? "time" : "volume";
      info += `<span><i class="line" style="background:var(--poc)"></i><span class="k">Busiest price</span> <span class="v">${num(p.poc)}</span></span><span><span class="k">70% of the ${what} between</span> <span class="v">${num(p.val)} – ${num(p.vah)}</span></span>${state.timeOnly ? "" : `<span><span class="k">Day's volume</span> <span class="v">${short(p.total)}</span></span>`}<span class="cut"></span>`;
      if (state.hover && state.hover.price != null) {
        const r = p.rows[Math.floor((state.hover.price - p.rows[0].price) / p.step)];
        if (r && r.total > 0) info += `<span class="cut"></span><span><span class="k">At ${num(r.price)} – ${num(r.price + p.step)}</span> <span class="v">${state.timeOnly ? (r.total / p.total * 100).toFixed(1) + "% of the day's time" : short(r.total) + " (" + (r.total / p.total * 100).toFixed(1) + "% of the day)"}</span></span><span><i style="background:var(--vp-up)"></i><span class="k">rising candles</span> <span class="v">${Math.round(r.up / r.total * 100)}%</span></span><span><i style="background:var(--vp-down)"></i><span class="k">falling</span> <span class="v">${Math.round(r.down / r.total * 100)}%</span></span><span class="cut"></span>`;
      }
    }
    if (clean != null) info = clean + (state.timeOnly || v == null ? "" : `<span><span class="k">Volume${state.contract ? " (" + state.contract.name + ")" : ""}</span> <span class="v">${short(v)}</span></span><span class="cut"></span>`);  // AAA_V1: the previous day's three figures and the candle's volume
    $("info").innerHTML = info.replace(/<span class="cut"><\/span>$/, "");
    $("legend").innerHTML = html;
  }
  function drawNote() {
    const note = $("note");
    if (!state.bars.length) { note.className = "warn"; note.textContent = "No candles yet."; return; }
    if (state.timeOnly) { note.className = "warn"; note.textContent = "No volume from Dhan right now" + (state.problem ? " (" + state.problem + ")" : "") + ". The rows show how much TIME the price spent at each level, not how much was traded."; return; }
    note.className = "";
    note.textContent = `An index has no volume of its own: the rows use the volume of ${state.contract ? state.contract.name + " (expiry " + state.contract.expiry + ")" : "the index's futures"}, from Dhan${state.rolled ? " (" + state.rolled + ")" : ""}. Blue: traded in rising candles. Amber: in falling ones. Today's rows are cut again as the day's range grows, so today's busiest price can move until the close. Not a call.`;
  }

  chart.subscribeCrosshairMove((param) => {
    const had = state.hover;
    if (!param || param.time == null || !param.point) state.hover = null;
    else state.hover = { time: param.time - IST, price: candles.coordinateToPrice(param.point.y) };
    if (had || state.hover) drawLegend();
    if (draw.first) { const at = pointAt(param); if (at) { draw.hover = { time: at.time, price: at.price }; redraw(); } }
  });

  // ---------------------------------------------------------------- the signal
  // The owner's document "Volume Profile Signal Logic" (13 November). The server works it out with the document's own code
  // (/indices/{name}/vp-signal); the page only shows it: CE, PE or WAIT with the reason, the stop, the target and the lots,
  // yesterday's VAL, POC and VAH, the naked POCs, how today opened, and the last sessions for study. On the chart: yesterday's
  // three levels as lines, and after a signal its stop and its target. It states a signal; no order is placed anywhere.
  const SETUPS = { "Rejection at value-area high": "A. Rejection at VAH", "Rejection at value-area low": "B. Rejection at VAL", "Acceptance above value": "C. Acceptance above value",
                   "Acceptance below value": "C. Acceptance below value", "80% rule": "D. 80% rule" };
  const OPENED = { inside: "inside yesterday's value area", above: "above yesterday's value area (above VAH)", below: "below yesterday's value area (below VAL)" };
  let sigLines = [], sigSeq = 0, sigMore = false;
  const shortDay = (iso) => iso ? new Date(iso + "T00:00:00Z").toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: "UTC" }) : "";
  async function loadSignal() {
    if (!$("show-signal").checked) return;
    const seq = ++sigSeq, name = state.name, premium = state.premium > 0 ? "?premium=" + encodeURIComponent(state.premium) : "";
    try {
      const r = await fetch(`/indices/${encodeURIComponent(name)}/vp-signal${premium}`, withTab());
      if (r.status === 401 || seq !== sigSeq || name !== state.name) return;
      state.signal = r.ok ? await r.json() : { problem: "HTTP " + r.status };
    } catch (e) { if (seq !== sigSeq) return; state.signal = state.signal || { problem: "could not be loaded" }; }
    drawSignal();
  }
  function outcomeWords(o) {
    if (!o) return "";
    const pts = `<span class="v ${o.points >= 0 ? "up" : "down"}">${o.points >= 0 ? "+" : "−"}${num(Math.abs(o.points))} points</span>`;
    return o.how === "stop" ? `Out at the stop, ${o.at}: ${pts}` : o.how === "target" ? `Out at the target, ${o.at}: ${pts}` : o.how === "time" ? `Out at ${o.at} (time): ${pts}` : `Still open: ${pts} now${o.live ? " (live price)" : ""}`;
  }
  function drawSignal() {
    if (document.activeElement && document.activeElement.id === "sig-premium" && state.signal && state.signal.signal) return;  // not while the premium is being typed
    for (const line of sigLines) candles.removePriceLine(line);
    sigLines = [];
    const box = $("sig"), g = state.signal, on = $("show-signal").checked;
    box.hidden = !on;
    if (!on) return;
    if (!g) { box.innerHTML = `<div class="line"><span class="badge">…</span><span>Reading the signal…</span></div>`; return; }
    if (g.problem || !g.signal) { box.innerHTML = `<div class="line"><span class="badge">WAIT</span><span>The signal could not be worked out: ${g.problem || "no answer"}</span></div>`; return; }
    const s = g.signal, lv = g.levels, kind = s.signal === "CE" ? "ce" : s.signal === "PE" ? "pe" : "";
    let top = `<span class="badge ${kind}">${s.signal === "WAIT" ? "WAIT" : "BUY " + s.signal}</span>`;
    if (s.signal === "WAIT") top += `<span><b>${s.reason || "No valid setup yet."}</b></span>` + (s.skipped && s.skipped.length ? `<span class="k">Skipped: ${s.skipped.join("; ")}</span>` : "");
    else {
      top += `<span><b>${SETUPS[s.setup] || s.setup}</b> · ${s.why}</span><span><span class="k">Candle</span> <span class="v">${s.candle}</span> <span class="k">index</span> <span class="v">${num(s.index_price)}</span></span>`
        + `<span><span class="k">Stop</span> <span class="v">${num(s.index_stop)}</span></span><span><span class="k">Target</span> <span class="v">${num(s.index_target)}</span></span>`
        + `<span><span class="k">Risk</span> <span class="v">${num(s.risk_pts)}</span> <span class="k">reward</span> <span class="v">${num(s.reward_pts)}</span> <span class="k">(${s.reward_to_risk} to 1)</span></span>`;
      const z = s.sizing;
      if (z) top += z.lots == null ? `<span class="k">${z.note}</span>` : `<span><span class="k">Lots</span> <span class="v">${z.lots}</span> <span class="k">(lot ${z.lot_size}, about ₹${num(z.approx_loss_at_stop_inr, 0)} lost at the stop${z.cost_inr != null ? ", cost ₹" + num(z.cost_inr, 0) : ""})</span></span>`;
      top += `<span>${outcomeWords(s.outcome)}</span>`;
      if (s.skipped && s.skipped.length) top += `<span class="k">Skipped before it: ${s.skipped.join("; ")}</span>`;
    }
    let second = "";
    if (lv) {
      second += `<span><span class="k">Previous trading day's levels (${shortDay(g.levels_from)}: ${lv.candles === "1m" ? "1-minute" : "5-minute"} candles, ${lv.uses_volume ? "futures volume" : "time only, no volume"}, ${lv.like_chart ? "the same count as the chart's profile" : lv.bin_size_pts + "-point rows"}):</span> <span class="k">VAL</span> <span class="v">${num(lv.val)}</span> <span class="k">POC</span> <span class="v">${num(lv.poc)}</span> <span class="k">VAH</span> <span class="v">${num(lv.vah)}</span></span>`;
      second += `<span><span class="k">${shortDay(g.day)} opened</span> <span class="v">${g.opened ? OPENED[g.opened] : "not yet"}</span></span>`;
      second += `<span><span class="k">Read up to the candle of</span> <span class="v">${g.last_candle || "—"}</span><span class="k">${g.live ? ", exits on the live price" : ""}</span></span>`;
    second += `<span><span class="k">Naked POCs:</span> <span class="v">${g.naked && g.naked.length ? g.naked.map(p => num(p.poc) + " (" + shortDay(p.date) + ")").join(", ") : "none"}</span></span>`;
    }
    if (s.signal !== "WAIT") second += `<span><label class="k">Option premium ₹ <input id="sig-premium" type="number" min="0" step="0.05" inputmode="decimal" value="${state.premium || ""}" placeholder="optional"></label></span>`;
    // a narrow screen: the first line alone, the rest behind "Show details", so the chart keeps its room
    const narrow = innerWidth <= 600, toggle = `<span><button type="button" class="link" id="sig-toggle">${sigMore ? "Hide" : "Show"} ${narrow ? "details" : "the last " + (g.history ? g.history.length : 0) + " days and the settings"}</button></span>`;
    if (!narrow) second += toggle;
    else if (sigMore) top += toggle;
    else {  // the short form: the signal, its stop and target, how it went
      second = "";
      top = `<span class="badge ${kind}">${s.signal === "WAIT" ? "WAIT" : "BUY " + s.signal}</span>` + (s.signal === "WAIT" ? `<span><b>${s.reason || "No valid setup yet."}</b></span>`
        : `<span><b>${SETUPS[s.setup] || s.setup}</b> <span class="k">at</span> <span class="v">${s.candle}</span></span><span><span class="k">Stop</span> <span class="v">${num(s.index_stop)}</span> <span class="k">Target</span> <span class="v">${num(s.index_target)}</span></span><span>${outcomeWords(s.outcome)}</span>`) + toggle;
    }
    let more = "";
    if (sigMore) {
      more += `<div id="sig-more"><table><tr><th>Day</th><th>Opened</th><th>Signal</th><th>Setup</th><th>Candle</th><th>Index</th><th>Stop</th><th>Target</th><th>Reward to risk</th><th>Result</th></tr>`
        + (g.history || []).map(h => `<tr><td>${shortDay(h.day)}</td><td>${h.opened || "—"}</td><td>${h.signal}</td><td>${h.setup ? SETUPS[h.setup] || h.setup : h.skipped ? h.skipped + " skipped" : "—"}</td><td>${h.candle || "—"}</td><td>${h.index_price != null ? num(h.index_price) : "—"}</td><td>${h.index_stop != null ? num(h.index_stop) : "—"}</td><td>${h.index_target != null ? num(h.index_target) : "—"}</td><td>${h.reward_to_risk != null ? h.reward_to_risk + " to 1" : "—"}</td><td>${outcomeWords(h.outcome) || "—"}</td></tr>`).join("") + `</table>`;
      const c = g.settings || {};
      more += `<div class="small" style="margin-top:6px">Settings: rows of ${c.bin_size_pts} points · value area ${c.value_area_pct}% · an edge counts as touched within ${c.edge_tolerance_pts} points · stop ${c.stop_buffer_pts} points beyond · ${c.acceptance_closes} closes outside for acceptance · reward at least ${c.min_reward_to_risk} times the risk · signals ${c.no_entry_before} to ${c.no_entry_after}, out by ${c.exit_all_by} · one signal a day · sizing: ₹${num(c.max_loss_per_trade_inr, 0)} lost at most a trade, an option taken to move ${c.assumed_delta} a point, at most ${c.max_capital_per_trade_pct}% of ₹${num(c.capital_inr, 0)}.</div>`
        + `<div class="small">A signal for paper trading and study. In the document's two-year test on NIFTY 50 this logic did not make money overall. It is not advice, and no order is placed.</div></div>`;
    }
    box.innerHTML = `<div class="line">${top}</div>${second ? `<div class="line">${second}</div>` : ""}${more}`;
    $("sig-toggle").addEventListener("click", () => { sigMore = !sigMore; drawSignal(); });
    const pin = $("sig-premium");
    if (pin) pin.addEventListener("change", () => { state.premium = Number(pin.value) || 0; loadSignal(); });
    // on the chart: yesterday's three levels, and the signal's stop and target
    // after the close the lines show today's levels, for the next session (16 November: "only levels on the chart"); the box above is unchanged
    const cl = g.chart_levels, lvc = cl ? cl.levels : lv, from = cl ? cl.levels_from : g.levels_from;
    if (lv) {
      const line = (price, title, color, style) => sigLines.push(candles.createPriceLine({ price, title, color, lineWidth: 1, lineStyle: style, axisLabelVisible: true }));
      line(lvc.vah, "Prev day VAH " + shortDay(from), css("--va"), LC.LineStyle.Dotted);  // named as the previous day's (15 November): the drawn profile of the same day has its own 24 rows
      line(lvc.poc, "Prev day POC " + shortDay(from), css("--poc"), LC.LineStyle.Dotted);

  }

  // ---------------------------------------------------------------- the OI walls (17 November)
  // The owner, 17 November, with the price above all of the day's volume: "how to find the resistance from here ? any logic ? any
  // indicator ?"; "yes show the screenshot first". Where the day's profile has nothing above (or below) the price, the option chain
  // still says where the writers stand: the Call OI wall is the strike at or above the index with the most Call open interest (a
  // resistance), the Put OI wall the strike at or below it with the most Put open interest (a support); on a tie the nearer strike.
  // The nearest expiry's chain, the one the index page's OI chart reads (/options/<name>/chain), asked every 15 s while the tick is on.
  // A tick box of its own, off by default, remembered apart from the others: with it off the page asks nothing and draws nothing.
  // Two lines and two figures in the line above the chart: no call, no signal, nothing of the profile changes.
  let oiLines = [], oiSeq = 0;
  try { if (!EMBED && localStorage.getItem("volumeProfileOI") === "1") $("show-oi").checked = true; } catch (e) {}
  function oiWalls(data) {
    const f = data.fields || [], si = f.indexOf("strike"), ci = f.indexOf("ce_oi"), pi = f.indexOf("pe_oi"), px = data.underlying;
    if (si < 0 || ci < 0 || pi < 0 || !(px > 0)) return null;
    let call = null, put = null;
    for (const r of data.rows || []) {  // the strikes rise: the first biggest Call above is the nearest, the last biggest Put below is the nearest
      const k = r[si], c = r[ci] || 0, q = r[pi] || 0;
      if (k >= px && c > 0 && (!call || c > call.oi)) call = { strike: k, oi: c };
      if (k <= px && q > 0 && (!put || q >= put.oi)) put = { strike: k, oi: q };
    }
    return call || put ? { call, put, expiry: data.expiry, name: data.name } : null;
  }
  // both walls in view (17 November, the owner: "i can onlly see Call OI wall where is Put OI wall"): the prices the chart shows are
  // widened to hold the two strikes while the tick is on; with it off the chart's own range, untouched
  function oiRange(o) {
    const w = state.oi, pd = EMBED ? state.prevDay : null;
    if (o && o.priceRange && pd) return { ...o, priceRange: { minValue: Math.min(o.priceRange.minValue, pd.low), maxValue: Math.max(o.priceRange.maxValue, pd.high) } };  // AAA_V1: the previous day's three lines stay in view
    if (!o || !o.priceRange || !w || !$("show-oi").checked) return o;
    let { minValue, maxValue } = o.priceRange;
    for (const x of [w.call, w.put]) if (x) { minValue = Math.min(minValue, x.strike); maxValue = Math.max(maxValue, x.strike); }
    return { ...o, priceRange: { minValue, maxValue } };
  }
  // The prices in view are touched only when the walls' strikes change (the box ticked or unticked, a wall moved to another
  // strike), never on each 15 s look, and never when the prices were stretched or moved by hand (17 November, the owner: "when i
  // am stretching the chart or expanding it is getting reset or shrinks automatically within 10 seconds"): each look used to
  // switch the price scale back to fitting itself. A scale put by hand stays as it was put; the lines are still drawn.
  let oiDrawn = "", oiStrikes = "";
  function oiRescale() {
    if (state.priceView) return;  // put by the up and down buttons: that range stays
    const auto = candles.priceScale().options().autoScale;
    candles.applyOptions({ autoscaleInfoProvider: (original) => oiRange(original()) });
    if (auto) candles.priceScale().applyOptions({ autoScale: true });  // fitting itself: fit again with (or without) the walls
  }
  function drawOi() {
    const w = $("show-oi").checked && state.oi && state.oi.name === state.name ? state.oi : null;
    const side = (x) => x ? `${x.strike}:${x.oi}` : "-", drawn = w ? `${state.name}|${side(w.call)}|${side(w.put)}` : "", strikes = w ? `${state.name}|${w.call ? w.call.strike : "-"}|${w.put ? w.put.strike : "-"}` : "";
    if (!w) state.oi = null;
    if (drawn !== oiDrawn) {  // the lines are drawn again only when a strike or its open interest changed
      oiDrawn = drawn;
      for (const line of oiLines) { try { candles.removePriceLine(line); } catch (e) {} }
      oiLines = [];
      const line = (x, title, color) => { if (x) oiLines.push(candles.createPriceLine({ price: x.strike, title: `${title} ${short(x.oi)}`, color, lineWidth: 2, lineStyle: LC.LineStyle.Dashed, axisLabelVisible: true })); };
      if (w) { line(w.call, "Call OI wall (resistance)", css("--down")); line(w.put, "Put OI wall (support)", css("--up")); }
    }

  }
  async function loadOi() {
    if (!$("show-oi").checked) { state.oi = null; state.oiWhy = ""; drawOi(); return; }

    try {
      const r = await fetch(`/options/${encodeURIComponent(name)}/chain`, withTab());
      if (seq !== oiSeq || name !== state.name) return;  // an answer for an older ask or another index
      // no chain, or a chain with no open interest: the lines stay as they were, and the line above the chart says why
      // (17 November, the owner, with the box ticked and nothing drawn: "where is call OI and put OI ?")
      if (!r.ok) { let why = "HTTP " + r.status; try { why = (await r.json()).detail || why; } catch (e) {} state.oiWhy = String(why).slice(0, 140); drawLegend(); return; }
      const w = oiWalls(await r.json());

    } catch (e) { state.oiWhy = "could not reach the server"; drawLegend(); }
  }
  $("show-oi").addEventListener("change", () => { try { localStorage.setItem("volumeProfileOI", $("show-oi").checked ? "1" : "0"); } catch (e) {} loadOi(); });
  $("index").addEventListener("change", () => { state.oi = null; state.oiWhy = ""; setTimeout(() => { drawOi(); loadOi(); }, 0); });
  setInterval(() => { if (!document.hidden) loadOi(); }, 15000);  // every 15 s, as the index page's OI chart (the owner, 17 November: "yes make it 15 seconds")
  setTimeout(loadOi, 1500);

  // ---------------------------------------------------------------- the Shape signal (static/vpshape.js)
  // 15 November, the owner, with the Pine script "Volume Profile Anatomies (D / B / P / Double Zone)": "make your own volume profile
  // strategy out of it and convert that startegy for our volume profile page"; "multiple signals should be allowed in a day"; "Build
  // option 1 but this user interface should not be changed at all". So: one tick box, off until ticked; with it on, one block of
  // lines under the signal's and small marks on the chart; with it off the page is as it was. Counted in the page from the last
  // day's 1-minute candles and their futures volume (time when there is none), again with every recount: paper only, no order
  // Two lists work side by side (the owner: "keep the signals shapewise also and keep the calls signals with earlier logic as well.
  // Both should work hand in hand"): the BREAK calls (a close outside the value area, 12:10 to 13:30) and the SHAPE calls (each
  // shape's own setup, 10:15 to 14:30); each list has its own one call open at a time. The shape's name stands above each profile
  // One marker set for the Shape and the Impulse marks (15 November, the owner, with the texts of two calls drawn over each other
  // on one candle: "why it is mixing up ?"): two sets each drew at the same spot; in one set the chart stacks them, one above the other
  const markSets = { shape: [], impulse: [] }; let allMarks = null;
  function drawMarks(which, marks) {

    if (!allMarks) allMarks = LC.createSeriesMarkers(candles, []);
    allMarks.setMarkers([...markSets.shape, ...markSets.impulse].sort((a, b) => a.time - b.time));
  }
  let shapeStops = [];
  function drawShape() {
    const box = $("shape"), on = $("show-shape").checked;

    for (const l of shapeStops) candles.removePriceLine(l);
    shapeStops = [];

    const days = VolProfile.sessions(state.fine), fine = days[days.length - 1] || [];
    if (!fine.length) { box.innerHTML = `<div class="line"><span class="badge">…</span><span>Reading the candles…</span></div>`; return; }
    const have = [...state.fineVolumes.values()].some(v => v > 0), weights = have ? state.fineVolumes : null;
    const b5 = VpShape.five(fine), now = Date.now() / 1000, closed = b5.filter(b => b.time + 300 <= now).length, c = VpShape.CFG;
    const p = VpShape.read(fine, weights), lists = [{ key: "Break", calls: VpShape.calls(b5, closed, fine, weights), from: c.from, to: c.to }, { key: "Shape", calls: VpShape.shapeCalls(b5, closed, fine, weights), from: c.shapeFrom, to: c.shapeTo }];
    const day = dayOf(fine[0].time), today = Math.floor((fine[0].time + IST) / 86400) === Math.floor((now + IST) / 86400), clock = VpShape.hm(now);
    const pts = (x) => `<span class="v ${x >= 0 ? "up" : "down"}">${x >= 0 ? "+" : "−"}${num(Math.abs(x))} points</span>`;
    const how = (t) => t.how === "stop" ? `stop ${VpShape.hm(t.exitTime)}` : t.how === "time" ? `out ${VpShape.hm(t.exitTime)}` : "open";
    let html = `<div class="line"><span><b>Shape signal</b> <span class="k">paper only</span></span><span><span class="k">Shape ${day}</span> <span class="v">${VpShape.NAMES[p.shape]}</span></span>`
      + `<span><span class="k">Value area so far</span> <span class="v">${num(p.val)}</span> <span class="k">to</span> <span class="v">${num(p.vah)}</span> <span class="k">busiest</span> <span class="v">${num(p.poc)}</span></span></div>`;
    for (const L of lists) {
      const open = L.calls.find(t => t.how === "open"), state2 = !today || clock > L.to ? "window over" : clock < L.from ? `from ${L.from}` : "waiting";
      html += `<div class="line"><span class="badge ${open ? open.side.toLowerCase() : ""}">${open ? "BUY " + open.side : "WAIT"}</span><span><b>${L.key} calls</b> <span class="k">${L.from} to ${L.to}</span></span>`
        + (open ? `<span><b>Call ${open.n}</b>${open.setup ? " · " + VpShape.SETUPS[open.setup] : ""} · fired <span class="v">${VpShape.hm(open.entryTime)}</span> <span class="k">at</span> <span class="v">${num(open.entry)}</span></span><span><span class="k">Stop</span> <span class="v">${num(open.stop)}</span></span><span><span class="k">Now</span> ${pts(open.points)}</span>`
                : `<span class="k">No call open (${state2})</span>`)
        + L.calls.filter(t => t !== open).map(t => `<span><span class="k">${t.n}.</span> <span class="v">${VpShape.hm(t.entryTime)} ${t.side} ${num(t.entry)}</span> <span class="k">${t.setup ? t.setup.split("-")[0] + " · " : ""}${how(t)}</span> ${pts(t.points)}</span>`).join("")
        + (L.calls.length > 1 ? `<span><span class="k">Total</span> ${pts(L.calls.reduce((a, t) => a + t.points, 0))}</span>` : "") + `</div>`;
    }
    html += `<div class="line rule"><span class="k">Break calls: a 5-minute candle closing outside the day's value area so far, stop at the busiest price of that moment. Shape calls: P a dip to the busiest price that holds (CE); B a rise to it that fails (PE); D a turn at the value area's high (PE) or low (CE); Double Zone a close across the gap. Every call is out at its stop or at ${c.exit}.${have ? "" : " Counted by time: no volume."}</span></div>`;

      if (x != null) marks.push({ time: x, position: up ? "aboveBar" : "belowBar", color: css("--muted"), shape: up ? "arrowDown" : "arrowUp", text: (tag ? "x" + tag.trim() : "X") + t.n });

  // ---------------------------------------------------------------- the Impulse MACD (static/impulse.js)
  // 15 November, the owner, with LazyBear's Pine script "Impulse MACD": "develope a best strategy out of it and develop the same on
  // volume profile page". One tick box, off until ticked; with it off the page is as it was. On: the indicator in a pane of its own
  // under the chart (and under the RSI's), drawn as the script draws it: md as coloured bars, md minus its signal as blue bars, the
  // signal as a line; and the Impulse calls: the page's break calls that the impulse agrees with (the rule is in impulse.js).
  // The pane follows the candle size shown; the calls always read the 5-minute candles of the last five days. Paper only
  let imp = null, impStop = null;
  function dropImpulse() { if (imp) { for (const x of [imp.md, imp.sh, imp.sb]) chart.removeSeries(x); imp = null; fitPanes(); } }
  function setImpulse() {

    if (!imp) {
      const pane = rsi ? 2 : 1, plain = { priceLineVisible: false, lastValueVisible: false, priceFormat: { type: "price", precision: 2, minMove: 0.01 } };
      imp = { sh: chart.addSeries(LC.HistogramSeries, { ...plain, color: alpha(css("--imp-hist"), 0.55) }, pane),
              md: chart.addSeries(LC.HistogramSeries, { ...plain, lastValueVisible: true }, pane),
              sb: chart.addSeries(LC.LineSeries, { ...plain, color: css("--imp-signal"), lineWidth: 1.5, crosshairMarkerVisible: false }, pane) };
      imp.md.createPriceLine({ price: 0, color: css("--muted"), lineWidth: 1, lineStyle: LC.LineStyle.Solid, axisLabelVisible: false, title: "" });
      fitPanes();
    }
    const values = new Map(Impulse.compute(state.bars).map(x => [x.time, x])), tone = { lime: css("--imp-lime"), green: css("--imp-green"), orange: css("--imp-orange"), red: css("--imp-red") };
    const bars = shown().flat().map(b => values.get(b.time)).filter(x => x && x.colour);
    imp.md.setData(bars.map(x => ({ time: x.time + IST, value: x.md, color: tone[x.colour] })));
    imp.sh.setData(bars.filter(x => x.sh != null).map(x => ({ time: x.time + IST, value: x.sh })));
    imp.sb.setData(bars.filter(x => x.sb != null).map(x => ({ time: x.time + IST, value: x.sb })));
  }
  function drawImpulse() {
    const box = $("impulse"), on = $("show-impulse").checked;
    box.hidden = !on;
    if (impStop) { candles.removePriceLine(impStop); impStop = null; }
    if (!on) { drawMarks("impulse", []); return; }
    const days = VolProfile.sessions(state.fine), fine = days[days.length - 1] || [];
    if (!fine.length) { box.innerHTML = `<div class="line"><span class="badge">…</span><span>Reading the candles…</span></div>`; return; }
    const have = [...state.fineVolumes.values()].some(v => v > 0), weights = have ? state.fineVolumes : null;
    const all5 = VpShape.five(state.fine), now = Date.now() / 1000, dayNo = (t) => Math.floor((t + IST) / 86400), last = dayNo(fine[0].time);
    const closed = all5.filter(b => dayNo(b.time) === last && b.time + 300 <= now).length;
    const got = Impulse.calls(all5, closed, fine, weights), calls = got.calls, open = calls.find(t => t.how === "open"), c = VpShape.CFG, ic = Impulse.CFG;
    const day = dayOf(fine[0].time), today = last === dayNo(now), clock = VpShape.hm(now);
    const done = all5.filter(b => b.time + 300 <= now), x = done.length ? got.values.get(done[done.length - 1].time) : null;

    const crossed = before ? Impulse.crossings(today5, kLast, before.poc) : null, choppy = crossed != null && crossed > ic.chopMax;

    let html = `<div class="line"><span class="badge ${open ? open.side.toLowerCase() : ""}">${open ? "BUY " + open.side : "WAIT"}</span><span><b>Impulse calls</b> <span class="k">all day · paper only</span></span>`
      + (open ? `<span><b>Call ${open.n}</b> · fired <span class="v">${VpShape.hm(open.entryTime)}</span> <span class="k">at</span> <span class="v">${num(open.entry)}</span></span><span><span class="k">Stop</span> <span class="v">${num(open.stop)}</span></span><span><span class="k">Now</span> ${pts(open.points)}</span>`

      + (calls.length > 1 ? `<span><span class="k">Total</span> ${pts(calls.reduce((a, t) => a + t.points, 0))}</span>` : "") + `</div>`;

      + (crossed != null ? `<span><span class="k">Sideways check: the price crossed the busiest price</span> <span class="v ${choppy ? "down" : ""}">${crossed} time${crossed === 1 ? "" : "s"}</span> <span class="k">in the last 2 hours (calls are held back above ${ic.chopMax})</span></span>` : "") + `</div>`;

    const marks = [];
