      const up = t.side === "CE", e = at(t.entryTime), xx = t.exitTime != null ? at(t.exitTime) : null;
      if (e != null) marks.push({ time: e, position: up ? "belowBar" : "aboveBar", color: css(up ? "--up" : "--down"), shape: up ? "arrowUp" : "arrowDown", text: "I " + t.side + " " + t.n });
      if (xx != null) marks.push({ time: xx, position: up ? "aboveBar" : "belowBar", color: css("--muted"), shape: up ? "arrowDown" : "arrowUp", text: "xI" + t.n });
      if (SHOW_CALLS && t.how === "open") impStop = candles.createPriceLine({ price: t.stop, title: "Impulse stop", color: css("--down"), lineWidth: 1, lineStyle: LC.LineStyle.Dashed, axisLabelVisible: true });
    }
    drawMarks("impulse", marks);
  }

  // ---------------------------------------------------------------- the Impulse call table
  // 15 November, the owner: "make a separate table with header as Impulse call table as a sperate capsule tab and add all the impulse
  // calls in that table. table should have scroll up and down button. table should have all the headers a fixed row and also should
  // have the functionality of moving the column from left to right and right to left by holding the column itself."
  // Every Impulse call of the days the page holds (the last five; the first of them only warms the averages up), the newest first.
  // The header row stays while the rows move under it; a column is moved by holding its header and dragging it left or right, with
  // the mouse or a finger; the order is remembered on this device. The calls are the ones static/impulse.js gives: nothing is decided here
  const IMP_COLS = [["day", "Date"], ["n", "No."], ["side", "Call"], ["signal", "Signal candle"], ["entryAt", "Entry time"], ["entry", "Entry"], ["stop", "Stop"],
                    ["exitAt", "Exit time"], ["exit", "Exit"], ["how", "Ended by"], ["points", "Points"], ["md", "Impulse MACD"], ["sb", "Signal line"], ["shape", "Shape then"]];
  let impOrder = IMP_COLS.map(c => c[0]), impPast = new Map(), impHead = "", impBody = "", impDrag = null;
  try { const saved = JSON.parse(localStorage.getItem("volumeProfileImpulseCols") || "null"); if (Array.isArray(saved) && saved.length === impOrder.length && impOrder.every(k => saved.includes(k))) impOrder = saved; } catch (e) {}
  const tableShown = () => !$("imptable").hidden;
  function impulseRows() {
    const days = VolProfile.sessions(state.fine), have = [...state.fineVolumes.values()].some(v => v > 0), weights = have ? state.fineVolumes : null, now = Date.now() / 1000, rows = [];
    for (let i = 1; i < days.length; i++) {  // the first day loaded has no candles before it for the averages: it only warms them up
      const fine = days[i], lastDay = i === days.length - 1, key = `${state.name}|${fine[0].time}|${fine.length}|${have}`;
      let calls = lastDay ? null : impPast.get(key);
      if (!calls) {
        const all5 = VpShape.five(days.slice(0, i + 1).flat()), dayNo = Math.floor((fine[0].time + IST) / 86400);
        const closed = all5.filter(b => Math.floor((b.time + IST) / 86400) === dayNo && b.time + 300 <= now).length;
        calls = Impulse.calls(all5, closed, fine, weights).calls;
        if (!lastDay) { if (impPast.size > 40) impPast.clear(); impPast.set(key, calls); }
      }
      for (const t of calls) rows.push({ t, day: dayOf(fine[0].time) });
    }
    return rows.sort((a, b) => b.t.entryTime - a.t.entryTime);
  }

  }, 2000);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden || parked) return;
    if (tickHours() && (Date.now() - lastTickAt > 3000 || !liveWs || liveWs.readyState !== WebSocket.OPEN)) { kickWait = KICK_FIRST; reconnectNow(); }
    else { load(); loadSignal(); loadPanel(); }
  });
  window.addEventListener("online", () => { kickWait = KICK_FIRST; reconnectNow(); });
  window.addEventListener("pagehide", () => { parked = true; if (liveWs && liveWs.readyState <= WebSocket.OPEN) liveWs.close(); });
  window.addEventListener("pageshow", (event) => { if (!event.persisted) return; parked = false; beat().then(() => { load(); keepAlive(); }); });
  // The page stays where it is: whatever tries to scroll it is put back at once; the wheel with Ctrl held, a pinch on a
  // touch pad and a two-finger pinch on a phone zoom the chart only (the chart does that itself), never the page
  const pinPage = () => { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); for (const el of [document.documentElement, document.body, $("main"), $("wrap")]) { if (el.scrollTop) el.scrollTop = 0; if (el.scrollLeft) el.scrollLeft = 0; } };
  window.addEventListener("scroll", pinPage, true);
  window.addEventListener("wheel", (e) => { if (e.ctrlKey || !e.target.closest("#chart, #tools, #info, #draw, #calls-wrap")) e.preventDefault(); }, { passive: false });
  for (const kind of ["gesturestart", "gesturechange", "gestureend"]) document.addEventListener(kind, (e) => e.preventDefault());
  document.addEventListener("touchmove", (e) => { if (e.touches.length > 1 && !e.target.closest("#chart")) e.preventDefault(); }, { passive: false });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paint);
  paint();
})();
</script>
