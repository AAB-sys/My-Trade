  }

  // ---- Layer 2 of the owner's logic, held and crossed (see LOGIC.md), is judged inside the paper
  // calls below; its own table came off the page on 6 October (owner's choice).
  const SECONDS = { "1m": 60, "5m": 300, "15m": 900, "30m": 1800, "1d": 86400, "1w": 7 * 86400 };
  const endOf = (b) => Rules.endOf(b, SECONDS[state.interval]);  // when a candle closes (never past 3:30 pm of its day)

  // ---- Layer 3 of the owner's logic: paper calls (see LOGIC.md)
  // The rule, run over the closed candles shown with the levels on the chart:
  //   signal  - a closed candle that HELD a level ("trade the bounce") or CROSSED one ("trade the
  //             break"), or either, as the switch says; when one candle signals at several levels,
  //             the one nearest its close counts: one candle, one call. A level that has given a
  //             call in a direction gives no more that way until the index closes back across it
  //   the call - given the moment the signal candle closes; no confirming candle (owner's decision,
  //             6 October: the call must come at once, not a candle later)
  //   option  - always bought, never sold: a CE when the candle closed above the level (the index
  //             should rise), a PE when it closed below (it should fall)
  //   entry   - the open of the next candle, i.e. the first price after the signal candle closes
  //   target  - the next level in the call's direction; the call ends when a later candle reaches it,
  //             the one forming now included, tick by tick. No stop (owner's decision, 5 October)
  //   day end - a call still open at the day's last candle ends at its close; nothing carries overnight
  //             (not on day candles, where a day is one candle: there a call runs on until its target)
  //   every signal gives a call, whether or not earlier calls are still open;
  //   a signal pointing outward from the 0% or 100% level has no next level, so it gives no call (8 October evening: the
  //   seven lines only, the extra line beyond each end of that afternoon taken off)
  //   a break  - the owner's exit rule "Hold Through a Level Break" (8 October night; Rules.paperTrades holdBreaks): a call
  //             from a crossed signal is held through its target and sold on a close back across its line, on a return to
  //             the signal candle's open after a candle opened further away, or at the day end; while it is held, no new
  //             call that way. Not on day candles. Rule 2 of the owner's specification (9 October; Rules.TRAIL): once a candle closes
  //             beyond a further line, the stop moves to that line, line by line, and a close back past it sells
  const dayOf = Rules.dayOf, dayOver = Rules.dayOver;
  const HOW = { target: "Target", "day end": "Day end", candle: "Exit", back: "Closed back", retouch: "Came back", trail: "Closed back past the moved stop", sold: "Sold at the Sell mark", open: "Still open", pending: "Enters at the next open" };  // the CSV's words
  const lineName = (ratio) => Rules.levelName(ratio, state.move === "close");  // a line's name: "23.6%"; on the previous close's lines "+23.6%" above the close, "-23.6%" below it
  const pctOf = (t) => lineName(t.ratio);  // the level's ratio, as the rows and the CSV show it
  let lastPaper = { trades: [], levels: [] };

  // The rule is Rules.paperTrades in /static/rules.js; this page hands it the session's candles, the levels on the
  // chart (which stand still within one run; the live page redraws them on a new high or low) and the server's clock
  // "Today so far" levels (8 October): each candle is judged against the levels as they stood when it began (the day's range
  // up to the candle before it), exactly as a saved day is replayed (Rules.replayDay) and
  // as the server's watcher records the calls. Until that morning every candle was judged against the levels of this
  // moment, so each new high or low of the day redrew the whole morning's calls; from then until the afternoon each candle
  // was judged with its own high and low in the range, so every candle making a new low "held" the 0% line it drew itself
  // (Buy CE after Buy CE on a falling day). The chart shows the day's range with the candle forming now, worked out again
  // at once on a new high or low; a call's target follows those lines.
  function paperTrades(levels) {
    const bars = sessionBars(), fromClose = closeLinesAt(bars);
    const levelsAt = judgedToday() ? Rules.todayLevelsAt(bars) : fromClose || (() => levels), targetsAt = judgedToday() ? Rules.todayLinesAt(bars) : null;
    return Rules.paperTrades({ bars, levelsAt, targetsAt, now: serverNow(), seconds: SECONDS[state.interval],
                               dayCandles: longCandles(), signal: state.signal, holdBreaks: !longCandles(), trail: Rules.TRAIL,
                               given: longCandles() ? null : givenCalls(), freshRun: state.interval === "5m" && !!Rules.FRESH_RUN[name],  // idea 13, NIFTY 50 (12 October)
                               newHighLow: state.interval === "5m" && judgedToday() && !!Rules.NEW_HIGH_LOW[name],  // idea 24, a call past the day's high or low: NIFTY 50, today so far (13 October)
                               clearCross: state.interval === "5m" && !!Rules.CLEAR_CROSS[name], oneWay: state.interval === "5m" && !!Rules.ONE_WAY[name] });  // ideas 8 and 5, NIFTY 50 (13 October)
  }
  // The calls given live (9 October, the owner: a call already given must stay on the table): today's records of options
  // bought on this page's time frame and levels, { signal candle's time: side }, the first recorded for a candle. A candle
  // whose final prices from Dhan no longer give its call (13:35, closed exactly on the 78.6% line) keeps it (Rules.paperTrades)
  function givenCalls() {
    const given = {}, head = `${name}|${state.interval}|`, tail = `|${state.move}`;
    Object.values(optionRecords).filter(r => r.key.startsWith(head) && r.key.endsWith(tail)).sort((a, b) => (a.paid_at < b.paid_at ? -1 : 1))
      .forEach(r => { const [, , at, side] = r.key.split("|"); if (!(at in given)) given[at] = side; });
    return given;
  }

  function drawPaper(levels) {
    const box = document.getElementById("paper-box");
    if (!levels.length) { box.hidden = true; lastPaper = { trades: [], levels: [] }; return; }
    box.hidden = false;
    const table = document.getElementById("paper"), note = document.getElementById("paper-note"), score = document.getElementById("paper-score");
    if (state.signal === "off") {
      table.hidden = true; lastPaper = { trades: [], levels };
      score.textContent = "";
      note.textContent = "Off. Pick a signal to see the calls it would have given in this session.";
      return;
    }
    const { trades, closed, skipped } = paperTrades(levels);
    markSold(trades);
    lastPaper = { trades, levels };
    const done = trades.filter(t => t.exit != null);
    const won = done.filter(t => t.points > 0).length, lost = done.filter(t => t.points < 0).length;
    const net = Math.round(done.reduce((s, t) => s + t.points, 0) * 100) / 100;
    const running = trades.filter(t => t.how === "open").length, waiting = trades.some(t => t.how === "pending");
    note.textContent = "";  // the rule itself is written in LOGIC.md; the owner wants the box without it
    score.textContent = (done.length
      ? `${done.length} finished call${done.length === 1 ? "" : "s"} in the ${closed} closed candles of ${sessionName(currentSession())}: ${won} won, ${lost} lost, net ${signed.format(net)} points.`
      : `No finished call in the ${closed} closed candles of ${sessionName(currentSession())}.`)
      + (running ? ` ${running} still open.` : "") + (waiting ? " One is waiting to enter." : "");
    // the signals given no call, newest first, in plain words, one line per reason: idea 13 (12 October), ideas 8 and 5 (13 October)
    const skippedBox = document.getElementById("paper-skipped"), groups = [
      ["No call against a fresh run", x => x.why === "new low" || x.why === "new high", x => `${name} made a ${x.why} in the last 30 minutes`],
      ["No call, the candle closed too near the line", x => x.why === "not clear", () => "less than a quarter of the way to the next line"],
      ["No call while a call the other way is held", x => x.why === "held other way", x => `a Buy ${x.side === "CE" ? "PE" : "CE"} was held`]];
    const said = groups.map(([head, is, why]) => { const L = (skipped || []).filter(is);
      return L.length ? `<b>${head} (${L.length}):</b> ` + L.slice().reverse().map(x => `${callTime(x.signalTime)} Buy ${x.side} (${signalWord(x)} ${lineName(x.ratio)}: ${why(x)})`).join(" · ") : ""; }).filter(Boolean);
    skippedBox.hidden = !said.length;
    skippedBox.innerHTML = said.join("<br>");
    table.hidden = !trades.length;
    const withOptions = !!(state.dhan && state.dhan.configured) && DHAN_INDICES.includes(name);  // the indices whose option prices the server reads
    table.classList.toggle("no-options", !withOptions);
    if (!withOptions && STRIKE_STEP[name] && state.dhan && state.dhan.configured)  // SENSEX, 8 October: say why there is no premium column
      note.textContent = `${name}: the strike follows your one-strike-in-the-money rule on its ${STRIKE_STEP[name]}-point step. Its option prices are not connected yet, so there is no premium column on this page.`;
    drawFeedNote();
    // in time order, the newest call at the top, open or finished alike (the owner's ask, 7 October: an open call
    // listed above a later one read as if it had been given later); a finished row is greyed, its target cell says how it ended
    const rows = trades.slice().sort((a, b) => b.signalTime - a.signalTime);
    table.querySelector("tbody").replaceChildren(...rows.map(t => {
      const tr = document.createElement("tr");
      tr.dataset.key = callKey(t);  // so a live premium finds its row
      tr.className = t.exit != null ? "ended" : "";
      tr.innerHTML = rowCells(t, optionRecords[callKey(t)]);
      return tr;
    }));
    syncOptions(trades);
  }

  // A call sold at its Sell mark (the owner, 9 October: "if it is sold at 67 then ... it should stop there"): the server
  // ends its record there and its premium stops; the row ends too, at the moment of the mark, at the index price of the
  // candle it fell in (its close; the price now for the candle forming), whatever the index rule says
  function markSold(trades) {
    const bars = sessionBars();
    trades.forEach(t => {
      const r = optionRecords[callKey(t)];
      if (!r || !r.sold || !r.ended || r.ended.how !== "sold" || t.entry == null) return;
      const at = Date.parse(r.sold.at) / 1000, bar = [...bars].reverse().find(b => b.time <= at);
      if (!bar) return;
      t.how = "sold"; t.exit = bar.close; t.exitTime = Math.floor(at);
      t.points = Rules.round2(t.side === "CE" ? bar.close - t.entry : t.entry - bar.close);
    });
  }

  // Every call this page suggests for today goes to the server as drawn (the owner's ask, 7 October), so the day's
  // record carries each and every one: sent when the list's shape changes (a call enters, ends or is marked sold),
  // else at most once a minute, so the points and premiums on the record stay fresh without a flood.

  // One row reads left to right, in the owner's format of 7 October: the time, the call with its contract, the signal,
  // the entry (the strike number bought; the index at entry only where there is no strike), the target level (with
  // "hit" or "not reached" once the call has ended), the premium paid and now, and what the candles say (off the table on
  // 7 October evening, back on 8 October: the owner's exit signal).
  function rowCells(t, r) {
    const strike = strikeOf(t, r);
    return `<td>${callTime(t.signalTime)}</td>`
      + `<td class="call">Buy ${t.side}${strike != null ? ` · ${strike} ${t.side}${r ? " " + expiryLabel(r.expiry) : ""}` : ""}</td>`
      + `<td>${signalWord(t)} ${pctOf(t)} · ${fmt.format(t.level)}</td>`
      + entryCell(t, strike) + targetCell(t, r) + premiumCell(t, r) + candleCell(t, r);
  }
  // The owner's words (12 October): "On the line" for a held signal; a crossed one says which way, "Crossed above" (Buy CE) or
  // "Crossed below" (Buy PE) the Fibonacci level
  const signalWord = (t) => t.kind === "held" ? "On the line" : t.side === "CE" ? "Crossed above" : "Crossed below";
  const callTime = (epoch) => istTime(epoch, withDate()).replace(/\b0(\d:)/, "$1").replace(/\b(am|pm)\b/, m => m.toUpperCase());  // "9:15 AM", as the owner's sheet writes it

  // The strike bought (the owner's choice, one strike in the money: a CE the first strike below the index at entry, a PE the
  // first above, dhan.itm_strike): the server's record names it once the call has been seen entering; before that, and for
  // a call no page saw enter, the page works it out the same way from the index at entry on the chain's strike step.
  // SENSEX (8 October): its options trade on BSE in 100-point strikes; the server has no SENSEX option chain yet, so on
  // its page the strike always comes from this rule and there is no expiry and no premium.
  const STRIKE_STEP = { "NIFTY 50": 50, "NIFTY BANK": 100, "SENSEX": 100 };
  function strikeOf(t, r) {
    if (r) return Math.round(r.strike);
    const step = STRIKE_STEP[name];
    if (!step || t.entry == null) return null;
    const k = t.entry / step, on = Number.isInteger(k);  // exactly on a strike: the next one below (CE) or above (PE), as the server does
    return (t.side === "CE" ? (on ? k - 1 : Math.floor(k)) : (on ? k + 1 : Math.ceil(k))) * step;
  }

  // "Call Entry": the strike number of the contract bought (the owner's word: the same number as in the call); the index
  // price the call entered at only where there is no strike
  function entryCell(t, strike) {
    if (t.entry == null) return `<td class="entry wait">buy at next open</td>`;
    return `<td class="entry">${strike != null ? strike : fmt.format(t.entry)}</td>`;
  }

  // "Call Target": the next level in the call's direction, and how the call ended once it has, in the owner's plain words
  // (8 October night: buy, hold, continue, sell). A held break is not sold at its target: once the price has gone past it,
  // the call continues; the note says what sells it, and once sold, what did
  // A closed call reads the same whatever closed it (the owner, 9 October: "if both the trades are closed then why the
  // message format is different. it should be same"): Call Target "sold at <time>", Premium "paid -> at sale",
  // Candle status "SOLD" with the reason under it, green for a gain and red for a loss: the premium's, the way the Premium
  // column reads it, when the option is known (the owner, 12 October: NIFTY 50's 9:40 Buy CE read green for +1.13 index
  // points while its premium went 113.15 -> 90.85), the index points otherwise
  const gainOf = (t, r) => r && r.premium_paid > 0 && r.premium_now != null ? r.premium_now - r.premium_paid : t.points;
  const closedTone = (t, r) => { const g = gainOf(t, r); return g > 0 ? "up" : g < 0 ? "down" : ""; };
  // Every reason that names a line gives its percentage too, the way the Signal column does, and a sale by the premium rule
  // gives the real fall (the owner, 12 October: "here in the box, also mention the percentage"; "35% is just an example").
  // A sale at a candle's close names that candle and its close (the owner, 13 October: NIFTY 50's 10:30 Buy PE read "a candle
  // closed above 61.8%", taken for the 10:30 candle, which closed below it; the candle was the 10:45 one, closed at 22,524.25)
  function soldReason(t, r) {
    const way = t.side === "PE" ? "above" : "below", line = `${pctOf(t)} · ${fmt.format(t.level)}`, target = targetPct(t);
    const closed = `the ${callTime(t.exitTime)} candle closed at ${fmt.format(t.exit)},`;
    return t.how === "target" ? (target ? `target hit at ${target} · ${fmt.format(t.target)}` : "target hit") : t.how === "day end" ? "day end"
      : t.how === "sold" ? (r ? `premium dropped ${-premiumChange(r)}%` : "premium fell 35% of what was paid")
      : t.how === "back" ? `${closed} ${way} ${line}` : t.how === "retouch" ? `price came back to ${fmt.format(t.c1Open)}, ${way} ${pctOf(t)}`
      : t.how === "trail" ? `${closed} ${way} ${stopName(t)}`
      : t.how === "candle" ? `${closed} back across ${line}` : t.how;
  }
  // The target's line: a target follows the lines ("today so far" levels move with each new high or low), so it is looked up
  // on the lines as they stood at the candle that sold the call; null when no line sits at that price
  function targetPct(t) {
    const bars = sessionBars(), i = bars.findIndex(b => b.time === t.exitTime);
    const lines = linesOfCandle(bars, i);
    const at = (lines || []).find(l => Math.abs(l.price - t.target) < 0.006);
    return at ? lineName(at.ratio) : null;
  }
  // Rule 2's stop by its line, the way the owner's specification writes it (section 7): "38.2% (24,380.00)"
  const stopName = (t) => `${lineName(t.trail.stopRatio)} (${fmt.format(t.trail.stop)})`;
  // A held break's target moves on with the price (the owner, 13 October: NIFTY 50's 9:30 Buy CE stood at 22,570 with its
  // target still on 61.8%, 22,518.68: "candle is rising, it is in up direction, why still taget at lower level ?"). Once a
  // candle has closed beyond a further line (Rule 2: t.trail.line, the line the stop moved for), the target shown is the next
  // line beyond that one, on the lines as they stood at the candle that sold the call (an open call: as the chart draws them
  // now); with no line beyond it, that line itself. Only the table moves it: a held break is not sold at its target, and the
  // rule, the server and the CSV keep the target the call was given
  function movedTarget(t) {
    if (!t.hold || !t.trail || t.trail.line == null) return null;
    const bars = sessionBars(), i = t.exit != null ? bars.findIndex(b => b.time === t.exitTime) : -1;
    const lines = linesOfCandle(bars, i), d = t.side === "CE" ? 1 : -1;
    const ahead = (lines || []).filter(l => d * (l.price - t.trail.line) > 0.005);
    const next = ahead.length ? ahead.reduce((a, b) => (d * (b.price - a.price) < 0 ? b : a)) : null;
    return { passed: t.trail.ratio, next, price: next ? next.price : t.trail.line, lines: lines || [] };
  }
  const pctText = (ratio) => lineName(ratio);
  // A call past the day's high or low (idea 24, 13 October) has no line beyond it to aim at until the lines move past its
  // entry: its target reads "no line above" (a Buy PE: "no line below") instead of a price
  const noLine = (t) => `no line ${t.side === "PE" ? "below" : "above"}`;
  const targetPrice = (v, t) => v == null ? noLine(t) : fmt.format(v);
  const newEdge = (t) => `new ${t.side === "PE" ? "low" : "high"} of the day`;
  function targetCell(t, r) {
    const moved = movedTarget(t), shown = moved ? moved.price : t.target;
    if (t.exit != null)
      return `<td class="target">${targetPrice(shown, t)}<small class="${closedTone(t, r)}">sold at ${callTime(t.exitTime)}</small></td>`;
    if (t.hold && t.trail) {  // Rule 2: the stop has moved to a further line; the note always names the stop's line (section 7)
      // the line passed was the day's high (low) and the price has gone on past it: no line beyond, the target shown is the day's
      // high (low) itself (13 October, idea 24: it read "target 0.0% passed, next target 0.0%"); "Today so far" lines only, the
      // previous day's top line is not today's high
      // and on the previous close's lines once they are drawn again on the day's range (7 lines): their outer line is the day's high
      // (low) too (the review of 15 October: "target +100.0% passed, next target +100.0%")
      const edge = (judgedToday() || (state.move === "close" && moved.lines.length === 7)) && (!moved.next || moved.next.ratio === moved.passed);
      const said = edge ? `day's ${t.side === "PE" ? "low" : "high"} · ${noLine(t)}`
        : `target ${pctText(moved.passed)} passed, ${moved.next ? `next target ${pctText(moved.next.ratio)}` : "no line beyond it"}`;
      return `<td class="target">${fmt.format(shown)}<small>${said} · sell if a candle closes ${t.side === "PE" ? "above" : "below"} ${stopName(t)}</small></td>`;
    }
    if (t.hold) {
      const way = t.side === "PE" ? "above" : "below", line = fmt.format(t.level);
      const past = t.entry != null && t.target != null && sessionBars().some(b => b.time >= t.entryTime && (t.exitTime == null || b.time <= t.exitTime) && (t.side === "CE" ? b.high >= t.target : b.low <= t.target));
      const note = t.how === "back" ? `sold: a candle closed ${way} ${line}` : t.how === "retouch" ? `sold: price came back to ${fmt.format(t.c1Open)}`
        : t.how === "day end" ? "sold at day end" : t.entry == null ? (t.target == null ? newEdge(t) : "")
        : `${t.target == null ? `${newEdge(t)} · hold` : past ? "target passed, continue" : "hold"} · sell if a candle closes ${way} ${line}`;
      return `<td class="target">${targetPrice(t.target, t)}${note ? `<small${t.exit != null && t.points > 0 ? ' class="up"' : ""}>${note}</small>` : ""}</td>`;
    }
    // an open bounce call says what to do and what sells it, as an open break call does (the owner, 12 October: on NIFTY 50
    // the 11:05 and 11:15 Buy CE bounce calls showed only their target, a blank row beside the 9:30 PE's "continue" note)
    const open = t.entry == null ? "" : `${t.aimed ? "next line · " : ""}hold · sell at the target or at the day end`;
    const note = t.how === "target" ? `<small class="up">target hit, sold</small>` : t.how === "day end" ? "<small>sold at day end</small>"
      : t.how === "candle" ? "<small>sold on SELL</small>" : open ? `<small>${open}</small>` : "";
    return `<td class="target">${fmt.format(t.target)}${note}</td>`;
  }

  // The candle verdict (owner's ask, 7 October; Rules.readOf, LOGIC.md layer 3): CARRY or EXIT with its reason. On the
  // table as "Candle status" (off it on 7 October evening, back on 8 October as the owner's exit signal); the page also
  // sends it with every call it records (the server's watcher does the same with rule.read_of), and the CSV download
  // carries it. It changes nothing about a call
  function candleRead(t) {
    const rd = Rules.readOf({ trade: t, bars: sessionBars(), seconds: SECONDS[state.interval], now: serverNow() });
    return rd ? { say: rd.word, exitAt: rd.exitAt, why: rd.why } : null;
  }
  // "Candle status": one word for every open call, HOLD or SELL (the owner's plain words, 8 October night; CARRY and EXIT
  // until then), with the reason in words under it; on a finished call, what the word was and when, so the owner can judge
  // it against the result
  function candleCell(t, r) {
    if (t.exit != null)  // closed: the sale is the last word on the call, the same way for every reason
      return `<td class="cand ${{ up: "carry", down: "exit" }[closedTone(t, r)] || ""}">SOLD<small>${soldReason(t, r)}</small></td>`;
    const rd = candleRead(t);
    if (!rd) return `<td class="cand">—</td>`;
    if (t.exit == null && rd.say === "exit" && !t.hold) {  // a bounce call: the candles' warning is not a sale (the owner, 9 October)
      const w = watchNow(t);
      return w.watch ? `<td class="cand watch">WATCH<small>${rd.why}</small></td>` : `<td class="cand carry">HOLD<small>${w.why}</small></td>`;
    }
    if (t.exit == null) return `<td class="cand ${rd.say}">${rd.say === "exit" ? "SELL" : "HOLD"}<small>${rd.why}</small></td>`;
    if (rd.exitAt == null) return `<td class="cand carry">HOLD the whole time<small>${rd.why}</small></td>`;
    return `<td class="cand exit">said SELL at ${callTime(rd.exitAt)}<small>${rd.why}</small></td>`;
  }
  // WATCH, not SELL, on an open bounce call (the owner's choice of 9 October, "2"): a bounce call is sold only at its
  // target, at the day end or by the 35% premium rule, so the candles' "sell" is a warning. It shows WATCH while the last
  // closed candle is still on the wrong side of the call's line by a quarter of the gap to the target or more (the same
  // measure as Rules.readOf), and goes back to HOLD when the price returns to the right side
  function watchNow(t) {
    const now = serverNow(), gap = Math.abs(t.target - t.level);
    const done = sessionBars().filter(b => b.time > t.signalTime && endOf(b) <= now);
    const last = done[done.length - 1];
    if (!last || !gap) return { watch: true };
    const went = t.side === "CE" ? t.level - last.close : last.close - t.level;  // back across the line, in points
    const pct = lineName(t.ratio);
    if (went >= 0.25 * gap) return { watch: true };
    return { watch: false, why: went <= 0 ? `price is back ${t.side === "CE" ? "above" : "below"} the ${pct} level` : `price is near the ${pct} level again` };
  }

  // The carry read (idea P5's question, 7 October evening; Rules.carryOf): at the candle that reached the target, did the
  // close go a quarter into the next gap, and was the level beyond reached later. For the CSV and the research engine only
  function carryRead(t) {
    const c = Rules.carryOf({ trade: t, bars: sessionBars(), seconds: SECONDS[state.interval], now: serverNow() });
    return c ? { deep: c.deep ? "yes" : "no", beyond: c.beyond, reached: c.reached ? "yes" : "no" } : null;
  }

  // paid → now while the call is open; paid → at exit once it has ended, with the Sell mark (LOGIC.md, "Exit by premium"):
  // SELL NOW while the premium sits below the mark, "sold at" once the server has marked it sold. A finished call with no
  // record was never seen open by a page (no page open at its entry, so no premium could be recorded then): the cell says so.
  // A record made late (the server restarting, the rule changed during the session) holds the price when it was made; the
  // cell no longer says so (the owner, 9 October: "remove this message from every row and from future calls, not required").
  // A finished call says in words what its premium did, with its real fall or rise, and a sale by the premium rule says why
  // (the owner, 12 October: "mention that price dropped to 35% hence sold"; "35% is just an example")
  const premiumChange = (r) => Math.round((r.premium_now - r.premium_paid) / r.premium_paid * 100);
  function premiumCell(t, r) {
    if (!r) return `<td class="opt prem">${t.exit != null ? "<small>not seen at entry</small>" : "—"}</td>`;
    const change = premiumChange(r);
    if (t.exit != null) {
      const words = change < 0 ? `price dropped ${-change}%` : change > 0 ? `price rose ${change}%` : "price did not change";
      return `<td class="opt prem">${fmt.format(r.premium_paid)} → ${fmt.format(r.premium_now)}<small class="said ${t.how === "sold" ? "sell" : change > 0 ? "up" : change < 0 ? "down" : ""}">${words}${t.how === "sold" ? ", hence sold" : " at sale"}</small></td>`;
    }
    const mark = r.premium_now <= r.sell_below ? ` <small class="sell">SELL NOW</small>` : "";
    return `<td class="opt prem">${fmt.format(r.premium_paid)} → ${fmt.format(r.premium_now)} <small class="${change > 0 ? "up" : change < 0 ? "down" : ""}">(${change >= 0 ? "+" : ""}${change}%)</small>${mark}</td>`;
  }

  // ---- the option behind each call: recorded by the server from Dhan (see LOGIC.md, "Exit by premium")
  // The page tells the server when a call enters (the contract and the premium paid are recorded then)
  // and when it ends; the server reads the premium now and keeps the Sell mark.
  let optionRecords = {};          // call key -> the server's record
  let lastRecordsJson = "";
  const registered = new Set(), endedSent = new Set();
  let syncing = false;
  const callKey = (t) => `${name}|${state.interval}|${t.signalTime}|${t.side}|${state.move}`;  // one candle, one call: the index, the time frame, the signal
  // candle, the side and the levels mode name it (the index too: NIFTY 50 and NIFTY BANK give calls at the same candle, and the server keeps every record in one place). The level's price is left out (7 October: "today so far" levels moved a few points across a restart, so the same
  // call got a second record); the levels mode is in, because the same candle and side under "previous day" and "today so far" levels are two
  // calls with two targets, and the record's end and Sell mark belong to one of them (the server's watcher works in its own setting)
  const expiryLabel = (d) => new Date(d + "T00:00:00Z").toLocaleDateString("en-IN", { day: "2-digit", month: "short", timeZone: "UTC" });

  // A premium from Dhan's feed (or the once-a-second poll) for one call: the row's premium cell changes in place, tick by
  // tick, the way the index price does (see main.py push_premium)
  function applyPremium(p) {
    const r = optionRecords[p.key];
    if (!r) return;  // the record arrives with the next refresh; the premium comes again with the next tick
    Object.assign(r, p);
    const tr = document.querySelector(`#paper tr[data-key="${CSS.escape(p.key)}"]`);
    const t = lastPaper.trades.find(x => callKey(x) === p.key);
    if (!tr || !t) return;
    const fresh = document.createElement("tr");
    fresh.innerHTML = premiumCell(t, r);
    tr.querySelector("td.prem").replaceWith(fresh.children[0]);
  }

  const DHAN_INDICES = ["NIFTY 50", "NIFTY BANK", "SENSEX"];  // the indices whose options the server follows (dhan.OPTION_INDICES; SENSEX's on the BSE since 8 October)
  // The Dhan line shows only when something needs the owner's attention; on a normal day it stays out of sight.
  function drawFeedNote() {
    const el = document.getElementById("feed-note");
    const d = state.dhan;
    el.hidden = true;
    if (!d || state.simulated || !DHAN_INDICES.includes(name)) return;
    const problems = [];
    if (!d.configured) {  // say so on every server, so a copy without the values is not mistaken for a broken one
      problems.push("Dhan: not set up on this server, so prices are from Yahoo, about 15 minutes delayed. "
        + "Add DHAN_CLIENT_ID and DHAN_ACCESS_TOKEN to Render's Environment page (or to .env on the laptop) and it switches to Dhan by itself.");
    } else {
      if (state.feed !== "dhan" && d.status) problems.push(d.status);
      if (state.feed === "dhan" && state.optionStatus && !/live from your account/.test(state.optionStatus)) problems.push(state.optionStatus);
      if (d.stream && !/connected/.test(d.stream)) problems.push(d.stream);
      if (d.poll && /^Poll: (off|failed)/.test(d.poll)) problems.push(d.poll);
    }
    if (!problems.length) return;
    el.hidden = false;
    el.textContent = problems.join(" ");
  }

  async function syncOptions(trades) {
    if (syncing || state.feed !== "dhan") return;
    syncing = true;
    try {
      const post = (path, body) => fetch(path, { method: "POST", headers: { "Content-Type": "application/json", ...withTab().headers }, body: JSON.stringify(body) });
      for (const t of trades) {
        const key = callKey(t);
        if (t.how === "open" && !registered.has(key) && !optionRecords[key]) {
          registered.add(key);
          const r = await post(`/options/${encodeURIComponent(name)}/calls`, { key, side: t.side, index_at_entry: t.entry });
          if (r.status === 401) { location.href = "/login"; return; }
          if (!r.ok) registered.delete(key);  // try again next time
        }
        if (t.exit != null && optionRecords[key] && !optionRecords[key].ended && !endedSent.has(key)) {
          endedSent.add(key);
          await post(`/options/${encodeURIComponent(name)}/calls/ended`, { key, how: t.how });
        }
      }
      const r = await fetch(`/options/${encodeURIComponent(name)}`, withTab());
      if (r.status === 401) { location.href = "/login"; return; }
      if (!r.ok) return;
      const data = await r.json();
      const json = JSON.stringify(data);
      state.optionStatus = data.status || "";
      optionRecords = Object.fromEntries((data.records || []).map(rec => [rec.key, rec]));
      if (json !== lastRecordsJson) { lastRecordsJson = json; drawLevels(); }  // the rows show the premiums
    } catch (err) {
      // the next refresh tries again
    } finally {
      syncing = false;
    }
  }

  function drawLevels() {
    const note = document.getElementById("levels-note");
    drawSessions();
    const m = theMove();
    let levels = m ? (m.close != null ? Rules.closeLevels(m.close) || [] : levelsOf(m)) : [];
    const fromClose = m && m.close != null ? closeLinesAt(sessionBars()) : null;
    if (fromClose) { const now = serverNow(); levels = fromClose(sessionBars().filter(b => endOf(b) <= now).length); }  // as redrawn by the candles closed so far
    drawRedraw(fromClose);
    lastLevels = { m, levels };  // before the chart refits, so the previous close's lines are all in view
    drawPaper(levels);
    const key = JSON.stringify([state.move, currentSession(), levels]);
    if (series && key !== lastLevelsKey) {
      priceLines.forEach(l => series.removePriceLine(l));
      priceLines = levels.map(l => series.createPriceLine({
        price: l.price, title: Rules.levelName(l.ratio, l.signed),
        // the previous close's lines (15 October): + lines green, - lines red, 0% thicker; the other levels as before
        color: cssVar(l.signed ? (l.ratio > 0 ? "--candle-up" : l.ratio < 0 ? "--candle-down" : "--ink-2") : l.ratio === 0 || Math.abs(l.ratio) === 1 ? "--ink-2" : "--muted"),
        lineWidth: l.signed && l.ratio === 0 ? 2 : 1,
        lineStyle: l.ratio === 0 || Math.abs(l.ratio) === 1 ? LightweightCharts.LineStyle.Solid : LightweightCharts.LineStyle.Dashed,
        axisLabelVisible: !l.signed,  // the previous close's lines carry their names on the lines themselves (placeTags): the scale's own labels stack and slide off their lines
      }));
      lastLevelsKey = key;
      if (state.move === "close") refit();  // the view takes in all the lines
    }
    note.dataset.count = priceLines.length;  // lines actually on the chart
    queueTags();
    lastLevels = { m, levels };
    refreshLevelsNote();
  }

  function refreshLevelsNote() {
    const note = document.getElementById("levels-note");
    const { m, levels } = lastLevels;
    if (state.move === "off") { note.textContent = ""; return; }
    if (!m) {
      note.textContent = state.move === "today" ? "No levels yet: the market has not traded today." : "No levels: nothing to measure yet.";
      return;
    }
    const last = state.summary.last;
    if (!levels.length) { note.textContent = "No levels: nothing to measure yet."; return; }
    const nearest = levels.reduce((a, b) => Math.abs(b.price - last) < Math.abs(a.price - last) ? b : a);
    const gap = Math.round((last - nearest.price) * 100) / 100;
    const redrawn = m.close != null && levels.length === 7;  // the previous close's lines, drawn again on the day's range after a close beyond +100% or -100%
    const up = redrawn && levels[levels.length - 1].ratio === 1, day = isToday(currentSession()) ? "today's" : "the day's";  // a past session picked: that day's low and high
    const head = redrawn
      ? `Redrawn ${up ? "upward after a candle closed above the highest" : "downward after a candle closed below the lowest"} line: 0% at ${day} ${up ? "low" : "high"} ${fmt.format(up ? levels[0].price : levels[levels.length - 1].price)}, ${up ? "+" : "-"}100% at ${day} ${up ? "high" : "low"} ${fmt.format(up ? levels[levels.length - 1].price : levels[0].price)}. `
      : m.close != null
      ? `${m.what[0].toUpperCase() + m.what.slice(1)}: 0% at ${fmt.format(m.close)}, 100% is ${Rules.CLOSE_STEP * 100}% of it (${fmt.format(Math.round(m.close * Rules.CLOSE_STEP * 100) / 100)} points) above and below. `
      : `${m.what[0].toUpperCase() + m.what.slice(1)}: ${m.up ? "up" : "down"} move ${fmt.format(m.low)} → ${fmt.format(m.high)}. `;
    note.textContent = head + `Last ${fmt.format(last)} is ${fmt.format(Math.abs(gap))} ${gap >= 0 ? "above" : "below"} the ${lineName(nearest.ratio)} level (${fmt.format(nearest.price)}).`;
  }

  function showLegend(bar) {
    const el = document.getElementById("legend");
    if (!bar) { el.textContent = ""; return; }
    const when = istTime(bar.time, withDate());
    el.textContent = state.kind === "candles"
      ? `${when}   O ${fmt.format(bar.open)}   H ${fmt.format(bar.high)}   L ${fmt.format(bar.low)}   C ${fmt.format(bar.close)}`
      : `${when}   ${fmt.format(bar.close)}`;
  }

  chart.subscribeCrosshairMove(param => {
    if (!param.time) { showLegend(bars[bars.length - 1]); return; }
    const bar = bars.find(b => b.time + IST_OFFSET === param.time);
    if (bar) showLegend(bar);
  });

  // ---- click pop-up: open and close of the bar you clicked
  const popup = document.getElementById("popup");
  let popupTime = null;

  function fillPopup(bar) {
    const move = Math.round((bar.close - bar.open) * 100) / 100;
    const dir = move > 0 ? "up" : move < 0 ? "down" : "flat";
    const glyph = { up: "▲", down: "▼", flat: "—" }[dir];
    popup.innerHTML = `
      <span class="x" title="Close">&times;</span>
      <div class="t">${istTime(bar.time, withDate())} IST · ${INTERVAL_NAMES[state.interval]} bar</div>
      <div class="row"><span>Open</span><b>${fmt.format(bar.open)}</b></div>
      <div class="row"><span>High</span><b>${fmt.format(bar.high)}</b></div>
      <div class="row"><span>Low</span><b>${fmt.format(bar.low)}</b></div>
      <div class="row"><span>Close</span><b>${fmt.format(bar.close)}</b></div>
      <div class="row ${dir}"><span>Open → Close</span><b>${glyph} ${signed.format(move)}</b></div>`;
  }

  function showPopup(bar, point) {
    popupTime = bar.time;
    fillPopup(bar);
    popup.className = "on";
    const area = popup.parentElement.getBoundingClientRect();
    let left = point.x + 14, top = point.y - 12;
    if (left + popup.offsetWidth > area.width - 6) left = point.x - popup.offsetWidth - 14;
    if (top + popup.offsetHeight > area.height - 6) top = area.height - popup.offsetHeight - 6;
    popup.style.left = Math.max(4, left) + "px";
    popup.style.top = Math.max(4, top) + "px";
  }

  function hidePopup() {
    popupTime = null;
    popup.className = "";
  }

  function refreshPopup() {
    if (popupTime === null) return;
    const bar = bars.find(b => b.time === popupTime);
    if (bar) fillPopup(bar); else hidePopup();
  }

  chart.subscribeClick(param => {
    if (!param.time || !param.point) { hidePopup(); return; }
    const bar = bars.find(b => b.time + IST_OFFSET === param.time);
    if (bar) showPopup(bar, param.point); else hidePopup();
  });
  popup.addEventListener("click", e => { if (e.target.classList.contains("x")) hidePopup(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") hidePopup(); });

  // ---- data
  // The price now (the owner, 15 October: "The current running index level line shoukd have light blue box and blue font and
  // plane light blue line"): a plain light blue line at the last price, its figure in blue in a light blue box on the price scale.
  // The chart's own last-price line chooses its own text colour, so this one is a price line of ours (nowLine), moved with every price
  function markNow() {
    if (!series) return;
    if (!bars.length) { if (nowLine) { series.removePriceLine(nowLine); nowLine = null; } return; }
    const price = bars[bars.length - 1].close;
    if (nowLine) { nowLine.applyOptions({ price }); return; }
    nowLine = series.createPriceLine({ price, color: cssVar("--now-line"), lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Solid, axisLabelVisible: true,
                                       axisLabelColor: cssVar("--now-box"), axisLabelTextColor: cssVar("--now-text"), title: "" });
  }
  function setBars(list) {
    const empty = document.getElementById("empty");
    if (!list.length) {  // a holiday, a weekend, or before the open: nothing to draw yet
      bars = [];
      if (series) series.setData([]);
      markNow();
      state.lastTimes = "";
      showLegend(null);
      hidePopup();
      empty.textContent = "No candles to show yet: none came for the last days.";
      empty.hidden = false;
      return;
    }
    empty.hidden = true;
    const times = list.map(b => b.time).join(",");
    const sameShape = times === state.lastTimes && bars.length === list.length;
    bars = list;
    if (!series) { makeSeries(); }
    else if (sameShape) { series.update(toPoints([list[list.length - 1]])[0]); }
    else { series.setData(toPoints(list)); if (state.lastTimes === "") chart.timeScale().fitContent(); }
    markNow();
    state.lastTimes = times;
    showLegend(list[list.length - 1]);
    refreshPopup();
  }

  function renderHero(s) {
    const dir = s.change > 0 ? "up" : s.change < 0 ? "down" : "flat";
    const glyph = { up: "▲", down: "▼", flat: "—" }[dir];
    document.getElementById("last").textContent = money(s.last);
    const delta = document.getElementById("delta");
    delta.className = dir;
    delta.textContent = `${glyph} ${signed.format(s.change)} (${signed.format(s.change_percent)}%)`;
    // the server says whether the market trades now (summary.open; a tick means it does): the price's time
    // then, else "closed" and when the last price is from, so a quiet page never shows the clock
    const asof = document.getElementById("asof"), at = new Date(s.time);
    if (s.open) {
      asof.className = "";
      asof.textContent = "as of " + at.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", second: "2-digit", timeZone: "Asia/Kolkata" }) + " IST";
    } else {
      const day = dateKey(at.getTime() / 1000);
      asof.className = "closed";
      asof.textContent = `Market closed · last price from ${isToday(day) ? "today" : dayLabel(day)} at ${istTime(at.getTime() / 1000, false)} IST`;
    }
  }

  // ---- live ticks from Dhan: the price and the candle forming now move every second (see main.py tick_forever)
  function applyTick(t) {
    if (t.name !== name || state.feed !== "dhan" || !state.summary) return;
    lastSeen = lastTickAt = Date.now();
    if (t.time) learnClock(t.time);
    const s = state.summary;
    s.last = t.last; s.time = t.time; s.open = true;
    if (s.previous_close) {
      s.change = Math.round((t.last - s.previous_close) * 100) / 100;
      s.change_percent = Math.round(s.change / s.previous_close * 10000) / 100;
    }
    if (s.today_high != null && (t.last > s.today_high || t.last < s.today_low)) {  // today's figures follow the ticks too
      s.today_high = Math.max(s.today_high, t.last); s.today_low = Math.min(s.today_low, t.last);
      renderSummary(s);
    } else renderHero(s);
    document.getElementById("status").textContent = (t.via === "stream" ? "Live · stream " : "Live · tick ") + clock();
    drawLiveNote();
    if (state.dhan) {  // the stream's state, from the ticks themselves; the server's fuller reason comes with the next refresh
      if (t.via === "stream") state.dhan.stream = "Stream: tick-by-tick from Dhan, connected.";
      else if ((state.dhan.stream || "").startsWith("Stream: tick-by-tick")) state.dhan.stream = "Stream: quiet, prices once a second meanwhile.";
      drawFeedNote();
    }
    const bar = t.bars && t.bars[state.interval];
    if (!bar || !series || !bars.length) { refreshLevelsNote(); return; }
    const last = bars[bars.length - 1];
    if (last.time === bar.time) {  // the candle forming now: Dhan's open stays, the tick moves the rest
      const before = state.move === "today" || state.move === "shown" ? theMove() : null;  // levels built from the live candles
      last.high = Math.max(last.high, bar.high); last.low = Math.min(last.low, bar.low); last.close = bar.close;
      series.update(toPoints([last])[0]);
      markNow();
      const after = before && theMove();
      if (after && (after.high !== before.high || after.low !== before.low || after.up !== before.up)) drawLevels();  // a new high or low, or the move turned: the lines move with the tick (owner's choice, 6 October)
    } else if (bar.time > last.time && bar.time - last.time <= SECONDS[state.interval] * 3) {  // a new candle began
      bars.push({ ...bar });
      state.candles.push(bars[bars.length - 1]);  // the chart's list is a copy of the session's
      state.lastTimes = bars.map(b => b.time).join(",");
      series.update(toPoints([bar])[0]);
      markNow();
      clearTimeout(state.timer);
      state.timer = setTimeout(load, 1500);  // the candle before it just closed: fetch and judge it
    } else {
      refreshLevelsNote();
      return;  // this page is on another day or far behind: the next load sorts the candles out
    }
    showLegend(bars[bars.length - 1]);
    refreshPopup();
    refreshLevelsNote();
  }

  function renderSummary(s) {
    renderHero(s);
    const today = dateKey(serverNow());
    const prev = [...state.days].reverse().find(d => d.date < today);  // the last session before today, as the tiles are
    const group = (title, figs) => {
      const el = document.createElement("div");
      el.className = "stat";
      el.innerHTML = `<div class="gk">${title}</div><div class="figs">`
        + figs.map(([k, v]) => `<div class="fig"><div class="k">${k}</div><div class="v">${money(v)}</div></div>`).join("") + "</div>";
      return el;
    };
    document.getElementById("summary").replaceChildren(
      group("Previous session" + (prev ? " · " + dayLabel(prev.date) : ""),
            [["Open", s.previous_open], ["High", s.previous_high], ["Low", s.previous_low], ["Close", s.previous_close]]),
      group(s.today_open == null ? "Today · not traded yet" : "Today · " + dayLabel(today),
            [["Open", s.today_open], ["High", s.today_high], ["Low", s.today_low]]),
      group("52 weeks", [["High", s.week52_high], ["Low", s.week52_low]]),
    );
  }

  // The login's "tab" note: kept in this tab only, so a freshly opened tab has none and is asked for the password.
  // A tile hands it over in the link's #t=...; take it, keep it, and drop it from the address bar.
  let TAB = "";
  try { TAB = sessionStorage.getItem("tab") || ""; } catch (e) {}
  const handed = new URLSearchParams(location.hash.slice(1)).get("t");
  if (handed) {
    TAB = handed;
    try { sessionStorage.setItem("tab", TAB); } catch (e) {}
    history.replaceState(null, "", location.pathname);
  }
  // This page's id: kept in memory only, so the page can come back after its connection drops.
  let PAGE = "";
  const BEAT_MS = 15000;
  const withTab = () => ({ headers: { "X-Tab": TAB, "X-Page": PAGE } });
  const wsUrl = () => (location.protocol === "https:" ? "wss" : "ws") + "://" + location.host
    + "/ws?tab=" + encodeURIComponent(TAB) + "&page=" + encodeURIComponent(PAGE) + "&live=" + encodeURIComponent(name);

  // A merge restarts the server with new page code, and an open page keeps the old code until it is reloaded (7 October:
  // the tiles stood still after a merge on a tab that had not been reloaded). So every answer from the server carries the
  // commit it runs, and a page that sees a different one from the one it started with reloads itself, at most once a
  // minute (during Render's switchover the old and the new server can both answer for a moment)
  let loadedCommit = null;
  function newDeploy(commit) {
    if (!commit) return false;
    if (loadedCommit === null) { loadedCommit = commit; return false; }
    if (commit === loadedCommit) return false;
    let last = 0; try { last = parseInt(sessionStorage.getItem("reloaded-at") || "0", 10); } catch (e) {}
    if (Date.now() - last < 60000) return false;
    try { sessionStorage.setItem("reloaded-at", String(Date.now())); } catch (e) {}
    location.reload();
    return true;
  }

  // "Still here": keeps the login alive even while /ws is down.
  async function beat() {
    try {
      const r = await fetch("/alive", { method: "POST", ...withTab() });
      if (r.status === 401) { location.href = "/login"; return; }
      if (r.ok) { const data = await r.json(); if (newDeploy(data.commit)) return; if (data.page) PAGE = data.page; }
    } catch (e) {}
  }

  let lastSeen = Date.now();  // the last tick or refresh that reached the page
  let lastTickAt = 0;         // the last live price that reached the page (a refresh is not one)
  let lastKick = Date.now();  // the last time the page reconnected on its own
  let loadAbort = null;        // the refresh in flight: the newest wins, a hung one is dropped after 20 s
  async function load() {
    const status = document.getElementById("status");
    if (loadAbort) loadAbort.abort();
    const controller = loadAbort = new AbortController();
    const deadline = setTimeout(() => controller.abort(), 20000);
    try {
      const response = await fetch(`/indices/${encodeURIComponent(name)}/detail?range=${rangeFor()}&interval=${state.interval}`, { ...withTab(), signal: controller.signal });
      if (response.status === 401) { location.href = "/login"; return; }
      if (!response.ok) throw new Error("HTTP " + response.status);
      const data = await response.json();
      document.getElementById("logout").hidden = !data.auth_enabled;
      state.summary = data.summary;
      state.days = data.days || [];
      state.feed = data.source || "";
      state.dhan = data.dhan || null;
      state.simulated = !!data.simulated;
      renderSummary(data.summary);
      lastSeen = Date.now();
      if (data.now) learnClock(data.now);
      if (data.range !== rangeFor() || data.interval !== state.interval) return;  // an older request finishing late
      state.candles = data.candles;
      setBars(shownBars());
      drawLevels();
      state.pollMs = Math.max(1000, data.poll_seconds * 1000);
      status.className = "";
      status.textContent = "Live · updated " + clock();
      drawLiveNote();
      document.getElementById("mode").className = data.simulated ? "on" : "";
      document.getElementById("footer").textContent = data.simulated
        ? `Simulated prices, ${INTERVAL_NAMES[data.interval]} bars built from the simulator's ticks. Not real market data.`
        : data.source === "dhan"
        ? `Data from Dhan, your own account, in real time, ${INTERVAL_NAMES[data.interval]} bars: the price and the candle forming now tick every second, the rest refreshes every ${data.poll_seconds} s.`
        : `Data from Yahoo Finance, about 15 minutes delayed, ${INTERVAL_NAMES[data.interval]} bars. Refreshes every ${data.poll_seconds} s.`;
    } catch (err) {
      if (controller !== loadAbort) return;  // a newer refresh took over; it carries on from here
      status.className = "error";
      status.textContent = "Couldn't load (" + (err.name === "AbortError" ? "no answer in 20 s" : err.message) + "). Retrying…";
    } finally {
      clearTimeout(deadline);
    }
    clearTimeout(state.timer);
    state.timer = setTimeout(load, state.pollMs);
  }

  // Holds a /ws connection while this page is open, and reports in every BEAT_MS: the login
  // lives while some page does either.
  let liveWs = null;
  function keepAlive() {
    const ws = liveWs = new WebSocket(wsUrl());
    ws.onmessage = event => { const data = JSON.parse(event.data); if (newDeploy(data.commit)) return; if (data.page) PAGE = data.page; if (data.tick) applyTick(data.tick); if (data.premium) applyPremium(data.premium); };
    ws.onclose = () => {
      beat();  // says "still here" at once, and finds out if the login is over
      setTimeout(keepAlive, 3000);
    };
    ws.onerror = () => ws.close();
  }
  beat().then(keepAlive);  // report in first (a new page gets its id), then open the stream
  setInterval(beat, BEAT_MS);
  // Silence is a dead connection, not a quiet market: ticks come every second in market hours and a refresh
  // every poll. After twice the poll (at least 45 s) with neither, the socket is closed, which makes it
  // reconnect, and a refresh is forced. A connection that dies without saying so (a laptop asleep, a phone
  // changing network) no longer leaves the page standing still.
  setInterval(() => {
    const limit = Math.max(45000, state.pollMs * 2);
    const since = ticksExpected() ? Math.max(lastTickAt, lastKick) : lastSeen;  // on Dhan in market hours a refresh does not count: the live price must move
    if (Date.now() - since < limit) return;
    lastSeen = lastKick = Date.now();
    if (liveWs && liveWs.readyState === WebSocket.OPEN) liveWs.close();
    load();
  }, 15000);

  // The line under the price: on Dhan in market hours the price comes every second. When none has come for
  // ten seconds, say so where the owner looks, with the server's own words for the stream and the poll
  // (the restart after a merge, a token refused, Dhan's rate limit, a connection down), until it moves again.
  const DHAN_TICK_HOURS = [9 * 3600, 15 * 3600 + 45 * 60];  // as main.py in_tick_hours: 09:00 to 15:45 IST, Monday to Friday
  function dhanExpected() {  // a Dhan index, Dhan set up on the server, in its tick hours: the price should move every second
    if (state.simulated || !DHAN_INDICES.includes(name) || !state.dhan || !state.dhan.configured) return false;
    const t = serverNow(), day = Math.floor((t + 19800) / 86400), weekday = (day + 4) % 7, secs = (t + 19800) % 86400;  // 1970-01-01 was a Thursday
    return weekday >= 1 && weekday <= 5 && secs >= DHAN_TICK_HOURS[0] && secs < DHAN_TICK_HOURS[1];
  }
  const ticksExpected = () => dhanExpected() && state.feed === "dhan";
  function drawLiveNote() {
    const el = document.getElementById("live-note");
    if (!dhanExpected()) { el.hidden = true; return; }
    const d = state.dhan || {};
    if (state.feed !== "dhan") {  // the refresh came from Yahoo: delayed prices, and the live ticks are not applied
      el.hidden = false;
      el.textContent = `Not on Dhan now, so this is Yahoo's price, about 15 minutes behind. ${d.status || ""}`;
      return;
    }
    const quiet = (Date.now() - Math.max(lastTickAt, pageOpened)) / 1000;
    if (quiet < 10) { el.hidden = true; return; }
    const why = [];
    if (!liveWs || liveWs.readyState !== WebSocket.OPEN) why.push("this page's connection to the server is down, reconnecting.");
    if (d.status && !d.active) why.push(d.status);
    if (d.stream && !/connected/.test(d.stream)) why.push(d.stream);
    else if (d.stream) why.push("the stream is connected but silent");
    if (d.poll && !/once a second from Dhan/.test(d.poll)) why.push(d.poll);
    if (!d.stream && !d.poll) why.push("the server has not started its live feed (it may have just restarted)");
    el.hidden = false;
    el.textContent = `No live price for ${Math.round(quiet)} s. ${why.join(" ")} The refresh every ${Math.round(state.pollMs / 1000)} s still runs.`;
  }
  const pageOpened = Date.now();
  setInterval(drawLiveNote, 1000);

  // ---- controls
  document.getElementById("logout").addEventListener("click", () => {
    fetch("/logout", { method: "POST" }).finally(() => location.href = "/login");
  });
  document.getElementById("kind").addEventListener("click", e => {
    const kind = e.target.dataset.kind;
    if (!kind || kind === state.kind) return;
    state.kind = kind;
    [...e.currentTarget.children].forEach(b => b.classList.toggle("on", b.dataset.kind === kind));
    makeSeries();
  });
  document.getElementById("move").addEventListener("change", e => {
    state.period = e.target.value; state.move = PERIODS[state.period].move;
    try { localStorage.setItem("period", state.period); } catch (err) {}
    state.lastTimes = "";
    setBars(shownBars());
    drawLevels();
  });
  document.getElementById("session").addEventListener("change", e => {
    const list = sessions(), picked = e.target.value;
    state.session = picked === list[list.length - 1] ? null : picked;  // the latest day is followed, so "today" is still today tomorrow
    state.lastTimes = "";
    setBars(shownBars());
    drawLevels();
  });
  document.getElementById("signal").addEventListener("click", e => {
    const signal = e.target.dataset.signal;
    if (!signal || signal === state.signal) return;
    state.signal = signal;
    try { localStorage.setItem("signal", signal); } catch (err) {}
    [...e.currentTarget.children].forEach(b => b.classList.toggle("on", b.dataset.signal === signal));
    drawLevels();
  });
  document.getElementById("csv").addEventListener("click", () => {  // the list as a file, for the owner's own record
    const stamp = (t) => new Date(t * 1000).toLocaleString("sv-SE", { timeZone: "Asia/Kolkata", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
    const head = ["signal_time_ist", "level", "level_price", "signal", "option_bought", "index_at_entry", "target", "index_at_exit", "points", "ended_by",
                  "contract", "premium_paid", "premium_now", "sell_below", "sold_at_premium", "candles_say", "exit_said_at_ist", "candles_why",
                  "carry_deep", "beyond_level", "beyond_reached"];
    const rows = lastPaper.trades.map(t => {
      const r = optionRecords[callKey(t)], cr = candleRead(t), ca = carryRead(t);
      return [stamp(t.signalTime), lineName(t.ratio), t.level, t.kind, t.side, t.entry ?? "", t.target, t.exit ?? "", t.points ?? "", t.how,
              r ? `${Math.round(r.strike)} ${r.side} ${r.expiry}` : "", r ? r.premium_paid : "", r ? r.premium_now : "", r ? r.sell_below : "", r && r.sold ? r.sold.premium : "",
              cr ? cr.say : "", cr && cr.exitAt ? stamp(cr.exitAt) : "", cr ? `"${cr.why}"` : "",  // the reason holds a comma, so it is quoted
              ca ? ca.deep : "", ca ? ca.beyond : "", ca ? ca.reached : ""];
    });
    const blob = new Blob([[head, ...rows].map(r => r.join(",")).join("\n") + "\n"], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `paper-calls ${name} ${currentSession() || "today"} ${state.interval} ${state.signal}.csv`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  document.getElementById("interval").addEventListener("change", e => {
    const before = VIEWS[state.view];
    state.view = e.target.value;
    state.interval = VIEWS[state.view].interval;
    if (VIEWS[state.view].session) state.session = VIEWS[state.view].session;  // 1 week: the five days on one chart
    else if (before && before.session) state.session = null;  // back from it: the latest day again
    state.lastTimes = "";
    chart.applyOptions({ timeScale: { timeVisible: !longCandles() } });  // day and week candles: dates only
    load();
  });

  document.getElementById("move").value = state.period;
  document.getElementById("interval").value = state.view;
  [...document.getElementById("signal").children].forEach(b => b.classList.toggle("on", b.dataset.signal === state.signal));
  load();
</script>
</body>
</html>
