<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My-Trade</title>
<script src="/static/vendor/lightweight-charts.js"></script>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --border: rgba(11, 11, 11, 0.10);
    --grid: #e1e0d9;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --up: #006300;
    --down: #d03b3b;
    --candle-up: #0ca30c;
    --candle-down: #d03b3b;
    --line: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --border: rgba(255, 255, 255, 0.10);
      --grid: #2c2c2a;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --up: #0ca30c;
      --down: #e66767;
      --candle-up: #0ca30c;
      --candle-down: #e66767;
      --line: #3987e5;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --border: rgba(255, 255, 255, 0.10);
    --grid: #2c2c2a;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --up: #0ca30c;
    --down: #e66767;
    --candle-up: #0ca30c;
    --candle-down: #e66767;
    --line: #3987e5;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }

  .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
  .top a { color: var(--ink-2); font-size: 14px; text-decoration: none; }
  .top a:hover { color: var(--ink); }
  #status { color: var(--ink-2); font-size: 14px; margin-left: auto; }
  #logout {
    align-self: center; font: inherit; font-size: 14px; font-weight: 500;
    color: var(--ink); background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 14px; cursor: pointer;
  }
  #logout:hover { border-color: var(--ink-2); }
  #logout[hidden] { display: none; }
  #status.error { color: var(--down); }
  #mode { display: none; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: #fff; background: var(--down); border-radius: 4px; padding: 2px 8px; }
  #mode.on { display: inline-block; }

  .hero { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin: 12px 0 18px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0; }
  #last { font-size: 40px; font-weight: 600; line-height: 1.1; }
  #delta { font-size: 16px; font-weight: 500; }
  #delta.up { color: var(--up); }
  #delta.down { color: var(--down); }
  #delta.flat { color: var(--muted); }
  #asof { flex-basis: 100%; font-size: 12px; color: var(--muted); }

  .summary {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 8px;
    margin-bottom: 18px;
  }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .stat .v { font-size: 16px; font-weight: 600; margin-top: 2px; }

  .controls { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .controls .group { display: flex; flex-wrap: wrap; gap: 8px; }
  .controls.levels { justify-content: flex-start; align-items: center; }
  #levels-note { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  #session-row[hidden] { display: none; }
  #session-label { font-size: 13px; color: var(--muted); }
  #score-box, #paper-box { margin-top: 16px; }
  #score-box h2, #paper-box h2 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 6px; }
  #score-note, #paper-note { font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
  #score, #paper { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  #score th, #score td, #paper th, #paper td { text-align: right; padding: 5px 12px 5px 0; border-bottom: 1px solid var(--border); white-space: nowrap; }
  #score th:first-child, #score td:first-child, #paper th:first-child, #paper td:first-child { text-align: left; }
  #score th, #paper th { font-weight: 500; color: var(--muted); font-size: 12px; }
  #paper td.up { color: var(--up); }
  #paper td.down { color: var(--down); }
  #paper td.sell { color: #fff; background: var(--down); font-weight: 600; text-align: center; padding-left: 10px; }
  #paper td.hold { color: var(--muted); }
  #paper.no-options .opt { display: none; }
  #feed-note { font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
  #paper[hidden] { display: none; }
  #paper-box .controls { margin: 0 0 8px; }
  #paper-score { font-size: 13px; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
  .scroll { overflow-x: auto; }
  #csv {
    font: inherit; font-size: 13px; padding: 6px 12px; cursor: pointer; margin-left: auto;
    color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  }
  #csv:hover { border-color: var(--ink-2); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button {
    font: inherit; font-size: 13px; padding: 6px 12px; border: 0; cursor: pointer;
    background: var(--surface); color: var(--ink-2);
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.on { background: var(--ink); color: var(--page); }

  .chart-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px; }
  #legend { font-size: 12px; color: var(--ink-2); padding: 4px 8px; min-height: 20px; font-variant-numeric: tabular-nums; }
  .legend-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .nav { display: inline-flex; gap: 4px; padding: 4px 8px; }
  .nav button {
    font: inherit; font-size: 13px; line-height: 1; min-width: 32px; height: 28px; padding: 0 8px; cursor: pointer;
    color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  }
  .nav button:hover { border-color: var(--ink-2); }
  .nav .gap { width: 6px; }
  .chart-area { position: relative; }
  #empty {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    padding: 24px; color: var(--ink-2); font-size: 14px; line-height: 1.5; pointer-events: none;
  }
  #empty[hidden] { display: none; }
  #chart { height: 420px; }
  #popup {
    display: none; position: absolute; z-index: 5; min-width: 170px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 12px; font-variant-numeric: tabular-nums;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
  }
  #popup.on { display: block; }
  #popup .t { color: var(--muted); margin-bottom: 4px; padding-right: 16px; }
  #popup .row { display: flex; justify-content: space-between; gap: 14px; line-height: 1.6; }
  #popup .row b { font-weight: 600; }
  #popup .row.up b { color: var(--up); }
  #popup .row.down b { color: var(--down); }
  #popup .x { position: absolute; top: 2px; right: 7px; cursor: pointer; color: var(--muted); font-size: 16px; line-height: 1; }
  #popup .x:hover { color: var(--ink); }
  @media (max-width: 600px) { #chart { height: 300px; } #last { font-size: 32px; } }

  footer { margin-top: 24px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="top">
    <a href="/">&larr; Dashboard</a>
    <span id="mode">SIMULATED DATA</span>
    <span id="status">Loading…</span>
    <button id="logout" type="button" hidden>Log out</button>
  </div>

  <div class="hero">
    <h1 id="name"></h1>
    <span id="last"></span>
    <span id="delta"></span>
    <span id="asof"></span>
  </div>

  <section class="summary" id="summary" aria-label="Summary"></section>

  <div class="controls">
    <div class="seg" id="kind">
      <button data-kind="line" class="on">Line</button>
      <button data-kind="candles">Candles</button>
    </div>
    <div class="group">
      <div class="seg" id="interval" aria-label="Candle size">
        <button data-interval="1m">1 min</button>
        <button data-interval="5m" class="on">5 min</button>
        <button data-interval="15m">15 min</button>
      </div>
      <div class="seg" id="range" aria-label="Range">
        <button data-range="today" class="on">Today</button>
        <button data-range="5d">5 days</button>
      </div>
    </div>
  </div>

  <div class="controls levels">
    <div class="seg" id="move" aria-label="Levels measured from">
      <button data-move="off">No levels</button>
      <button data-move="prev" class="on">Previous day</button>
      <button data-move="today">Today so far</button>
      <button data-move="shown">Bars shown</button>
    </div>
    <span id="levels-note"></span>
  </div>

  <div class="controls levels" id="session-row" hidden>
    <span id="session-label">Session</span>
    <div class="seg" id="session" aria-label="Session"></div>
  </div>

  <div class="chart-wrap">
    <div class="legend-row">
      <div id="legend"></div>
      <div class="nav" id="nav" aria-label="Zoom and move the chart">
        <button data-nav="out" title="Zoom out (more candles)">−</button>
        <button data-nav="in" title="Zoom in (fewer candles)">+</button>
        <span class="gap"></span>
        <button data-nav="left" title="Earlier">◀</button>
        <button data-nav="right" title="Later">▶</button>
        <button data-nav="up" title="Move the price view up">▲</button>
        <button data-nav="down" title="Move the price view down">▼</button>
        <span class="gap"></span>
        <button data-nav="fit" title="Show everything again">Fit</button>
      </div>
    </div>
    <div class="chart-area">
      <div id="empty" hidden></div>
      <div id="chart"></div>
      <div id="popup"></div>
    </div>
  </div>

  <section id="score-box" aria-label="How each level behaved" hidden>
    <h2>How each level behaved</h2>
    <div id="score-note"></div>
    <table id="score">
      <thead><tr><th>Level</th><th>Price</th><th>Held</th><th>Crossed</th><th>Held share</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="paper-box" aria-label="Paper calls" hidden>
    <h2>Paper calls</h2>
    <div class="controls levels">
      <div class="seg" id="signal" aria-label="Signal">
        <button data-signal="off">Off</button>
        <button data-signal="held" class="on">Held: trade the bounce</button>
        <button data-signal="crossed">Crossed: trade the break</button>
        <button data-signal="both">Both</button>
      </div>
      <button id="csv" type="button" title="Save the list below as a spreadsheet file">Download CSV</button>
    </div>
    <div id="paper-note"></div>
    <div id="feed-note" hidden></div>
    <div id="paper-score"></div>
    <div class="scroll">
      <table id="paper">
        <thead><tr><th>Signal</th><th>Level</th><th>Option</th><th>Index at entry</th><th>Target</th><th>Index at exit</th><th>Points</th><th>Ended by</th><th class="opt">Contract</th><th class="opt">Paid</th><th class="opt">Now</th><th class="opt">Sell</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <footer id="footer"></footer>
</main>

<script>
  const IST_OFFSET = 19800;  // the chart labels times as UTC; shifting by 5h30 makes the labels read as IST
  const name = decodeURIComponent(location.pathname.split("/").pop());
  const state = { kind: "line", range: "today", interval: "5m", pollMs: 60000, timer: null, lastTimes: "", move: "prev", summary: null, days: [], session: null,
                  feed: "", dhan: null, optionStatus: "" };
  try { state.move = localStorage.getItem("move") || state.move; } catch (e) {}
  state.signal = "held";  // layer 3's switch: off, held or crossed
  try { const s = localStorage.getItem("signal"); if (["off", "held", "crossed", "both"].includes(s)) state.signal = s; } catch (e) {}
  const INTERVAL_NAMES = { "1m": "1-minute", "5m": "5-minute", "15m": "15-minute" };

  const fmt = new Intl.NumberFormat("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const signed = new Intl.NumberFormat("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2, signDisplay: "always" });
  const clock = () => new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const istTime = (epoch, withDate) => new Date(epoch * 1000).toLocaleString("en-IN", {
    timeZone: "Asia/Kolkata", hour: "2-digit", minute: "2-digit", ...(withDate ? { day: "2-digit", month: "short" } : {}),
  });
  const cssVar = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const money = (v) => v == null ? "—" : fmt.format(v);

  document.title = name + " · My-Trade";
  document.getElementById("name").textContent = name;

  // ---- chart
  const chart = LightweightCharts.createChart(document.getElementById("chart"), {
    autoSize: true,
    layout: { background: { color: "transparent" }, textColor: cssVar("--muted"), fontFamily: "system-ui, sans-serif" },
    grid: { vertLines: { color: cssVar("--grid") }, horzLines: { color: cssVar("--grid") } },
    rightPriceScale: { borderColor: cssVar("--grid") },
    timeScale: { borderColor: cssVar("--grid"), timeVisible: true, secondsVisible: false },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    localization: { locale: "en-IN", priceFormatter: (p) => fmt.format(p) },
    // the wheel is handled below (price up/down, shift for time, ctrl or pinch for zoom);
    // dragging moves in time; on a phone a one-finger vertical swipe still scrolls the page
    handleScroll: { mouseWheel: false, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
    handleScale: { mouseWheel: false, pinch: true, axisPressedMouseMove: true },
  });

  // ---- zoom and move
  let priceShift = 0;   // how far the price view has been moved up (+) or down (-), in price units
  let priceHeight = 0;  // the height of the auto-fitted price view, learnt from the chart
  const autoscale = (original) => {  // the chart's own fit, shifted by the buttons
    const info = original();
    if (info && info.priceRange) {
      priceHeight = info.priceRange.maxValue - info.priceRange.minValue;
      if (priceShift) info.priceRange = { minValue: info.priceRange.minValue + priceShift, maxValue: info.priceRange.maxValue + priceShift };
    }
    return info;
  };
  const refit = () => { if (series) series.applyOptions({ autoscaleInfoProvider: (o) => autoscale(o) }); };  // a fresh function makes the chart refit
  function zoomBy(factor) {  // < 1 zooms in, > 1 zooms out, around the middle of the view
    const ts = chart.timeScale(), r = ts.getVisibleLogicalRange();
    if (!r) return;
    const w = r.to - r.from, mid = (r.from + r.to) / 2;
    ts.setVisibleLogicalRange({ from: mid - w * factor / 2, to: mid + w * factor / 2 });
  }
  function moveTime(share) {  // + later, - earlier, as a share of the view's width
    const ts = chart.timeScale(), r = ts.getVisibleLogicalRange();
    if (!r) return;
    const w = r.to - r.from;
    ts.setVisibleLogicalRange({ from: r.from + w * share, to: r.to + w * share });
  }
  function movePrice(share) {  // + up, - down, as a share of the view's height
    priceShift += priceHeight * share;
    refit();
  }
  function nav(action) {
    if (action === "fit") { priceShift = 0; chart.timeScale().fitContent(); refit(); }
    if (action === "in") zoomBy(0.7);
    if (action === "out") zoomBy(1.5);
    if (action === "left") moveTime(-0.25);
    if (action === "right") moveTime(0.25);
    if (action === "up") movePrice(0.2);
    if (action === "down") movePrice(-0.2);
  }
  document.getElementById("nav").addEventListener("click", e => { const a = e.target.dataset.nav; if (a) nav(a); });

  // The wheel and the touchpad drive the chart while the pointer is over it:
  //   wheel / two-finger swipe up-down      -> price view up or down
  //   shift + wheel / two-finger swipe left-right -> earlier or later
  //   ctrl + wheel / touchpad pinch         -> zoom (browsers send a pinch as ctrl + wheel)
  // Move the pointer off the chart to scroll the page.
  document.getElementById("chart").addEventListener("wheel", e => {
    e.preventDefault();
    const box = e.currentTarget.getBoundingClientRect();
    if (e.ctrlKey || e.metaKey) {
      zoomBy(Math.exp(Math.max(-100, Math.min(100, e.deltaY)) / 250));   // a wheel notch of 100 -> x1.5; a pinch step is gentler
    } else if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
      const px = e.shiftKey && !e.deltaX ? e.deltaY : e.deltaX;
      moveTime(px / box.width);                                            // one pixel of wheel = one pixel of chart
    } else {
      movePrice(-e.deltaY / box.height);                                   // wheel down shows lower prices
    }
  }, { passive: false });
  let series = null;
  let bars = [];

  function applyTheme() {
    chart.applyOptions({
      layout: { textColor: cssVar("--muted") },
      grid: { vertLines: { color: cssVar("--grid") }, horzLines: { color: cssVar("--grid") } },
      rightPriceScale: { borderColor: cssVar("--grid") },
      timeScale: { borderColor: cssVar("--grid") },
    });
    if (series) makeSeries();
  }
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);

  function toPoints(list) {
    return state.kind === "candles"
      ? list.map(b => ({ time: b.time + IST_OFFSET, open: b.open, high: b.high, low: b.low, close: b.close }))
      : list.map(b => ({ time: b.time + IST_OFFSET, value: b.close }));
  }

  function makeSeries() {
    hidePopup();
    if (series) chart.removeSeries(series);
    series = state.kind === "candles"
      ? chart.addSeries(LightweightCharts.CandlestickSeries, {
          upColor: cssVar("--candle-up"), downColor: cssVar("--candle-down"), borderVisible: false,
          wickUpColor: cssVar("--candle-up"), wickDownColor: cssVar("--candle-down"),
        })
      : chart.addSeries(LightweightCharts.LineSeries, { color: cssVar("--line"), lineWidth: 2, crosshairMarkerRadius: 4 });
    series.applyOptions({ autoscaleInfoProvider: (o) => autoscale(o) });
    series.setData(toPoints(bars));
    chart.timeScale().fitContent();
    showLegend(bars[bars.length - 1]);
    priceLines = []; lastLevelsKey = "";  // they went with the old series: draw them again
    drawLevels();
  }

  // ---- Layer 1 of the owner's logic: Fibonacci levels of one move (see LOGIC.md)
  // A move runs between a low and a high. The levels sit part-way back along it at
  // fixed fractions. For a move that went up (low first, then high) the fractions are
  // measured down from the high; for a move that went down, up from the low.
  const RATIOS = [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1];
  let priceLines = [];
  let lastLevelsKey = "";

  // ---- sessions: the trading days among the candles shown. The levels, the evidence table and
  // the calls are for one session at a time (the latest unless another is picked), and that
  // session's "previous day" is the trading day before it, not the day before today.
  const dateKey = (t) => new Date((t + IST_OFFSET) * 1000).toISOString().slice(0, 10);  // the IST date
  const sessions = () => [...new Set(bars.map(b => dateKey(b.time)))];
  const currentSession = () => { const list = sessions(); return list.includes(state.session) ? state.session : list[list.length - 1] || null; };
  const sessionBars = () => { const key = currentSession(); return key ? bars.filter(b => dateKey(b.time) === key) : []; };
  const isToday = (key) => key === dateKey(Date.now() / 1000);
  const dayLabel = (key) => new Date(key + "T00:00:00Z").toLocaleDateString("en-IN", { day: "2-digit", month: "short", timeZone: "UTC" });
  const sessionName = (key) => key ? (isToday(key) ? "today" : dayLabel(key)) : "today";
  const dayBefore = (key) => { const earlier = state.days.filter(d => d.date < key); return earlier[earlier.length - 1] || null; };
  function drawSessions() {
    const list = sessions(), key = currentSession();
    document.getElementById("session-row").hidden = list.length < 2;
    document.getElementById("session").replaceChildren(...list.map(d => {
      const b = document.createElement("button");
      b.dataset.session = d; b.textContent = dayLabel(d); b.classList.toggle("on", d === key);
      return b;
    }));
  }

  function theMove() {
    const s = state.summary;
    if (!s || state.move === "off") return null;
    const key = currentSession();
    if (state.move === "prev") {
      const day = key ? dayBefore(key) : null;
      if (day) return { high: day.high, low: day.low, up: day.close >= day.open, what: `previous day (${dayLabel(day.date)})` };
      if (key || s.previous_high == null || s.previous_low == null) return null;
      // no candles at all (a holiday, before the open): the last session's figures, as the tiles show them.
      // Only the day's four figures are known, so a day that closed above its open is taken as an up move
      return { high: s.previous_high, low: s.previous_low, up: s.previous_close >= s.previous_open, what: "previous day" };
    }
    if (state.move === "today") {
      const sb = sessionBars();
      if (!sb.length) return null;
      return { high: Math.max(...sb.map(b => b.high)), low: Math.min(...sb.map(b => b.low)), up: sb[sb.length - 1].close >= sb[0].open,
               what: isToday(key) ? "today so far" : dayLabel(key) };
    }
    if (!bars.length) return null;
    let hi = 0, lo = 0;
    bars.forEach((b, i) => { if (b.high > bars[hi].high) hi = i; if (b.low < bars[lo].low) lo = i; });
    return { high: bars[hi].high, low: bars[lo].low, up: lo < hi, what: "bars shown" };  // whichever end came first
  }

  function levelsOf(m) {
    const span = m.high - m.low;
    return RATIOS.map(r => ({ ratio: r, price: Math.round((m.up ? m.high - r * span : m.low + r * span) * 100) / 100 }));
  }

  // ---- Layer 2 of the owner's logic: the evidence, one row per level (see LOGIC.md)
  // For every closed candle (the one still forming is judged once it closes), judged against
  // where the previous candle closed: a candle that reaches a level and closes back on the side
  // it came from HELD it; one that closes on the other side CROSSED it. Nothing is drawn on the chart.
  const SECONDS = { "1m": 60, "5m": 300, "15m": 900 };

  function scoreLevels(levels) {
    const now = Date.now() / 1000;
    const closed = sessionBars().filter(b => b.time + SECONDS[state.interval] <= now);
    const rows = levels.map(l => ({ ...l, held: 0, crossed: 0 }));
    for (let i = 1; i < closed.length; i++) {
      const bar = closed[i], prev = closed[i - 1].close;
      for (const row of rows) {
        const L = row.price;
        if ((prev < L && bar.close > L) || (prev > L && bar.close < L)) row.crossed++;
        else if ((prev > L && bar.low <= L && bar.close > L) || (prev < L && bar.high >= L && bar.close < L)) row.held++;
      }
    }
    return { rows, closed: closed.length };
  }

  function drawScore(levels) {
    const box = document.getElementById("score-box");
    if (!levels.length) { box.hidden = true; return; }
    const { rows, closed } = scoreLevels(levels);
    box.hidden = false;
    document.getElementById("score-note").textContent =
      `In the ${closed} closed candles of ${sessionName(currentSession())}. Held: a candle reached the level and closed back on the side it came from. Crossed: it closed on the other side.`;
    document.getElementById("score").querySelector("tbody").replaceChildren(...rows.slice().reverse().map(r => {
      const tr = document.createElement("tr");
      const total = r.held + r.crossed;
      tr.innerHTML = `<td>${(r.ratio * 100).toFixed(1)}%</td><td>${fmt.format(r.price)}</td><td>${r.held}</td><td>${r.crossed}</td>`
        + `<td>${total ? Math.round(r.held / total * 100) + "%" : "—"}</td>`;
      return tr;
    }));
  }

  // ---- Layer 3 of the owner's logic: paper calls (see LOGIC.md)
  // The rule, run over the closed candles shown with the levels on the chart:
  //   signal  - a closed candle that HELD a level ("trade the bounce") or CROSSED one ("trade the
  //             break"), or either, as the switch says; when one candle signals at several levels,
  //             the one nearest its close counts: one candle, one call. A level that has given a
  //             call in a direction gives no more that way until the index closes back across it
  //   confirm - the next candle must agree: after a cross it closes on the new side too; after a
  //             hold it closes further from the level than the signal candle did. Else no call
  //   option  - always bought, never sold: a CE when the candle closed above the level (the index
  //             should rise), a PE when it closed below (it should fall)
  //   entry   - the open of the candle after the confirming one
  //   target  - the next level in the call's direction; the call ends when a later candle reaches it.
  //             No stop (owner's decision, 5 October): a call going the wrong way is held
  //   day end - a call still open at the day's last candle ends at its close; nothing carries overnight
  //   every confirmed signal gives a call, whether or not earlier calls are still open;
  //   a signal pointing outward from the 0% or 100% level has no next level, so it gives no call
  const SESSION_END = 15 * 3600 + 30 * 60;  // 3:30 pm IST, in seconds since midnight
  const dayOf = (t) => Math.floor((t + IST_OFFSET) / 86400);
  const dayOver = (day, now) => { const n = now + IST_OFFSET; return day < Math.floor(n / 86400) || n % 86400 >= SESSION_END; };
  const HOW = { target: "Target", "day end": "Day end", open: "Still open", pending: "Enters at the next open", unconfirmed: "Needs the next candle to confirm" };
  let lastPaper = { trades: [], levels: [] };

  function signalAt(bar, prev, prices, used) {
    const crossed = L => (prev < L && bar.close > L) || (prev > L && bar.close < L);
    const held = L => !crossed(L) && ((prev > L && bar.low <= L && bar.close > L) || (prev < L && bar.high >= L && bar.close < L));
    const hits = prices.filter(L => {
      const kind = crossed(L) ? "crossed" : held(L) ? "held" : null;
      return kind && (state.signal === "both" || state.signal === kind) && !used[L + (bar.close > L ? "CE" : "PE")];
    });
    if (!hits.length) return null;
    const level = hits.reduce((a, b) => Math.abs(b - bar.close) < Math.abs(a - bar.close) ? b : a);
    const kind = crossed(level) ? "crossed" : "held";
    const side = bar.close > level ? "CE" : "PE";
    const target = side === "CE" ? prices.find(p => p > level) : prices.slice().reverse().find(p => p < level);
    if (target == null) return null;
    return { signalTime: bar.time, level, kind, side, target, close: bar.close, entry: null, exit: null, points: null, how: "unconfirmed" };
  }
  const confirms = (sig, bar) => sig.kind === "crossed"
    ? (sig.side === "CE" ? bar.close > sig.level : bar.close < sig.level)   // still on the new side
    : (sig.side === "CE" ? bar.close > sig.close : bar.close < sig.close);  // moved further from the level

  function paperTrades(levels) {
    const now = Date.now() / 1000;
    const closed = sessionBars().filter(b => b.time + SECONDS[state.interval] <= now);
    const prices = levels.map(l => l.price).sort((a, b) => a - b);
    const gain = (t, price) => Math.round((t.side === "CE" ? price - t.entry : t.entry - price) * 100) / 100;  // index points
    const end = (t, price, bar, how) => { t.exit = price; t.exitTime = bar.time; t.how = how; t.points = gain(t, price); };
    const trades = [];
    const used = {};  // level price + side -> true while that level has given a call that way
    let waiting = null, ready = null, open = [];
    for (let i = 1; i < closed.length; i++) {
      const bar = closed[i], prevBar = closed[i - 1];
      if (dayOf(bar.time) !== dayOf(prevBar.time)) {  // a new day: yesterday's calls ended with yesterday
        open.forEach(t => end(t, prevBar.close, prevBar, "day end")); open = [];
        waiting = null; ready = null;  // a signal late on a day has no candles left to confirm and enter on
      }
      if (ready) { const t = { ...ready, entry: bar.open, entryTime: bar.time, how: "open" }; trades.push(t); open.push(t); ready = null; }
      if (waiting) {  // the signal candle's next candle: does it agree?
        if (confirms(waiting, bar)) { ready = { ...waiting, how: "pending" }; used[waiting.level + waiting.side] = true; }
        waiting = null;
      }
      open = open.filter(t => {
        if (t.side === "CE" ? bar.high >= t.target : bar.low <= t.target) { end(t, t.target, bar, "target"); return false; }
        return true;
      });
      prices.forEach(L => { if (bar.close < L) used[L + "CE"] = false; if (bar.close > L) used[L + "PE"] = false; });  // closed back across: the level may call again
      waiting = signalAt(bar, prevBar.close, prices, used);  // every confirmed signal gives a call, open calls or not
    }
    const last = closed[closed.length - 1];
    const over = last ? dayOver(dayOf(last.time), now) : true;
    open.forEach(t => { if (over) end(t, last.close, last, "day end"); else t.points = gain(t, last.close); });
    if (ready && !over) trades.push(ready);
    if (waiting && !over) trades.push(waiting);
    return { trades, closed: closed.length };
  }

  function drawPaper(levels) {
    const box = document.getElementById("paper-box");
    if (!levels.length) { box.hidden = true; lastPaper = { trades: [], levels: [] }; return; }
    box.hidden = false;
    const table = document.getElementById("paper"), note = document.getElementById("paper-note"), score = document.getElementById("paper-score");
    if (state.signal === "off") {
      table.hidden = true; lastPaper = { trades: [], levels };
      score.textContent = "";
      note.textContent = "Off. Pick a signal to see the calls it would have given in this session.";
      return;
    }
    const { trades, closed } = paperTrades(levels);
    lastPaper = { trades, levels };
    const done = trades.filter(t => t.exit != null);
    const won = done.filter(t => t.points > 0).length, lost = done.filter(t => t.points < 0).length;
    const net = Math.round(done.reduce((s, t) => s + t.points, 0) * 100) / 100;
    const running = trades.filter(t => t.how === "open").length, waiting = trades.some(t => t.how === "pending"), unsure = trades.some(t => t.how === "unconfirmed");
    note.textContent = { held: "Signal: a closed candle touched a level and closed back on its own side. ",
                         crossed: "Signal: a closed candle closed on the other side of a level. ",
                         both: "Signal: a closed candle touched a level and closed back on its own side, or closed on the other side of it. " }[state.signal]
      + "The next candle must agree: after a cross it closes on the new side too, after a turn back it closes further from the level. "
      + "Closed above the level: buy a CE. Below it: buy a PE. Entry when the candle after that opens. A level gives one call in a direction until the index closes back across it. "
      + "Exit the option when the index reaches the target (the next level that way), or at the day's end. No stop. "
      + "Points are index points, not the option's premium.";
    score.textContent = (done.length
      ? `${done.length} finished call${done.length === 1 ? "" : "s"} in the ${closed} closed candles of ${sessionName(currentSession())}: ${won} won, ${lost} lost, net ${signed.format(net)} points.`
      : `No finished call in the ${closed} closed candles of ${sessionName(currentSession())}.`)
      + (running ? ` ${running} still open.` : "") + (waiting ? " One is waiting to enter." : "") + (unsure ? " One needs the next candle to confirm." : "");
    const pct = Object.fromEntries(levels.map(l => [l.price, (l.ratio * 100).toFixed(1) + "%"]));
    table.hidden = !trades.length;
    table.classList.toggle("no-options", !(state.dhan && state.dhan.configured));
    drawFeedNote();
    table.querySelector("tbody").replaceChildren(...trades.slice().reverse().map(t => {
      const tr = document.createElement("tr");
      const cls = t.points > 0 ? "up" : t.points < 0 ? "down" : "";
      tr.innerHTML = `<td>${istTime(t.signalTime, state.range !== "today")}</td><td>${pct[t.level]} (${fmt.format(t.level)}) ${t.kind}</td>`
        + `<td>Buy ${t.side}</td><td>${t.entry != null ? fmt.format(t.entry) : t.how === "pending" ? "next open" : "—"}</td>`
        + `<td>${fmt.format(t.target)}</td><td>${t.exit == null ? "—" : fmt.format(t.exit)}</td>`
        + `<td class="${cls}">${t.points == null ? "—" : signed.format(t.points)}</td><td>${HOW[t.how]}</td>`
        + optionCells(optionRecords[callKey(t)]);
      return tr;
    }));
    syncOptions(trades);
  }

  // ---- the option behind each call: recorded by the server from Dhan (see LOGIC.md, "Exit by premium")
  // The page tells the server when a call enters (the contract and the premium paid are recorded then)
  // and when it ends; the server reads the premium now and keeps the Sell mark.
  let optionRecords = {};          // call key -> the server's record
  let lastRecordsJson = "";
  const registered = new Set(), endedSent = new Set();
  let syncing = false;
  const callKey = (t) => `${state.interval}|${t.signalTime}|${t.level}|${t.side}`;
  const expiryLabel = (d) => new Date(d + "T00:00:00Z").toLocaleDateString("en-IN", { day: "2-digit", month: "short", timeZone: "UTC" });

  function optionCells(r) {
    if (!r) return `<td class="opt">—</td><td class="opt">—</td><td class="opt">—</td><td class="opt">—</td>`;
    const sell = r.sold ? `<td class="opt sell">SOLD at ${fmt.format(r.sold.premium)}</td>`
      : r.premium_now <= r.sell_below ? `<td class="opt sell">SELL</td>`
      : `<td class="opt hold">hold, sell below ${fmt.format(r.sell_below)}</td>`;
    return `<td class="opt">${Math.round(r.strike)} ${r.side} ${expiryLabel(r.expiry)}</td><td class="opt">${fmt.format(r.premium_paid)}</td><td class="opt">${fmt.format(r.premium_now)}</td>${sell}`;
  }

  const DHAN_INDICES = ["NIFTY 50", "NIFTY BANK"];  // the indices the broker feed covers (dhan.INDEX_IDS)
  function drawFeedNote() {
    const el = document.getElementById("feed-note");
    const d = state.dhan;
    el.hidden = !(d && (d.configured || DHAN_INDICES.includes(name))) || state.simulated;
    if (el.hidden) return;
    if (d && !d.configured) {  // say so on every server, so a copy without the values is not mistaken for a broken one
      el.textContent = "Dhan: not set up on this server, so prices are from Yahoo, about 15 minutes delayed. "
        + "Add DHAN_CLIENT_ID and DHAN_ACCESS_TOKEN to Render's Environment page (or to .env on the laptop) and it switches to Dhan by itself.";
      return;
    }
    el.textContent = (state.feed === "dhan" ? "Dhan: real-time candles and quotes from your account. " : (d.status || "") + " ")
      + (state.optionStatus || "");
  }

  async function syncOptions(trades) {
    if (syncing || state.feed !== "dhan") return;
    syncing = true;
    try {
      const post = (path, body) => fetch(path, { method: "POST", headers: { "Content-Type": "application/json", ...withTab().headers }, body: JSON.stringify(body) });
      for (const t of trades) {
        const key = callKey(t);
        if (t.how === "open" && !registered.has(key) && !optionRecords[key]) {
          registered.add(key);
          const r = await post(`/options/${encodeURIComponent(name)}/calls`, { key, side: t.side, index_at_entry: t.entry });
          if (r.status === 401) { location.href = "/login"; return; }
          if (!r.ok) registered.delete(key);  // try again next time
        }
        if (t.exit != null && optionRecords[key] && !optionRecords[key].ended && !endedSent.has(key)) {
          endedSent.add(key);
          await post(`/options/${encodeURIComponent(name)}/calls/ended`, { key, how: t.how });
        }
      }
      const r = await fetch(`/options/${encodeURIComponent(name)}`, withTab());
      if (r.status === 401) { location.href = "/login"; return; }
      if (!r.ok) return;
      const data = await r.json();
      const json = JSON.stringify(data);
      state.optionStatus = data.status || "";
      optionRecords = Object.fromEntries((data.records || []).map(rec => [rec.key, rec]));
      if (json !== lastRecordsJson) { lastRecordsJson = json; drawLevels(); }  // the rows show the premiums
    } catch (err) {
      // the next refresh tries again
    } finally {
      syncing = false;
    }
  }

  function drawLevels() {
    const note = document.getElementById("levels-note");
    drawSessions();
    const m = theMove();
    const levels = m ? levelsOf(m) : [];
    drawScore(levels);
    drawPaper(levels);
    const key = JSON.stringify([state.move, currentSession(), levels]);
    if (series && key !== lastLevelsKey) {
      priceLines.forEach(l => series.removePriceLine(l));
      priceLines = levels.map(l => series.createPriceLine({
        price: l.price, title: (l.ratio * 100).toFixed(1) + "%",
        color: cssVar(l.ratio === 0 || l.ratio === 1 ? "--ink-2" : "--muted"), lineWidth: 1,
        lineStyle: l.ratio === 0 || l.ratio === 1 ? LightweightCharts.LineStyle.Solid : LightweightCharts.LineStyle.Dashed,
        axisLabelVisible: true,
      }));
      lastLevelsKey = key;
    }
    note.dataset.count = priceLines.length;  // lines actually on the chart
    lastLevels = { m, levels };
    refreshLevelsNote();
  }

  let lastLevels = { m: null, levels: [] };
  function refreshLevelsNote() {
    const note = document.getElementById("levels-note");
    const { m, levels } = lastLevels;
    if (state.move === "off") { note.textContent = ""; return; }
    if (!m) {
      note.textContent = state.move === "today" ? "No levels yet: the market has not traded today." : "No levels: nothing to measure yet.";
      return;
    }
    const last = state.summary.last;
    const nearest = levels.reduce((a, b) => Math.abs(b.price - last) < Math.abs(a.price - last) ? b : a);
    const gap = Math.round((last - nearest.price) * 100) / 100;
    note.textContent = `${m.what[0].toUpperCase() + m.what.slice(1)}: ${m.up ? "up" : "down"} move ${fmt.format(m.low)} → ${fmt.format(m.high)}. `
      + `Last ${fmt.format(last)} is ${fmt.format(Math.abs(gap))} ${gap >= 0 ? "above" : "below"} the ${(nearest.ratio * 100).toFixed(1)}% level (${fmt.format(nearest.price)}).`;
  }

  function showLegend(bar) {
    const el = document.getElementById("legend");
    if (!bar) { el.textContent = ""; return; }
    const when = istTime(bar.time, state.range !== "today");
    el.textContent = state.kind === "candles"
      ? `${when}   O ${fmt.format(bar.open)}   H ${fmt.format(bar.high)}   L ${fmt.format(bar.low)}   C ${fmt.format(bar.close)}`
      : `${when}   ${fmt.format(bar.close)}`;
  }

  chart.subscribeCrosshairMove(param => {
    if (!param.time) { showLegend(bars[bars.length - 1]); return; }
    const bar = bars.find(b => b.time + IST_OFFSET === param.time);
    if (bar) showLegend(bar);
  });

  // ---- click pop-up: open and close of the bar you clicked
  const popup = document.getElementById("popup");
  let popupTime = null;

  function fillPopup(bar) {
    const move = Math.round((bar.close - bar.open) * 100) / 100;
    const dir = move > 0 ? "up" : move < 0 ? "down" : "flat";
    const glyph = { up: "▲", down: "▼", flat: "—" }[dir];
    popup.innerHTML = `
      <span class="x" title="Close">&times;</span>
      <div class="t">${istTime(bar.time, state.range !== "today")} IST · ${INTERVAL_NAMES[state.interval]} bar</div>
      <div class="row"><span>Open</span><b>${fmt.format(bar.open)}</b></div>
      <div class="row"><span>High</span><b>${fmt.format(bar.high)}</b></div>
      <div class="row"><span>Low</span><b>${fmt.format(bar.low)}</b></div>
      <div class="row"><span>Close</span><b>${fmt.format(bar.close)}</b></div>
      <div class="row ${dir}"><span>Open → Close</span><b>${glyph} ${signed.format(move)}</b></div>`;
  }

  function showPopup(bar, point) {
    popupTime = bar.time;
    fillPopup(bar);
    popup.className = "on";
    const area = popup.parentElement.getBoundingClientRect();
    let left = point.x + 14, top = point.y - 12;
    if (left + popup.offsetWidth > area.width - 6) left = point.x - popup.offsetWidth - 14;
    if (top + popup.offsetHeight > area.height - 6) top = area.height - popup.offsetHeight - 6;
    popup.style.left = Math.max(4, left) + "px";
    popup.style.top = Math.max(4, top) + "px";
  }

  function hidePopup() {
    popupTime = null;
    popup.className = "";
  }

  function refreshPopup() {
    if (popupTime === null) return;
    const bar = bars.find(b => b.time === popupTime);
    if (bar) fillPopup(bar); else hidePopup();
  }

  chart.subscribeClick(param => {
    if (!param.time || !param.point) { hidePopup(); return; }
    const bar = bars.find(b => b.time + IST_OFFSET === param.time);
    if (bar) showPopup(bar, param.point); else hidePopup();
  });
  popup.addEventListener("click", e => { if (e.target.classList.contains("x")) hidePopup(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") hidePopup(); });

  // ---- data
  function setBars(list) {
    const empty = document.getElementById("empty");
    if (!list.length) {  // a holiday, a weekend, or before the open: nothing to draw yet
      bars = [];
      if (series) series.setData([]);
      state.lastTimes = "";
      showLegend(null);
      hidePopup();
      empty.textContent = state.range === "today"
        ? "No candles for today yet. The market has not traded today: a holiday, a weekend, or it is before 9:15 am. Switch to 5 days to see the last sessions."
        : "No candles to show for this range.";
      empty.hidden = false;
      return;
    }
    empty.hidden = true;
    const times = list.map(b => b.time).join(",");
    const sameShape = times === state.lastTimes && bars.length === list.length;
    bars = list;
    if (!series) { makeSeries(); }
    else if (sameShape) { series.update(toPoints([list[list.length - 1]])[0]); }
    else { series.setData(toPoints(list)); if (state.lastTimes === "") chart.timeScale().fitContent(); }
    state.lastTimes = times;
    showLegend(list[list.length - 1]);
    refreshPopup();
  }

  function renderHero(s) {
    const dir = s.change > 0 ? "up" : s.change < 0 ? "down" : "flat";
    const glyph = { up: "▲", down: "▼", flat: "—" }[dir];
    document.getElementById("last").textContent = money(s.last);
    const delta = document.getElementById("delta");
    delta.className = dir;
    delta.textContent = `${glyph} ${signed.format(s.change)} (${signed.format(s.change_percent)}%)`;
    document.getElementById("asof").textContent = "as of " + new Date(s.time).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", second: "2-digit", timeZone: "Asia/Kolkata" }) + " IST";
  }

  // ---- live ticks from Dhan: the price and the candle forming now move every second (see main.py tick_forever)
  function applyTick(t) {
    if (t.name !== name || state.feed !== "dhan" || !state.summary) return;
    const s = state.summary;
    s.last = t.last; s.time = t.time;
    if (s.previous_close) {
      s.change = Math.round((t.last - s.previous_close) * 100) / 100;
      s.change_percent = Math.round(s.change / s.previous_close * 10000) / 100;
    }
    renderHero(s);
    document.getElementById("status").textContent = "Live · tick " + clock();
    const bar = t.bars && t.bars[state.interval];
    if (!bar || !series || !bars.length) { refreshLevelsNote(); return; }
    const last = bars[bars.length - 1];
    if (last.time === bar.time) {  // the candle forming now: Dhan's open stays, the tick moves the rest
      last.high = Math.max(last.high, bar.high); last.low = Math.min(last.low, bar.low); last.close = bar.close;
      series.update(toPoints([last])[0]);
    } else if (bar.time > last.time && bar.time - last.time <= SECONDS[state.interval] * 3) {  // a new candle began
      bars.push({ ...bar });
      state.lastTimes = bars.map(b => b.time).join(",");
      series.update(toPoints([bar])[0]);
      clearTimeout(state.timer);
      state.timer = setTimeout(load, 1500);  // the candle before it just closed: fetch and judge it
    } else {
      refreshLevelsNote();
      return;  // this page is on another day or far behind: the next load sorts the candles out
    }
    showLegend(bars[bars.length - 1]);
    refreshPopup();
    refreshLevelsNote();
  }

  function renderSummary(s) {
    renderHero(s);

    const items = [
      ["Prev open", s.previous_open], ["Prev high", s.previous_high], ["Prev low", s.previous_low], ["Prev close", s.previous_close],
      ["Today open", s.today_open], ["Today high", s.today_high], ["Today low", s.today_low],
      ["52w high", s.week52_high], ["52w low", s.week52_low],
    ];
    document.getElementById("summary").replaceChildren(...items.map(([k, v]) => {
      const el = document.createElement("div");
      el.className = "stat";
      el.innerHTML = `<div class="k">${k}</div><div class="v">${money(v)}</div>`;
      return el;
    }));
  }

  // The login's "tab" note: kept in this tab only, so a freshly opened tab has none and is asked for the password.
  // A tile hands it over in the link's #t=...; take it, keep it, and drop it from the address bar.
  let TAB = "";
  try { TAB = sessionStorage.getItem("tab") || ""; } catch (e) {}
  const handed = new URLSearchParams(location.hash.slice(1)).get("t");
  if (handed) {
    TAB = handed;
    try { sessionStorage.setItem("tab", TAB); } catch (e) {}
    history.replaceState(null, "", location.pathname);
  }
  // This page's id: kept in memory only, so the page can come back after its connection drops.
  let PAGE = "";
  const BEAT_MS = 15000;
  const withTab = () => ({ headers: { "X-Tab": TAB, "X-Page": PAGE } });
  const wsUrl = () => (location.protocol === "https:" ? "wss" : "ws") + "://" + location.host
    + "/ws?tab=" + encodeURIComponent(TAB) + "&page=" + encodeURIComponent(PAGE) + "&live=" + encodeURIComponent(name);

  // "Still here": keeps the login alive even while /ws is down.
  async function beat() {
    try {
      const r = await fetch("/alive", { method: "POST", ...withTab() });
      if (r.status === 401) { location.href = "/login"; return; }
      if (r.ok) { const data = await r.json(); if (data.page) PAGE = data.page; }
    } catch (e) {}
  }

  async function load() {
    const status = document.getElementById("status");
    try {
      const response = await fetch(`/indices/${encodeURIComponent(name)}/detail?range=${state.range}&interval=${state.interval}`, withTab());
      if (response.status === 401) { location.href = "/login"; return; }
      if (!response.ok) throw new Error("HTTP " + response.status);
      const data = await response.json();
      document.getElementById("logout").hidden = !data.auth_enabled;
      state.summary = data.summary;
      state.days = data.days || [];
      state.feed = data.source || "";
      state.dhan = data.dhan || null;
      state.simulated = !!data.simulated;
      renderSummary(data.summary);
      if (data.range !== state.range || data.interval !== state.interval) return;  // an older request finishing late
      setBars(data.candles);
      drawLevels();
      state.pollMs = Math.max(1000, data.poll_seconds * 1000);
      status.className = "";
      status.textContent = "Live · updated " + clock();
      document.getElementById("mode").className = data.simulated ? "on" : "";
      document.getElementById("footer").textContent = data.simulated
        ? `Simulated prices, ${INTERVAL_NAMES[data.interval]} bars built from the simulator's ticks. Not real market data.`
        : data.source === "dhan"
        ? `Data from Dhan, your own account, in real time, ${INTERVAL_NAMES[data.interval]} bars: the price and the candle forming now tick every second, the rest refreshes every ${data.poll_seconds} s.`
        : `Data from Yahoo Finance, about 15 minutes delayed, ${INTERVAL_NAMES[data.interval]} bars. Refreshes every ${data.poll_seconds} s.`;
    } catch (err) {
      status.className = "error";
      status.textContent = "Couldn't load (" + err.message + "). Retrying…";
    }
    clearTimeout(state.timer);
    state.timer = setTimeout(load, state.pollMs);
  }

  // Holds a /ws connection while this page is open, and reports in every BEAT_MS: the login
  // lives while some page does either.
  function keepAlive() {
    const ws = new WebSocket(wsUrl());
    ws.onmessage = event => { const data = JSON.parse(event.data); if (data.page) PAGE = data.page; if (data.tick) applyTick(data.tick); };
    ws.onclose = () => {
      beat();  // says "still here" at once, and finds out if the login is over
      setTimeout(keepAlive, 3000);
    };
    ws.onerror = () => ws.close();
  }
  beat().then(keepAlive);  // report in first (a new page gets its id), then open the stream
  setInterval(beat, BEAT_MS);

  // ---- controls
  document.getElementById("logout").addEventListener("click", () => {
    fetch("/logout", { method: "POST" }).finally(() => location.href = "/login");
  });
  document.getElementById("kind").addEventListener("click", e => {
    const kind = e.target.dataset.kind;
    if (!kind || kind === state.kind) return;
    state.kind = kind;
    [...e.currentTarget.children].forEach(b => b.classList.toggle("on", b.dataset.kind === kind));
    makeSeries();
  });
  document.getElementById("range").addEventListener("click", e => {
    const range = e.target.dataset.range;
    if (!range || range === state.range) return;
    state.range = range;
    state.lastTimes = "";
    [...e.currentTarget.children].forEach(b => b.classList.toggle("on", b.dataset.range === range));
    load();
  });
  document.getElementById("move").addEventListener("click", e => {
    const move = e.target.dataset.move;
    if (!move || move === state.move) return;
    state.move = move;
    try { localStorage.setItem("move", move); } catch (err) {}
    [...e.currentTarget.children].forEach(b => b.classList.toggle("on", b.dataset.move === move));
    drawLevels();
  });
  document.getElementById("session").addEventListener("click", e => {
    const session = e.target.dataset.session;
    if (!session || session === currentSession()) return;
    state.session = session;
    drawLevels();
  });
  document.getElementById("signal").addEventListener("click", e => {
    const signal = e.target.dataset.signal;
    if (!signal || signal === state.signal) return;
    state.signal = signal;
    try { localStorage.setItem("signal", signal); } catch (err) {}
    [...e.currentTarget.children].forEach(b => b.classList.toggle("on", b.dataset.signal === signal));
    drawLevels();
  });
  document.getElementById("csv").addEventListener("click", () => {  // the list as a file, for the owner's own record
    const stamp = (t) => new Date(t * 1000).toLocaleString("sv-SE", { timeZone: "Asia/Kolkata", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
    const pct = Object.fromEntries(lastPaper.levels.map(l => [l.price, (l.ratio * 100).toFixed(1) + "%"]));
    const head = ["signal_time_ist", "level", "level_price", "signal", "option_bought", "index_at_entry", "target", "index_at_exit", "points", "ended_by",
                  "contract", "premium_paid", "premium_now", "sell_below", "sold_at_premium"];
    const rows = lastPaper.trades.map(t => {
      const r = optionRecords[callKey(t)];
      return [stamp(t.signalTime), pct[t.level], t.level, t.kind, t.side, t.entry ?? "", t.target, t.exit ?? "", t.points ?? "", t.how,
              r ? `${Math.round(r.strike)} ${r.side} ${r.expiry}` : "", r ? r.premium_paid : "", r ? r.premium_now : "", r ? r.sell_below : "", r && r.sold ? r.sold.premium : ""];
    });
    const blob = new Blob([[head, ...rows].map(r => r.join(",")).join("\n") + "\n"], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `paper-calls ${name} ${state.range} ${state.interval} ${state.signal}.csv`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  document.getElementById("interval").addEventListener("click", e => {
    const interval = e.target.dataset.interval;
    if (!interval || interval === state.interval) return;
    state.interval = interval;
    state.lastTimes = "";
    [...e.currentTarget.children].forEach(b => b.classList.toggle("on", b.dataset.interval === interval));
    load();
  });

  [...document.getElementById("move").children].forEach(b => b.classList.toggle("on", b.dataset.move === state.move));
  [...document.getElementById("signal").children].forEach(b => b.classList.toggle("on", b.dataset.signal === state.signal));
  load();
</script>
</body>
</html>
