<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My-Trade</title>
<script src="/static/vendor/lightweight-charts.js"></script>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --border: rgba(11, 11, 11, 0.10);
    --grid: #e1e0d9;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --up: #006300;
    --down: #d03b3b;
    --candle-up: #0ca30c;
    --candle-down: #d03b3b;
    --line: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --border: rgba(255, 255, 255, 0.10);
      --grid: #2c2c2a;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --up: #0ca30c;
      --down: #e66767;
      --candle-up: #0ca30c;
      --candle-down: #e66767;
      --line: #3987e5;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --border: rgba(255, 255, 255, 0.10);
    --grid: #2c2c2a;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --up: #0ca30c;
    --down: #e66767;
    --candle-up: #0ca30c;
    --candle-down: #e66767;
    --line: #3987e5;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }

  .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
  .top a { color: var(--ink-2); font-size: 14px; text-decoration: none; }
  .top a:hover { color: var(--ink); }
  #status { color: var(--ink-2); font-size: 14px; margin-left: auto; }
  #status.error { color: var(--down); }
  #mode { display: none; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: #fff; background: var(--down); border-radius: 4px; padding: 2px 8px; }
  #mode.on { display: inline-block; }

  .hero { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin: 12px 0 18px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0; }
  #last { font-size: 40px; font-weight: 600; line-height: 1.1; }
  #delta { font-size: 16px; font-weight: 500; }
  #delta.up { color: var(--up); }
  #delta.down { color: var(--down); }
  #delta.flat { color: var(--muted); }
  #asof { flex-basis: 100%; font-size: 12px; color: var(--muted); }

  .summary {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 8px;
    margin-bottom: 18px;
  }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .stat .v { font-size: 16px; font-weight: 600; margin-top: 2px; }

  .controls { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button {
    font: inherit; font-size: 13px; padding: 6px 12px; border: 0; cursor: pointer;
    background: var(--surface); color: var(--ink-2);
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.on { background: var(--ink); color: var(--page); }

  .chart-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px; }
  #legend { font-size: 12px; color: var(--ink-2); padding: 4px 8px; min-height: 20px; font-variant-numeric: tabular-nums; }
  .chart-area { position: relative; }
  #chart { height: 420px; }
  #popup {
    display: none; position: absolute; z-index: 5; min-width: 170px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 12px; font-variant-numeric: tabular-nums;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
  }
  #popup.on { display: block; }
  #popup .t { color: var(--muted); margin-bottom: 4px; padding-right: 16px; }
  #popup .row { display: flex; justify-content: space-between; gap: 14px; line-height: 1.6; }
  #popup .row b { font-weight: 600; }
  #popup .row.up b { color: var(--up); }
  #popup .row.down b { color: var(--down); }
  #popup .x { position: absolute; top: 2px; right: 7px; cursor: pointer; color: var(--muted); font-size: 16px; line-height: 1; }
  #popup .x:hover { color: var(--ink); }
  @media (max-width: 600px) { #chart { height: 300px; } #last { font-size: 32px; } }

  footer { margin-top: 24px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="top">
    <a href="/">&larr; Dashboard</a>
    <span id="mode">SIMULATED DATA</span>
    <span id="status">Loading…</span>
  </div>

  <div class="hero">
    <h1 id="name"></h1>
    <span id="last"></span>
    <span id="delta"></span>
    <span id="asof"></span>
  </div>

  <section class="summary" id="summary" aria-label="Summary"></section>

  <div class="controls">
    <div class="seg" id="kind">
      <button data-kind="line" class="on">Line</button>
      <button data-kind="candles">Candles</button>
    </div>
    <div class="seg" id="range">
      <button data-range="today" class="on">Today</button>
      <button data-range="5d">5 days</button>
    </div>
  </div>

  <div class="chart-wrap">
    <div id="legend"></div>
    <div class="chart-area">
      <div id="chart"></div>
      <div id="popup"></div>
    </div>
  </div>

  <footer id="footer"></footer>
</main>

<script>
  const IST_OFFSET = 19800;  // the chart labels times as UTC; shifting by 5h30 makes the labels read as IST
  const name = decodeURIComponent(location.pathname.split("/").pop());
  const state = { kind: "line", range: "today", interval: "", pollMs: 60000, timer: null, lastTimes: "" };

  const fmt = new Intl.NumberFormat("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const signed = new Intl.NumberFormat("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2, signDisplay: "always" });
  const clock = () => new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const istTime = (epoch, withDate) => new Date(epoch * 1000).toLocaleString("en-IN", {
    timeZone: "Asia/Kolkata", hour: "2-digit", minute: "2-digit", ...(withDate ? { day: "2-digit", month: "short" } : {}),
  });
  const cssVar = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const money = (v) => v == null ? "—" : fmt.format(v);

  document.title = name + " · My-Trade";
  document.getElementById("name").textContent = name;

  // ---- chart
  const chart = LightweightCharts.createChart(document.getElementById("chart"), {
    autoSize: true,
    layout: { background: { color: "transparent" }, textColor: cssVar("--muted"), fontFamily: "system-ui, sans-serif" },
    grid: { vertLines: { color: cssVar("--grid") }, horzLines: { color: cssVar("--grid") } },
    rightPriceScale: { borderColor: cssVar("--grid") },
    timeScale: { borderColor: cssVar("--grid"), timeVisible: true, secondsVisible: false },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    localization: { locale: "en-IN", priceFormatter: (p) => fmt.format(p) },
  });
  let series = null;
  let bars = [];

  function applyTheme() {
    chart.applyOptions({
      layout: { textColor: cssVar("--muted") },
      grid: { vertLines: { color: cssVar("--grid") }, horzLines: { color: cssVar("--grid") } },
      rightPriceScale: { borderColor: cssVar("--grid") },
      timeScale: { borderColor: cssVar("--grid") },
    });
    if (series) makeSeries();
  }
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);

  function toPoints(list) {
    return state.kind === "candles"
      ? list.map(b => ({ time: b.time + IST_OFFSET, open: b.open, high: b.high, low: b.low, close: b.close }))
      : list.map(b => ({ time: b.time + IST_OFFSET, value: b.close }));
  }

  function makeSeries() {
    hidePopup();
    if (series) chart.removeSeries(series);
    series = state.kind === "candles"
      ? chart.addSeries(LightweightCharts.CandlestickSeries, {
          upColor: cssVar("--candle-up"), downColor: cssVar("--candle-down"), borderVisible: false,
          wickUpColor: cssVar("--candle-up"), wickDownColor: cssVar("--candle-down"),
        })
      : chart.addSeries(LightweightCharts.LineSeries, { color: cssVar("--line"), lineWidth: 2, crosshairMarkerRadius: 4 });
    series.setData(toPoints(bars));
    chart.timeScale().fitContent();
    showLegend(bars[bars.length - 1]);
  }

  function showLegend(bar) {
    const el = document.getElementById("legend");
    if (!bar) { el.textContent = ""; return; }
    const when = istTime(bar.time, state.range !== "today");
    el.textContent = state.kind === "candles"
      ? `${when}   O ${fmt.format(bar.open)}   H ${fmt.format(bar.high)}   L ${fmt.format(bar.low)}   C ${fmt.format(bar.close)}`
      : `${when}   ${fmt.format(bar.close)}`;
  }

  chart.subscribeCrosshairMove(param => {
    if (!param.time) { showLegend(bars[bars.length - 1]); return; }
    const bar = bars.find(b => b.time + IST_OFFSET === param.time);
    if (bar) showLegend(bar);
  });

  // ---- click pop-up: open and close of the bar you clicked
  const popup = document.getElementById("popup");
  let popupTime = null;

  function fillPopup(bar) {
    const move = Math.round((bar.close - bar.open) * 100) / 100;
    const dir = move > 0 ? "up" : move < 0 ? "down" : "flat";
    const glyph = { up: "▲", down: "▼", flat: "—" }[dir];
    popup.innerHTML = `
      <span class="x" title="Close">&times;</span>
      <div class="t">${istTime(bar.time, state.range !== "today")} IST · ${state.interval} bar</div>
      <div class="row"><span>Open</span><b>${fmt.format(bar.open)}</b></div>
      <div class="row"><span>Close</span><b>${fmt.format(bar.close)}</b></div>
      <div class="row ${dir}"><span>Open → Close</span><b>${glyph} ${signed.format(move)}</b></div>`;
  }

  function showPopup(bar, point) {
    popupTime = bar.time;
    fillPopup(bar);
    popup.className = "on";
    const area = popup.parentElement.getBoundingClientRect();
    let left = point.x + 14, top = point.y - 12;
    if (left + popup.offsetWidth > area.width - 6) left = point.x - popup.offsetWidth - 14;
    if (top + popup.offsetHeight > area.height - 6) top = area.height - popup.offsetHeight - 6;
    popup.style.left = Math.max(4, left) + "px";
    popup.style.top = Math.max(4, top) + "px";
  }

  function hidePopup() {
    popupTime = null;
    popup.className = "";
  }

  function refreshPopup() {
    if (popupTime === null) return;
    const bar = bars.find(b => b.time === popupTime);
    if (bar) fillPopup(bar); else hidePopup();
  }

  chart.subscribeClick(param => {
    if (!param.time || !param.point) { hidePopup(); return; }
    const bar = bars.find(b => b.time + IST_OFFSET === param.time);
    if (bar) showPopup(bar, param.point); else hidePopup();
  });
  popup.addEventListener("click", e => { if (e.target.classList.contains("x")) hidePopup(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") hidePopup(); });

  // ---- data
  function setBars(list) {
    const times = list.map(b => b.time).join(",");
    const sameShape = times === state.lastTimes && bars.length === list.length;
    bars = list;
    if (!series) { makeSeries(); }
    else if (sameShape) { series.update(toPoints([list[list.length - 1]])[0]); }
    else { series.setData(toPoints(list)); if (state.lastTimes === "") chart.timeScale().fitContent(); }
    state.lastTimes = times;
    showLegend(list[list.length - 1]);
    refreshPopup();
  }

  function renderSummary(s) {
    const dir = s.change > 0 ? "up" : s.change < 0 ? "down" : "flat";
    const glyph = { up: "▲", down: "▼", flat: "—" }[dir];
    document.getElementById("last").textContent = money(s.last);
    const delta = document.getElementById("delta");
    delta.className = dir;
    delta.textContent = `${glyph} ${signed.format(s.change)} (${signed.format(s.change_percent)}%)`;
    document.getElementById("asof").textContent = "as of " + new Date(s.time).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", second: "2-digit", timeZone: "Asia/Kolkata" }) + " IST";

    const items = [
      ["Prev open", s.previous_open], ["Prev high", s.previous_high], ["Prev low", s.previous_low], ["Prev close", s.previous_close],
      ["Today open", s.today_open], ["Today high", s.today_high], ["Today low", s.today_low],
      ["52w high", s.week52_high], ["52w low", s.week52_low],
    ];
    document.getElementById("summary").replaceChildren(...items.map(([k, v]) => {
      const el = document.createElement("div");
      el.className = "stat";
      el.innerHTML = `<div class="k">${k}</div><div class="v">${money(v)}</div>`;
      return el;
    }));
  }

  async function load() {
    const status = document.getElementById("status");
    try {
      const response = await fetch(`/indices/${encodeURIComponent(name)}/detail?range=${state.range}`);
      if (!response.ok) throw new Error("HTTP " + response.status);
      const data = await response.json();
      renderSummary(data.summary);
      state.interval = data.interval;
      setBars(data.candles);
      state.pollMs = Math.max(1000, data.poll_seconds * 1000);
      status.className = "";
      status.textContent = "Live · updated " + clock();
      document.getElementById("mode").className = data.simulated ? "on" : "";
      document.getElementById("footer").textContent = data.simulated
        ? `Simulated prices, ${data.interval} bars built from the simulator's ticks. Not real market data.`
        : `Data from Yahoo Finance, about 15 minutes delayed, ${data.interval} bars. Refreshes every ${data.poll_seconds} s.`;
    } catch (err) {
      status.className = "error";
      status.textContent = "Couldn't load (" + err.message + "). Retrying…";
    }
    clearTimeout(state.timer);
    state.timer = setTimeout(load, state.pollMs);
  }

  // ---- controls
  document.getElementById("kind").addEventListener("click", e => {
    const kind = e.target.dataset.kind;
    if (!kind || kind === state.kind) return;
    state.kind = kind;
    [...e.currentTarget.children].forEach(b => b.classList.toggle("on", b.dataset.kind === kind));
    makeSeries();
  });
  document.getElementById("range").addEventListener("click", e => {
    const range = e.target.dataset.range;
    if (!range || range === state.range) return;
    state.range = range;
    state.lastTimes = "";
    [...e.currentTarget.children].forEach(b => b.classList.toggle("on", b.dataset.range === range));
    load();
  });

  load();
</script>
</body>
</html>
