# Builds the Android app and publishes the APK on the repository's Releases page, so the owner installs
# it on the phone without any Android tools. Runs when the app's files change on main, or by hand.
name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's machines already carry the Android SDK; only the platform and build tools this app
      # needs are fetched here, with the licences accepted
      - name: Android SDK pieces
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Build the signed APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk My-Trade.apk

      - uses: actions/upload-artifact@v4
        with:
          name: My-Trade.apk
          path: My-Trade.apk

      - name: Move the app-latest tag to this build
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag -f app-latest
          git push -f origin app-latest

      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: My-Trade Android app (latest build)
          body: |
            Download **My-Trade.apk** below on the phone and open it. Android asks once to allow installing from this source.
            Built from commit ${{ github.sha }}.
          files: My-Trade.apk
