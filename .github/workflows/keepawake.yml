name: Keep the server awake from 6:00 AM to 4:30 PM

# Render's free plan puts the server to sleep after 15 minutes without an incoming request. On 8 October no page was
# open (the owner's laptop was away) and the server slept from about 09:38 to 10:00, so the watcher missed the calls that
# entered then. The server now calls its own address in market hours (main.py, keep_awake_forever); this workflow wakes
# it before the open and knocks every ten minutes as a backup, in case a knock of its own goes astray. Since 15 October
# the knocks run from 06:00 to 16:30 IST every day (the owner: "server check should happen only from 6:00 AM in the morning
# till 4.30 PM everyday"); until then 08:30 to 16:20 on weekdays. It never fails:
# a sleeping server answers the next knock. The repository is public, so these runs cost nothing.

on:
  schedule:
    - cron: "30,40,50 0 * * *"    # 06:00, 06:10 and 06:20 IST, every day (the owner, 15 October: checks from 6:00 AM to 4:30 PM, every day)
    - cron: "*/10 1-10 * * *"     # every ten minutes, 06:30 to 16:20 IST, every day
    - cron: "0 11 * * *"          # 16:30 IST, the last knock of the day
  workflow_dispatch:

jobs:
  knock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE: https://my-trade-hvny.onrender.com
    steps:
      - name: Knock
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 150 "$SITE/health" || true)
          echo "the server answered: ${code:-nothing yet}"
