# A server check after the close (the owner, 15 October: "server check should happen only from 6:00 AM in the morning
# till 4.30 PM everyday. server check should not be off anytime"). It knocks on the server's door (which wakes a
# sleeping free host; the server then saves the day on its own and pushes it to the data branch), then reads the
# server's open health address: the server answered, the Dhan token is good and will still be good at the next
# trading day's close, and (the 16:10 run on a weekday) the day's session is saved and pushed. A failed check is a
# red run here, and GitHub emails the owner about failed runs. The save check was off from 15 October (the Study page
# and the save removed) to 21 October (the owner: "bring back the daily save, without study page"). Website side only.
name: Wake the server after the close

on:
  schedule:
    - cron: "12 10 * * *"   # 15:42 IST, every day
    - cron: "40 10 * * *"   # 16:10 IST, every day
  workflow_dispatch:         # or by hand, from the Actions tab

jobs:
  wake:
    runs-on: ubuntu-latest
    env:
      SITE: https://my-trade-hvny.onrender.com   # the dashboard's address (no secret: the page itself asks for the password)
    steps:
      - name: Wake the server
        run: |
          # a sleeping Render service takes up to a minute to come back; the first knock may time out, that is fine.
          # When the first knock gets a proper answer the server is awake already, and the wait is skipped (the owner,
          # 16 October: "why health check is taking too much time?")
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$SITE/health" || true)
          if [ "$code" = "200" ]; then echo "the server answered at once (200): no wait"; else echo "first knock: ${code:-no answer}; waiting 100 s for the server to come back"; sleep 100; fi
      - name: Read the server's health
        run: |
          curl -s --max-time 60 "$SITE/health" | tee health.json
          echo
      - name: Check that the server answered, the Dhan token is good, and (after 16:00 on a weekday) the day is saved
        run: |
          python3 - <<'PY'
          import json, sys
          from datetime import datetime, timedelta, timezone
          IST = timezone(timedelta(hours=5, minutes=30))
          now = datetime.now(IST)
          try:
              health = json.load(open("health.json"))
          except Exception as exc:
              sys.exit(f"The server did not answer its health address: {exc}")
          if health.get("status") != "ok":
              sys.exit(f"The server answered, but not with status ok: {json.dumps(health)[:300]}")
          print("server:", health.get("status"), "commit", health.get("commit"), "memory MB", json.dumps(health.get("memory_mb")))
          save, token = health.get("save") or {}, health.get("token") or {}
          print("the day's save:", json.dumps(save))
          # the token: the one thing only the owner can renew. Red when it is refused, or will have expired before the next trading day's close
          warn = None
          if token:
              print("token:", json.dumps(token))
              if not token.get("ok"):
                  warn = f"Dhan refuses the token: {token.get('problem')}. Paste a fresh DHAN_ACCESS_TOKEN into Render's Environment page."
              elif token.get("valid_till"):
                  try:
                      till = datetime.fromisoformat(token["valid_till"])
                      nxt = now + timedelta(days=1)
                      while nxt.weekday() >= 5: nxt += timedelta(days=1)
                      close = nxt.replace(hour=15, minute=40, second=0, microsecond=0)
                      print(f"The token is valid till {till.strftime('%d %b %H:%M')} IST.")
                      if till < close:
                          warn = f"The token expires at {till.strftime('%d %b %H:%M')} IST, before the next trading day's close ({close.strftime('%d %b %H:%M')}). Paste a fresh DHAN_ACCESS_TOKEN into Render's Environment page before then, or that day will not be saved."
                  except ValueError:
                      print("The token's validity could not be read:", token["valid_till"])
          elif health.get("dhan"):
              print("The token has not been checked yet (the server just started).")
          else:
              print("Dhan is not set up on this server.")
          if now.hour < 16:
              print("The wake-up run: the server is up; it saves the day at 15:40 on its own.")
              sys.exit(warn or 0)
          if now.weekday() >= 5:
              print("A weekend: nothing to save."); sys.exit(warn or 0)
          today = now.date().isoformat()
          pushed_today = (save.get("pushed_at") or "")[:10] == today
          # a restart after the push (an evening merge) clears pushed_at: the server then pulled the complete day back
          # from GitHub at start, so the day is there; only a push problem, or no token, means "on the server only"
          on_github = pushed_today or (save.get("github") and not save.get("problem") and not save.get("pushed_at"))
          if save.get("last_complete") == today:
              print(f"Today's session ({today}) is saved" + (" and pushed to GitHub." if pushed_today else " and on GitHub (pushed before the server's last restart)." if on_github else ", but on the server only: " + str(save.get("problem") or "no GitHub token set") + "."))
              sys.exit((warn or 0) if on_github else 1)
          if save.get("checked") == today:
              print(f"The server looked after the close and Dhan had no candle for today ({today}): a market holiday."); sys.exit(warn or 0)
          if not health.get("dhan"):
              sys.exit("Dhan is not set up on the server (DHAN_CLIENT_ID and DHAN_ACCESS_TOKEN missing), so nothing is saved.")
          sys.exit(f"Today's session ({today}) is NOT saved yet. The server says: {save.get('problem') or 'no problem reported; it may still be fetching the day, run this again in a few minutes'}")
          PY
